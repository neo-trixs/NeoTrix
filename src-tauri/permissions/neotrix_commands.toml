# NeoTrix app command permissions (manually defined; build-script autogen produced none)
[[permission]]
identifier = "allow-neotrix-commands"
description = "Enables all NeoTrix app commands."
commands.allow = [
  "chat_send",
  "chat_help",
  "domain_call",
  "domain_list",
  "domain_has",
  "domain_action_count",
  "pty_spawn",
  "pty_write",
  "pty_resize",
  "pty_close",
]
