[package]
name = "neotrix-tauri"
version.workspace = true
description = "NeoTrix Desktop - Tauri 2.0 Integration"
authors = ["NeoTrix Team"]
edition.workspace = true
license = "MIT"

[[bin]]
name = "neotrix-tauri"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "custom-protocol", "macos-private-api"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-http = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
clap = { version = "4", features = ["derive"] }
serde = { workspace = true }
serde_json = { workspace = true }
portable-pty = "0.9.0"
nt_core_capability_tree = { workspace = true }
neotrix-neobot = { workspace = true }
neotrix = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
uuid = { workspace = true }
tokio = { version = "1", features = ["sync", "rt", "macros", "process", "time"] }
tokio-stream = "0.1"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
reqwest = { version = "0.12", features = ["blocking", "stream", "json"] }
keyring = "3"
futures-util = "0.3"
glob = "0.3"
base64 = "0.22"
rusqlite = { version = "0.31", features = ["bundled"] }
regex = "1"
arboard = "3.4"
async-trait = "0.1"
sentry = "0.34"
toml = "0.8"
urlencoding = "2"
once_cell = "1"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
hostname = "0.4"
open = "5"
num_cpus = "1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
stealth-net = []
