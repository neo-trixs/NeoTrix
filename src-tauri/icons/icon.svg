<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#FDFBF5"/>
      <stop offset="100%" stop-color="#F2E7C8"/>
    </radialGradient>
    <linearGradient id="nucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD7AC"/>
      <stop offset="55%" stop-color="#D6AC58"/>
      <stop offset="100%" stop-color="#C2933F"/>
    </linearGradient>
    <linearGradient id="coreHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCFAF3" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Halo orbit ring + inner echo -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#E3CB94" stroke-width="3"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#EBD7AC" stroke-width="2.4" opacity="0.7"/>

  <!-- Polar axis: the infinite thread -->
  <line x1="256" y1="34" x2="256" y2="478" stroke="#DCC58F" stroke-width="2" stroke-dasharray="6 10" opacity="0.6"/>

  <!-- E8 diamond nucleus -->
  <polygon points="256,130 376,256 256,382 136,256" fill="url(#nucleus)" filter="url(#glow)"/>
  <polygon points="256,130 376,256 256,382 136,256" fill="url(#nucleus)"/>
  <polygon points="256,160 346,256 256,352 166,256" fill="url(#coreHighlight)"/>

  <!-- Hexagram ticks: six binary axes -->
  <g stroke="#C9A85C" stroke-width="2.4" opacity="0.55" stroke-linecap="round">
    <line x1="226" y1="390" x2="286" y2="390"/>
    <line x1="232" y1="396" x2="280" y2="396"/>
    <line x1="238" y1="402" x2="274" y2="402"/>
    <line x1="244" y1="408" x2="268" y2="408"/>
  </g>

  <!-- Orbit satellites -->
  <circle cx="390" cy="122" r="6" fill="#D6AC58"/>
  <circle cx="66" cy="256" r="5" fill="#C2933F" opacity="0.8"/>
  <circle cx="390" cy="390" r="5" fill="#A0752E" opacity="0.7"/>
</svg>