<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="44%" r="72%">
      <stop offset="0%" stop-color="#FCFAF3"/>
      <stop offset="100%" stop-color="#F2E7C8"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD9A8"/>
      <stop offset="0.5" stop-color="#C99B3F"/>
      <stop offset="1" stop-color="#96701F"/>
    </linearGradient>
    <radialGradient id="goldFill" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#F7EDCD"/>
      <stop offset="0.5" stop-color="#C99B3F"/>
      <stop offset="1" stop-color="#96701F"/>
    </radialGradient>
    <radialGradient id="coreHighlight" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCFAF3" stop-opacity="0.75"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#bg)"/>

  <!-- Galaxy orbit rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#C99B3F" stroke-width="2.6"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#EBD9A8" stroke-width="2" opacity="0.7"/>
  <ellipse cx="256" cy="256" rx="168" ry="48" fill="none" stroke="#C99B3F" stroke-width="1.8" opacity="0.5"/>

  <!-- Qian-hexagram stellar core (three yang lines + glowing nucleus) -->
  <g stroke="url(#gold)" stroke-width="4.5" stroke-linecap="round">
    <line x1="196" y1="224" x2="316" y2="224"/>
    <line x1="196" y1="256" x2="316" y2="256"/>
    <line x1="196" y1="288" x2="316" y2="288"/>
  </g>
  <polygon points="256,130 376,256 256,382 136,256" fill="url(#goldFill)" filter="url(#glow)"/>
  <polygon points="256,160 346,256 256,352 166,256" fill="url(#coreHighlight)" opacity="0.4"/>
  <circle cx="256" cy="256" r="34" fill="url(#goldFill)"/>
  <circle cx="256" cy="256" r="15" fill="#F7E9C8"/>

  <!-- Orbit satellites -->
  <circle cx="390" cy="122" r="6" fill="#C99B3F"/>
  <circle cx="66" cy="256" r="5" fill="#96701F" opacity="0.8"/>
  <circle cx="390" cy="390" r="5" fill="#A0752E" opacity="0.7"/>
  <circle cx="122" cy="90" r="3" fill="#EBD9A8"/>
  <circle cx="430" cy="300" r="3" fill="#EBD9A8"/>
</svg>