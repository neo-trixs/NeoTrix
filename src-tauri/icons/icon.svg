<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBD38D"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="coreGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="0.55"/>
      <stop offset="35%" stop-color="#FFEDD5" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFEDD5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreStar" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="55%" stop-color="#FFF3E0"/>
      <stop offset="100%" stop-color="#FFD9A0"/>
    </radialGradient>
    <linearGradient id="arm1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFC97A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFE4C0" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="arm2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8B45E" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFF0D8" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFE4C0"/>
    </linearGradient>
  </defs>

  <!-- Warm amber rounded-square background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- Galaxy glow field -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#coreGlow)"/>

  <!-- Spiral arms: Zi Wei galaxy (紫微星系) — counter-rotating around the polar core -->
  <g fill="none" stroke-linecap="round">
    <!-- Arm A -->
    <path d="M 256 256 C 300 216 356 224 384 276 C 408 322 386 392 330 410 C 288 423 240 398 228 356 C 218 320 240 282 272 268"
          stroke="url(#arm1)" stroke-width="34"/>
    <!-- Arm B (mirrored) -->
    <path d="M 256 256 C 212 296 156 288 128 236 C 104 190 126 120 182 102 C 224 89 272 114 284 156 C 294 192 272 230 240 244"
          stroke="url(#arm2)" stroke-width="30"/>
    <!-- Outer dust spiral hint -->
    <path d="M 256 256 C 348 270 428 220 452 132"
          stroke="url(#arm1)" stroke-width="8" opacity="0.35"/>
    <path d="M 256 256 C 164 242 84 292 60 380"
          stroke="url(#arm2)" stroke-width="8" opacity="0.30"/>
  </g>

  <!-- Star field scattered along the arms -->
  <g fill="url(#star)">
    <circle cx="310" cy="252" r="5"/>
    <circle cx="352" cy="296" r="4"/>
    <circle cx="370" cy="356" r="6"/>
    <circle cx="322" cy="392" r="5"/>
    <circle cx="276" cy="352" r="4"/>
    <circle cx="202" cy="260" r="5"/>
    <circle cx="160" cy="216" r="4"/>
    <circle cx="142" cy="156" r="6"/>
    <circle cx="190" cy="120" r="5"/>
    <circle cx="236" cy="160" r="4"/>
    <circle cx="404" cy="148" r="3.5"/>
    <circle cx="444" cy="120" r="4"/>
    <circle cx="470" cy="176" r="3"/>
    <circle cx="92" cy="344" r="3.5"/>
    <circle cx="56" cy="392" r="4"/>
    <circle cx="120" cy="452" r="3.5"/>
    <circle cx="300" cy="120" r="3"/>
    <circle cx="436" cy="376" r="3"/>
    <circle cx="356" cy="452" r="3"/>
    <circle cx="96" cy="120" r="3"/>
  </g>

  <!-- Constellation ring (紫微垣 enclosure) — connecting the fixed stars around the axis -->
  <g stroke="#FFF3E0" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
    <line x1="256" y1="128" x2="176" y2="172"/>
    <line x1="176" y1="172" x2="150" y2="256"/>
    <line x1="150" y1="256" x2="176" y2="340"/>
    <line x1="176" y1="340" x2="256" y2="384"/>
    <line x1="256" y1="384" x2="336" y2="340"/>
    <line x1="336" y1="340" x2="362" y2="256"/>
    <line x1="362" y1="256" x2="336" y2="172"/>
    <line x1="336" y1="172" x2="256" y2="128"/>
  </g>

  <!-- Fixed stars of the enclosure (七政/紫微垣 key stars) -->
  <g fill="url(#star)">
    <circle cx="256" cy="128" r="13"/>
    <circle cx="176" cy="172" r="11"/>
    <circle cx="150" cy="256" r="12"/>
    <circle cx="176" cy="340" r="11"/>
    <circle cx="256" cy="384" r="13"/>
    <circle cx="336" cy="340" r="11"/>
    <circle cx="362" cy="256" r="12"/>
    <circle cx="336" cy="172" r="11"/>
  </g>

  <!-- Zi Wei core (紫微星) — the polar axis star, E8 consciousness center -->
  <circle cx="256" cy="256" r="30" fill="url(#coreStar)"/>
  <circle cx="256" cy="256" r="44" fill="none" stroke="#FFE4C0" stroke-width="3" opacity="0.7"/>
  <circle cx="256" cy="256" r="58" fill="none" stroke="#FFE4C0" stroke-width="2" opacity="0.35"/>
  <!-- Axis beam (polar thread) -->
  <line x1="256" y1="60" x2="256" y2="452" stroke="#FFF3E0" stroke-width="3" opacity="0.35" stroke-dasharray="6 10"/>
</svg>
