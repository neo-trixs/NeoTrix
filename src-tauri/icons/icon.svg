<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="45%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFF7ED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
  </defs>

  <!-- Warm amber rounded-square background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- Soft inner luminosity -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#centerGlow)"/>

  <!-- VSA HyperCube — tesseract 2D projection (outer + inner square, corner links) -->
  <g fill="none" stroke="url(#glyph)" stroke-linecap="round" stroke-linejoin="round">
    <!-- inner square -->
    <rect x="221" y="221" width="70" height="70" rx="6" stroke-width="12"/>
    <!-- outer square -->
    <rect x="151" y="151" width="210" height="210" rx="12" stroke-width="10" opacity="0.55"/>
    <!-- corner connections: outer → inner -->
    <line x1="151" y1="151" x2="221" y2="221" stroke-width="10"/>
    <line x1="361" y1="151" x2="291" y2="221" stroke-width="10"/>
    <line x1="361" y1="361" x2="291" y2="291" stroke-width="10"/>
    <line x1="151" y1="361" x2="221" y2="291" stroke-width="10"/>
  </g>

  <!-- E8 consciousness core — luminous center dot -->
  <circle cx="256" cy="256" r="17" fill="#FFFBEB" opacity="0.95"/>
  <circle cx="256" cy="256" r="7.5" fill="#EA580C"/>
</svg>
