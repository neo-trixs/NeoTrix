<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBD38D"/>
      <stop offset="45%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%" stop-color="#FFF7ED" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFF7ED" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#FFE4C0"/>
    </linearGradient>
  </defs>

  <!-- Warm amber rounded-square background -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>

  <!-- Soft inner luminosity -->
  <rect width="512" height="512" rx="115" ry="115" fill="url(#centerGlow)"/>

  <!-- Outward rays: expansion (E8 substar cluster beams) -->
  <g stroke="url(#star)" stroke-linecap="round" opacity="0.30">
    <line x1="256" y1="256" x2="256" y2="88" stroke-width="7"/>
    <line x1="256" y1="256" x2="256" y2="424" stroke-width="7"/>
    <line x1="256" y1="256" x2="88" y2="256" stroke-width="7"/>
    <line x1="256" y1="256" x2="424" y2="256" stroke-width="7"/>
    <line x1="256" y1="256" x2="140" y2="140" stroke-width="5"/>
    <line x1="256" y1="256" x2="372" y2="140" stroke-width="5"/>
    <line x1="256" y1="256" x2="140" y2="372" stroke-width="5"/>
    <line x1="256" y1="256" x2="372" y2="372" stroke-width="5"/>
  </g>

  <!-- Big Dipper (北斗七星) star distribution — seven points with connecting constellation line -->
  <g stroke="#FFF3E0" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <line x1="168" y1="182" x2="236" y2="150"/>
    <line x1="236" y1="150" x2="300" y2="196"/>
    <line x1="300" y1="196" x2="248" y2="256"/>
    <line x1="248" y1="256" x2="318" y2="302"/>
    <line x1="318" y1="302" x2="364" y2="252"/>
    <line x1="364" y1="252" x2="368" y2="360"/>
  </g>

  <!-- Seven stars (北斗七星: 天枢 天璇 天玑 天权 玉衡 开阳 摇光) -->
  <!-- 1 天枢 (bottom of bowl) -->
  <circle cx="168" cy="182" r="16" fill="url(#star)"/>
  <!-- 2 天璇 (left of bowl) -->
  <circle cx="236" cy="150" r="17" fill="url(#star)"/>
  <!-- 3 天玑 (top of bowl) -->
  <circle cx="300" cy="196" r="15" fill="url(#star)"/>
  <!-- 4 天权 (right of bowl) -->
  <circle cx="248" cy="256" r="13" fill="url(#star)"/>
  <!-- 5 玉衡 (handle start) -->
  <circle cx="318" cy="302" r="14" fill="url(#star)"/>
  <!-- 6 开阳 (handle mid) -->
  <circle cx="364" cy="252" r="15" fill="url(#star)"/>
  <!-- 7 摇光 (handle end / tip) -->
  <circle cx="368" cy="360" r="18" fill="url(#star)"/>

  <!-- E8 consciousness core — luminous center point (coordinating star) -->
  <circle cx="256" cy="256" r="7" fill="#EA580C" opacity="0.85"/>
</svg>