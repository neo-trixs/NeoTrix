[package]
name = "pdf-icon-enhance"
version = "0.1.0"
edition = "2021"
description = "PDF icon/image enhancement module for NeoTrix"
authors = ["NeoTrix Team"]

[dependencies]
lopdf = "0.34"
image = { version = "0.25", features = ["jpeg", "png"] }

# ONNX support (optional)
ort = { version = "2.0", optional = true }
ndarray = { version = "0.15", optional = true }

[features]
default = ["lanczos"]
lanczos = []
onnx = ["ort", "ndarray"]

[dev-dependencies]
tempfile = "3"
