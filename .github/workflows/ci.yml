name: NeoTrix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # ⭐ 2026-10-02 补：原来**没有**手动触发入口 ⇒ 想验证一个 CI 改动
  #   只能推空 commit 或改 workflow 文件。加 dispatch 是为了让「门能不能变绿」
  #   本身可验证，而不是只能等下次 push。
  workflow_dispatch:

# ⭐ 2026-10-02 补：原来**完全没有** concurrency ⇒ 同一分支连推几次，
#   3 OS × 多 job 全部叠加重跑且不取消旧run。加它之后新 push 会取消在跑的。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # 2026-10-05 新增。安全接线门：抓「造了资产但没人调用」。
  #
  # 为什么单独一个 job 且排在最前：它**纯文本分析、不需要 cargo**（实测 ~15s，
  # 连 rustup 都不用），而 `check` job 要 3 OS × 多步 cargo check。放在前面
  # 让它在长构建跑起来之前就把结论摆出来。
  #
  # 现有两个门都看不见这一类，原因不同：
  #   · check-truth-surface.sh 只覆盖 EMPTY / UNDECLARED / TRACKED，
  #     **没有「编译了但零生产消费者」这一类**；
  #   · check-ext-wiring.py 只认 register_*/on_*/subscribe* 注册式命名，
  #     所以 DnsEgressPolicy / ToolSandbox 这类非注册式策略资产它一条都看不见。
  # 已实测的存量例：nt_shield/guard/agent_guardrails/ 1,492 行从未被编译
  # （父 guard/mod.rs 只声明了另外三个子模块）—— 那是全仓唯一的
  # rm -rf / sudo / curl|sh 破坏性命令检测实现。
  #
  # ⚠️ 本步当前是 **--audit（只报告，不判红）**：棘轮基线
  # 「造了资产但没人调用」棘轮门。纯文本分析，**不需要 cargo**，
  # 故排在需要 cargo 的 check 之前快速失败。
  #
  # 基线 2,148 条是 2026-10-05 的存量快照（14 个从未编译的孤儿目录 +
  # 1,966 个零消费者资产 + 168 个仅测试消费）。**建基线 = 把存量合法化**，
  # 是一次有判断的动作；已落库并经 --strict 验证（新增 0），
  # 后续只允许**下降**：stale 条目不算失败，所以每修一处接线都能棘轮收掉。
  security-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: "Security-wiring self-test (injected negative fixtures, no cargo)"
        run: python3 scripts/ops/nt_security_wiring.py --self-test
      - name: "Security-wiring ratchet (new unwired assets fail the build)"
        run: python3 scripts/ops/nt_security_wiring.py --strict

  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Runs FIRST: manifest breakage ("committed manifest names a file git does
      # not have") makes every later step meaningless, and it has shipped green
      # before — apps/neobot-desktop was a workspace member with no Cargo.toml,
      # so a fresh clone could not load the workspace at all. Seconds to detect.
      # Content-level staleness is what the `cargo check` steps below enforce;
      # this gate's --full tier is the same oracle with grouped diagnostics.
      - name: "Fresh-build gate (a clean clone must load the workspace)"
        run: bash scripts/check-fresh-build.sh --metadata
      - name: "Fresh-build, all targets (lib + tests + benches + examples)"
        run: bash scripts/check-fresh-build.sh --targets
      - run: cargo check --lib -p neotrix
      - run: cargo check -p neotrix
      # --strict blocks NEW layer violations only. The gate previously failed
      # unconditionally on 92 pre-existing L1->L2/L3/L4/L5/L6 sites, so it had
      # been red in CI for its whole life and a real regression was
      # indistinguishable from standing debt. Standing debt is now a ledger
      # (scripts/layer-deps-baseline.txt) that only ratchets downward; the debt
      # itself is tracked in TODO.md and is NOT resolved.
      - name: Layer dependency check (blocks NEW violations; debt is baselined)
        run: bash scripts/check-layer-deps.sh --strict
      - name: "Truth-surface gate (ratchet: blocks NEW 0-byte .rs / undeclared test modules / tracked build artifacts)"
        run: bash scripts/check-truth-surface.sh --strict
      - name: "Untracked-asset gate (R-EXIST-1 — a clean clone must contain every real asset)"
        run: bash scripts/check-untracked-assets.sh
      - name: "Production-panic ratchet (blocks NEW unwrap/expect/panic; 712-site debt baselined)"
        run: bash scripts/check-unwrap.sh --strict
      # 2026-09-30 新增。静默失败棘轮：绿构建 + 全绿测试 + 全部门 rc=0 之下，
      # 唯一仍未被覆盖的失效模式 —— 丢弃 Result 且同块内无任何观测通道。
      # 首轮抓到 4 条 P0（agent.rs stdio 工具通道 / safe_applier 回滚 /
      # experience_tree 会话证据 / write_guard 审计证据），均已修。
      # 规约不是外来发明，是仓内 nt_channel_serve.rs:278 已有的答案。
      - name: "Silent-failure ratchet (discarded Result with no observation channel)"
        run: bash scripts/check-silent-failure.sh --strict
      # 2026-09-29 新增（N-1）。本 job 组同时跑 3 个 OS，但本门只读 git 索引与
      # workflow 文本，跑一次即可 —— 放在 matrix 里是浪费，但放外面要多一个 job，
      # 权衡后留在 `check` 的第一步之前（秒级，无需 cargo）。
      - name: "CI reference gate (no job may point at a path git does not track)"
        run: bash scripts/check-ci-refs.sh --strict
      # 2026-09-30 新增（G6）。**已从 continue-on-error 改为阻断**：
      # 原为 advisory，因为 .neotrix/LICENSE-EXCEPTIONS.md 尚无人签署。
      # 现已签署 ACKNOWLEDGE-1（accepted-with-condition，review_by 2026-12-01），
      # 且其 condition #1「上游 LICENSE 与 LICENSE.details 逐字保留」正是由本门
      # 强制 ⇒ 门与条件互为担保，具备阻断资格。
      #
      # ⚠ 到 2026-12-01 该例外到期：若无人重审重签，本门会重新变红并阻断 CI ——
      #   **这是设计意图**（强制重审），不是故障。
      - name: "License/provenance gate (signed exception; re-review due 2026-12-01)"
        run: bash scripts/check-license.sh
      # 2026-09-29 加（B1 元门）。它是**检查其他门的门**：
      #   ① 非空门   —— 注入已知违规，该门必须变红（否则是永远绿的假门）
      #   ② 可满足性 —— 存在已知合规输入，该门必须变绿（否则是恒红的门）
      # 依据：i-have-adhd 的发布门「永远无法通过」而**这件事是跑出来的，
      # 不是看出来的**。本门让这类问题在 CI 可见。
      #
      # 耗时说明：10 道门，其中 3 道跑真探针（含注入+清理），7 道声明 opaque
      # （需改产品码或跑 cargo，见 scripts/gate-registry.tsv 的 note 栏）。
      - name: "Gate-satisfiability meta-gate (are the gates themselves trustworthy?)"
        run: bash scripts/check-gate-satisfiable.sh --strict
      # 2026-09-29 新增。抓「文档断言被代码反驳」：文档写「X 零生产消费者」而
      # 代码里其实已有 X 的消费者。本会话此类死记录复发 6 次，每次都靠人追问
      # 才发现 —— 靠记性已经失败 6 次，故门禁化。
      # 非 cargo、秒级，只读 git grep。已登记 scripts/gate-registry.tsv
      # （injectable，探针 scripts/probes/check-doc-claims.sh 实证非空）。
      - name: "Doc-claims gate (docs asserting 'zero consumers' that code refutes)"
        run: bash scripts/check-doc-claims.sh
      # ⭐⭐⭐ 2026-10-06：agent 配置回归门 + 变更工件链棘轮。
      # ⭐⭐⭐ 立门理由（本仓「门写了没跑」同族的**反向**形态 ——
      #   「**配置在改，配置无门**」，本仓自 2026-10-04 起已实证 7 次同类）：
      # ⭐⭐⭐ 实测 `ci.yml` 的 on: **无 paths 过滤** ⇒ 任何 PR 都触发 5 分钟
      #   cargo 套件；但改 `skills/index.json` 的 PR **不会**跑 check-skill-gate，
      #   改 `AGENTS.md` 的 PR **不会**跑任何配置校验，改 `.neotrix/task-index.json`
      #   的 PR **不会**跑 `nt_find.py --audit`（那只在 pre-commit，而 pre-commit
      #   可被 `--no-verify` 跳过，且 AGENTS.md §1 记载共享 index 下它不原子）。
      # ⭐⭐⭐ 吸收自 Anthropic《AI-native SDLC playbook》Stage 4 Test
      #   「Continuous evals in CI」：*the configuration that steers the agent
      #   deserves the regression testing that code gets*。
      # ⭐⭐ 非 cargo、无网络、秒级、只读（唯一写入是 --update-baseline 写基线本身）。
      # ⭐⭐ 已登记 scripts/gate-registry.tsv（injectable）；非空性由
      #   scripts/probes/check-agent-config.sh 两处注入实证（不只是看出来的）。
      - name: "Agent-config gate (config gets the regression testing code gets; artifact-chain ratchet)"
        run: bash scripts/check-agent-config.sh --strict
      # ⭐⭐⭐⭐ 2026-10-06：路线 N-5「claims 数字追溯」—— 补 nt_manifest.py 的洞。
      # ⭐⭐⭐⭐ `nt_manifest.py`（Context Manifest）只验 `file:line` 指向是否还在
      #   ⇒ **它不查数字**。而「文档里写着 82 条」在变成 83 条后仍是「82 条」，
      #   门不会响，而数字恰是 agent 最常直接采信的东西。
      # ⭐⭐⭐⭐ 立门实测依据：**同一场会话内踩了 4 次陈旧数字** ——
      #   AGENTS.md 75→79→82 / ROADMAP「下一步仍是 A3」而 A3 已 ✅ /
      #   FEATURE-MAP N-4 ⬜ 而 visible_to_model 已接生产 /
      #   gate-registry「恒红 NEW 5」而实测 24。
      # ⭐⭐ 纯文本提取（正则 + 整数比较），⛔ 不执行被检查的任何命令
      #   （R-SCAN-4：check-disk.sh 初版把反引号示例当命令跑，删掉 115.2 GiB）。
      # ⭐⭐ 防空转双判据：注册表非空 + 每条 pattern 必须真命中
      #   （命中不到 = 断言已失去意义，**判红**；否则「文档删掉那句话」会让门静默变绿）。
      # ⭐⭐ 已登记 scripts/gate-registry.tsv（injectable）；非空性由
      #   scripts/probes/nt_claims_numbers.sh 覆盖**两种**失败模式实证。
      - name: "Claims-numbers gate (docs asserting numbers the code refutes)"
        run: bash scripts/check-claims-numbers.sh --strict

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Reports the standing test failures as a countable ledger instead of a
      # bare red line. STRICT as of 2026-09-28: this was advisory because the
      # ledger held 3 failures and a historically flaky filesystem-backed test
      # would flap — a gate that flaps only trains everyone to ignore it. Those
      # 3 are now gone (2 clock-based + 1 Noise handshake; each either fixed or
      # #[ignore]d with the reason written down), so the baseline recomputes
      # empty ⇒ any NEW failure FAILs, making "do not introduce failures" a
      # machine-enforced fact rather than a convention.
      - name: "Test suite + failure ledger (strict; baseline is empty)"
        run: bash scripts/check-test-baseline.sh --strict

      - name: Egress privacy guard regression
        run: cargo test -p neotrix --lib egress_guard -- --nocapture

      # 进化实验账本活性（2026-09-29）。
      # 背景：本仓第三次「造了没人跑」——`nt_evolution_exp` bin 资产齐全
      # （Preregistration / Veto / judge_ab / Ledger，27 测试，实测能 ACCEPT
      # 也能三路 REJECT），却既不在 Makefile 也不在 CI ⇒ 没有任何门会跑它。
      # 先补 Makefile 再补这里；两处都缺就等于没接线。
      # ⛔ 本门**不跑 A/B 实验本身**（跑一次 ≈ 数十秒，每次提交都付不划算），
      #   只判「账本是否活着」：有数据行 + **含拒绝记录** + bin 已注册。
      - name: Evolution experiment ledger liveness
        run: bash scripts/check-evolution-ledger.sh

  # ── 桌面端 + 前端（2026-10-02 补的洞）─────────────────────────────
  # ⭐⭐ 为什么单开一个 job 而不是塞进 `test`：
  #   `test` job 用 `cargo test --lib -p neotrix`，`--lib` **不编译 `tests/`**
  #   ⇒ neotrix-core/tests/ 的 445 条集成测试、neotrix-neobot 的 479 条、
  #   neobot-desktop 的 79 条，**从未在任何可绿的 CI 路径上执行过**。
  #   ⓰ 仓里唯一一行全工作区测试是 `lint.yml:56 cargo test --all`，
  #   而它在 **ubuntu-latest** 上按下面「系统依赖」那段必然红 ⇒ 结构性的假门。
  #   ⇒ 本 job 是把那行「恒红」换成真绿的第一块。
  desktop:
    # ⭐ 为什么只跑 macOS：`neobot-desktop` 依赖 `tauri`（**未关默认 feature**）
    #   ⇒ 默认带 `wry` ⇒ Linux 侧要 `webkit2gtk-4.1` 等系统库
    #   （`tauri-2.12.0/Cargo.toml:135-140` → `webkit2gtk-sys-2.0.2/build.rs`
    #   的 `system_deps::probe()` 缺库即失败）。仓里**零** apt/brew 步骤
    #   （`rg 'apt-get install|brew install' .github/` 零命中），
    #   而 `CONTRIBUTING.md:10` 已写好配方却从未接进 CI。
    #   ⇒ 先在 macOS 上把覆盖做实；Linux 侧等有配方再开第二格 matrix。
    runs-on: macos-latest
    # ⭐ 原来 ci.yml **一个 job 都没有** timeout-minutes ⇒ 卡住要等 GitHub 默认 6h。
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2

      # ⭐⭐ **必须先建前端产物，否则 cargo 编译期就 panic**（实测链条）：
      #   `tauri.conf.json:6` 的 `frontendDist` 指向 `neobot-ui/dist`，
      #   而 `neobot-ui/.gitignore:4` 忽略了 `dist/`（`git ls-files` 实测 0 文件入库）
      #   ⇒ 干净检出里该路径**不存在**；
      #   `tauri-codegen-2.7.0/src/context.rs:186-191` 对不存在的路径**直接 panic**；
      #   `generate_context!()` 只出现在 `src/main.rs:81`（bin target），
      #   而 `cargo test -p <pkg>` 会连带编译 bin target（为了 CARGO_BIN_EXE_*）
      #   ⇒ **不加这一步，本 job 必红**。
      #   ⭐ 顺带白拿前端类型门：`neobot-ui/package.json:8` 的 build 就是
      #   `tsc --noEmit && vite build` ⇒ 这一步同时给 1,241 行 TS 上了类型检查。
      #   ⛔ `beforeBuildCommand` **不会**被 `cargo test` 触发（那是 `tauri build` CLI 的事）。
      # ⭐ 刻意**不用** `pnpm/action-setup` 与 `actions/setup-node`：
      #   仓里的 `provenance/external-inputs.json` 要求每个第三方 action 登记
      #   **sha256 + commit**（供应链 pin），而 GitHub API 配额已 0/60 ⇒ 我无法取到真值。
      #   ⛔ 更不能伪造 ⇒ `check-ci-refs.sh --strict` 会红（它当场抓到了我）。
      #   ⇒ 改用**runner 自带 Node** + `npm i -g pnpm`，**不新增任何第三方依赖**。
      #   ⓰ 代价：Node/pnpm 版本不再由 workflow 钉死 ⇒ 用下面那步把**实际版本打进日志**，
      #   免得「用的什么版本」只能靠猜（这是 R-SCAN-3 的同一条纪律）。
      - name: Record toolchain versions actually used
        run: |
          set -euo pipefail
          echo "node $(node --version)  npm $(npm --version)"
          npm install -g pnpm@10
          echo "pnpm $(pnpm --version)"
      - name: Install frontend deps
        run: pnpm install --frozen-lockfile
        working-directory: apps/neobot-desktop/neobot-ui
      # ⭐ 2026-10-03 补：npm 依赖许可门此前**写了但 CI 从不运行**
      #   （`scripts/check-license-js.sh` 190 行，在 .github/workflows 里零引用）。
      #   ⛔ 后果：Rust 侧有 deny.toml + 两条阻断 job，而 npm 侧
      #   AGPL/GPL/SSPL/Elastic/BUSL **无任何阻断** —— 许可防护真空是真的。
      #   ⭐ 放在这一步之后：上面刚 `pnpm install --frozen-lockfile` 装好依赖，
      #   本门从 `node_modules/<pkg>/package.json` 读 SPDX ⇒ 复用即可，
      #   ⛔ 不新增任何第三方 action（供应链 pin 约束见上方注释）。
      #   ⛔ 本门在 `node_modules` 缺失时**故意 FAIL**（区分「没扫成」与「没问题」），
      #   所以它**必须**排在 install 之后。
      - name: npm license gate (SPDX baseline + deny list, zero exceptions)
        run: bash scripts/check-license-js.sh
      # ⭐⭐⭐ 2026-10-04 栏族尺度门（抄 deepseek-harness 的 CI 契约手法）。
      # ⭐⭐ 必须在 install 之后？⛔ 不需要 —— ⭐⭐ 它**只读源码**
      # （theme.css / shell.css / neobot-root.tsx / tauri.conf.json），
      # ⭐⭐ 不碰 node_modules ⇒ ⭐ 放在这里只为紧邻其它 UI 门、便于发现。
      #
      # ⭐⭐⭐ **为什么这道门必须进 CI**（⭐ 三家对标研究的核心结论）：
      #   ⭐ DSH-better-sidebar 有唯一一份「冻结尺度表」，但 ⭐⭐ 它的
      #   `tests/theme.spec.ts` **只扫 `color:`** ⇒ ⭐⭐ **尺寸漂了它不会红**。
      #   ⭐⭐ 真正被 CI 强制的是 dsh 的 `builder.rs:1213` ——
      #   ⭐⭐ 它执行的不是某个数字，是**原则**（「栏高必须是 4px 刻度整数倍」）。
      #   ⇒ ⭐⭐ 本门同理：P1 禁孤儿刻度 / P2 栏归栏族 / P3 列宽单一真源 /
      #   P4 颜色语义化 / P5 跨语言契约（交通灯 y + 灯径 ≤ 栏高，⭐ issue #524 同型）。
      #   ⭐⭐ 且 P0 有**扫描器自检**（先证明扫到了东西，⭐⭐ 抄
      #   better-sidebar 的 `expect(sheets.length).toBeGreaterThan(5)`），
      #   ⭐⭐ 防止「glob 静默匹配为空 ⇒ 契约作废」。
      - name: neobot layout-scale gate (bar family + cross-language contract)
        run: node scripts/ops/neobot-check-layout-scale.mjs
      # ⭐⭐⭐ 2026-10-04：⭐⭐ **自持 UI 接线门首次进 CI**。
      # ⭐⭐ 实测取证：`rg 'nt_neobot_ui_wiring' .github/workflows/` ⇒ **零命中**
      # ⭐⭐ ⇒ ⭐⭐⭐ **这个门写好了却从未在 CI 跑过**（⭐⭐ 与 `check-license-js.sh`
      # ⭐⭐ 同病，⭐⭐ 上一轮刚修过一个 ⇒ ⭐⭐ **本仓这是复发型缺陷**）。
      # ⭐⭐⭐ 本门 4b 项在本轮由 ℹ️ 升级为**阻断**（前提已成立：pet.tsx 已收敛），
      # ⭐⭐⭐ 拦的是**本项目复发 4 次**的那一类：**能力存在却没接线**。
      # ⭐⭐ 变异测试已做：注入一个双引号写法的直连 ⇒ rc=1；还原 ⇒ rc=0。
      # ⭐⭐ ⛔ 门内含「防空转自检」（扫不到源文件 ⇒ 判红），
      # ⭐⭐ ⛔ 抄 better-sidebar 的教训：glob 静默匹配为空 ⇒ 契约作废。
      - name: neobot self-hosted UI wiring gate (IPC single-exit + i18n + dist purity)
        run: python3 scripts/ops/nt_neobot_ui_wiring.py
      # ⭐⭐⭐ 2026-10-04：⭐⭐ **契约门首次进 CI**，⭐⭐ 且它**当场抓到一个已发布的缺陷**。
      # ⭐⭐ 三方一致性：`api.rs` 契约表 ⇔ `generate_handler` 注册 ⇔ 前端 `invoke` 实调。
      # ⭐⭐⭐ 为什么优先级最高：⭐⭐ 本轮实测它报出
      #   「已注册但契约表无条目：`neobot_convo_messages`」
      #   ⇒ ⭐⭐⭐ **那是一条已废弃、零调用方、却仍在注册表里的命令**，
      #   ⭐⭐ 而**这个门从未在 CI 跑过** ⇒ ⭐⭐ 缺陷可以长期存活。
      # ⭐⭐ 纯 python、无浏览器/网络/编译依赖 ⇒ ⭐⭐ 接进 CI 零成本。
      - name: neobot API contract gate (contract table <-> handler registry <-> frontend calls)
        run: python3 scripts/ops/nt_api_contract.py
      # ⭐⭐⭐ 2026-10-04：⭐⭐ **元门** —— 「门必须接了 CI 或带理由登记豁免」。
      # ⭐⭐⭐ 本轮实测：`kind=gate` 41 道里 **27 道从未在 CI 引用**，
      #   其中 `nt_api_contract.py` **一跑就抓到已发布的缺陷** ⇒
      #   ⭐⭐⭐ **门写了没跑 ⇒ 缺陷能长期存活**。⇒ 立这道元门让该状态**可判定**。
      # ⭐⭐ 零依赖（纯 python + 读文本），⭐⭐ 不装浏览器、不编译。
      - name: gate coverage meta-gate (every gate is wired or has a reasoned exemption)
        run: python3 scripts/ops/nt_gate_coverage.py
      # ⭐⭐ 以下 4 道为「零浏览器/网络/编译依赖且实测 rc=0」的门，⭐⭐ 本轮补齐接线。
      # ⭐⭐⭐ 对标 dsh `builder.rs:1213` 与 Atlas：⭐⭐ **原则要被 CI 强制**，
      #   ⭐⭐ 「写下来」不等于「守得住」。
      - name: scan-surface gate (21 scan surfaces exist)
        run: python3 scripts/ops/nt_scan_surface.py
      - name: neobot feature viability gate (no silently dropped live feature)
        run: python3 scripts/ops/nt_feature_viability.py
      - name: neobot self-contained imports gate (no escape from the self-hosted tree)
        run: node scripts/ops/neobot-check-selfcontained.mjs
      - name: neobot IPC payload-key gate (camelCase matches Rust params)
        run: node scripts/ops/neobot-check-ipc-keys.mjs
      - name: neobot A1 recovery gate (running rows dominated by sweep)
        run: node scripts/ops/neobot-check-a1-recovery.mjs
      # ⭐⭐⭐⭐ 2026-10-04：⭐⭐ **9 道 UI 门首次进 CI**（⭐⭐ 此前它们在 CI 上等于不存在）。
      #
      # ⭐⭐⭐ 根因（⭐⭐ 实测，非推理）：这 9 道门用 `createRequire` 把
      #   `require('playwright')` 锚到 **`frontend/`（vendored 冻结树）** 的
      #   package.json，⭐⭐ 而 CI **只在 `neobot-ui/` 跑 `pnpm install`**
      #   ⇒ ⭐⭐ CI 里 `frontend/node_modules` 不存在 ⇒ ⭐⭐ 模块加载必然失败。
      # ⭐⭐⭐ 它们的注释还写着「playwright 装在 vendored 的 frontend 里」——
      # ⭐⭐⭐ **陈述属实，但没人问过 CI 里它存不存在**。
      #
      # ✅ 处置：playwright 归位到 `neobot-ui/devDependencies`（Apache-2.0，
      #    ⛔ 不在 deny 名单；许可基线已更新，许可门 rc=0），
      #    9 道门的锚点全部改到交付树。
      # ⭐⭐ 元门 `nt_gate_coverage.py` 的 **P4** 会持续保证：
      #   ⭐⭐ 一旦再出现「依赖未声明」的 UI 门，⭐⭐ **当场判红**。
      #
      # ⭐⭐ 用系统 Chrome（脚本内 `channel: 'chrome'`）⇒ ⭐⭐ **免 150MB 浏览器下载**
      # ⭐⭐ （GitHub `ubuntu-latest` 镜像自带 Chrome）。
      # ⭐⭐⭐⭐⭐ 2026-10-07 修「构建排在门之后」—— 这是**顺序缺陷**，不是配置缺失。
      #
      # # 事实链（逐条实测，非推理）
      #
      # ① 下面这 9 道门**全部**读 `apps/neobot-desktop/neobot-ui/dist`
      #    （`nt_dist_freshness.mjs` 就是为此抽的公用件）。
      # ② `neobot-ui/.gitignore:4` 忽略 `dist/`，`git ls-files` 实测 0 文件入库
      #    ⇒ CI 的干净检出的里**没有** dist。
      # ③ 上面唯一的构建是 `pnpm install --frozen-lockfile`；
      #    实测 `neobot-ui/package.json` **无** postinstall / prepare 钩子，
      #    且 `neobot-ui/` 无 `pnpm-workspace.yaml` ⇒ install **不会**顺带构建。
      # ④ 把 dist 移开实测：9 道门全部 rc=1（**原始版同样红**，⛔ 不是本次改动引入）。
      #
      # ⇒ 改动前这 9 道门在 CI 里**必然红**，且 GitHub Actions 遇红即跳过后续步骤
      # ⇒ `cargo test -p neobot-desktop`（89 条）与 `cargo test -p neotrix-neobot`
      #    （481 条）**从未真正执行过**。
      #
      # # 为什么会这样
      #
      # `3b3dd3fe`(10-02) 先加 desktop job（含本步骤），`4fee8663`(10-04) 后加这 9 道门，
      # ⛔ 插入位置落在了构建**之前** —— 而那个 commit 的标题写着
      # 「9 道 UI 门**首次在 CI 真正生效**」。**陈述与事实分叉**，
      # 且分叉方向正是「以为门在跑，实际不可能跑」。
      #
      # ⓘ 顺带白拿：`build` 脚本是 `tsc --noEmit && vite build`
      #    ⇒ 提前到门之前，等于给全部 TS 上了类型检查。
      - name: Build frontend (tsc --noEmit + vite build)
        run: pnpm run build
        working-directory: apps/neobot-desktop/neobot-ui
      - name: neobot UI gate — neobot-check-contrast (对比度（AA）)
        run: node scripts/ops/neobot-check-contrast.mjs
      - name: neobot UI gate — neobot-check-convo-groups (会话分组)
        run: node scripts/ops/neobot-check-convo-groups.mjs
      - name: neobot UI gate — neobot-check-convo-keys (会话键名)
        run: node scripts/ops/neobot-check-convo-keys.mjs
      - name: neobot UI gate — neobot-check-msg-copy (消息复制按钮)
        run: node scripts/ops/neobot-check-msg-copy.mjs
      - name: neobot UI gate — neobot-check-shortcuts (快捷键)
        run: node scripts/ops/neobot-check-shortcuts.mjs
      - name: neobot UI gate — neobot-check-theme-persist (主题跨刷新持久)
        run: node scripts/ops/neobot-check-theme-persist.mjs
      - name: neobot UI gate — neobot-msg-virtual (消息虚拟化（长列表）)
        run: node scripts/ops/neobot-msg-virtual.mjs
      - name: neobot UI gate — neobot-check-markdown (markdown 渲染 + 语言跟随)
        run: node scripts/ops/neobot-check-markdown.mjs
      - name: neobot UI gate — neobot-ui-smoke (UI 冒烟（综合）)
        run: node scripts/ops/neobot-ui-smoke.mjs
      # ⭐⭐ `neobot-desktop`：本次补的核心。此前 CI 一次都没跑过它，
      #   后果是 2026-10-02 那个 P0（前端载荷键 snake_case vs Tauri camelCase ⇒
      #   **消息从不落库、切会话历史永远空**）能带着「全部 UI 门全绿」活下来。
      #   ⓰ 现有测试：`src/` 71 条 + `tests/data_dir_env.rs` 3 条
      #   + `tests/ipc_roundtrip.rs` 5 条（真实命令分发，无桩）。
      - name: Desktop IPC + shell tests (real dispatch, no stubs)
        run: cargo test -p neobot-desktop

      # ⭐ 顺手把 `neotrix-neobot` 也拉进来：它是**叶子 crate**（无 `neotrix` 依赖）
      #   ⇒ 依赖子树已被上一条编好，几乎不额外花时间，却白拿 479 条测试
      #   —— 而这 479 条此前**从未**在任何 CI 路径上跑过
      #   （仓里唯一的 `cargo test --all` 在 ubuntu 上必然红）。
      - name: neobot library tests (479, previously never run in CI)
        run: cargo test -p neotrix-neobot

      # ⭐⭐⭐⭐⭐ 能力市场清单自洽门（2026-10-04 新增）
      # ⭐⭐⭐⭐⭐ 防止「有能力但从市场静默消失」：
      # ⭐⭐⭐⭐⭐ 市场 `listable()` 只返回可上架的 ⇒ 没填 `market.*` 的
      # ⭐⭐⭐⭐⭐ **从视图里彻底消失** ⇒ 与「有能力没接线」完全同型。
      # ⭐⭐⭐⭐⭐ 判据全部来自运行期探针（与 neobot-check-emergence 同源），
      # ⭐⭐⭐⭐⭐ ⭐⭐ 上架率**只报告不当阻断**（演进指标当阻断 ⇒ 恒红 ⇒ 门被关），
      # ⭐⭐⭐⭐⭐ ⭐⭐⭐⭐⭐ ⭐⭐ 只对**清单不自洽**判红：互斥 / 完备 / 反向一致 /
      # ⭐⭐⭐⭐⭐ ⭐⭐⭐⭐⭐ ⭐⭐ 拿不到证据（⭐⭐ 不把「跑不出结果」当「没问题」）。
      - name: Capability market manifest gate (listable/unlisted self-consistency)
        run: bash scripts/ops/neobot-check-market.sh

      # ⭐⭐⭐⭐⭐ orphan-dir 门（他窗 2026-10-05 加，⭐⭐ 本轮接 CI）
      # ⭐⭐⭐⭐⭐ 防「目录不在编译树上 ⇒ 绿测试给未编译的代码背书」。
      # ⭐⭐⭐⭐⭐ `--strict` 只在**新增**孤儿时非零 ⇒ 基线里 25 个待裁决目录
      # ⭐⭐⭐⭐⭐ 不会让门恒红（⭐⭐ 照抄「演进指标不当阻断」的纪律）。
      - name: Orphan directory gate (baseline-tolerant, --strict)
        run: bash scripts/check-orphan-dirs.sh --strict

      # ⭐⭐⭐⭐⭐ 注册表跨进程确定性门（2026-10-06 新增）
      # ⭐⭐⭐⭐⭐ 防**一次写命令销毁注册表**：实测 `neotrix-capability` 任何
      # ⭐⭐⭐⭐⭐ 写子命令都会在 `run()` 末尾无条件 `save_registry`，而
      # ⭐⭐⭐⭐⭐ `load_registry` 曾用 `Err(_)` 吞掉解析错误并误走「老 schema
      # ⭐⭐⭐⭐⭐ 迁移」（0 节点）⇒ 318 节点 / 43 边被覆盖成 41 / 0，**退出码 0**。
      # ⭐⭐⭐⭐⭐ 同时锁住**序列化抖动**：直接序列化会把 `metadata: HashMap`
      # ⭐⭐⭐⭐⭐ 的迭代序写进文件 ⇒ 同一输入 5 次写盘产出 5 个不同 md5。
      # ⭐⭐⭐⭐⭐ ⭐⭐ 必须跨进程跑：单进程内 HashMap 迭代序稳定 ⇒ 单测抓不到。
      - name: Capability registry cross-process determinism + lossless roundtrip
        run: bash scripts/ops/nt-registry-determinism.sh

      # ⭐⭐⭐⭐⭐ 交接索引一致性门（2026-10-06 新增）
      # ⭐⭐⭐⭐⭐ 「sessions/README.md 是 70+ 份交接的唯一索引」这句话一旦失准，
      # ⭐⭐⭐⭐⭐ 它就比没有索引更糟—— 人会信它，然后找不到刚写的交接。
      # ⭐⭐⭐⭐⭐ 建门动机：该请求 2026-10-06 被提三遍，而人工盘点**连续两轮**
      # ⭐⭐⭐⭐⭐ 漏掉「自己刚写的交接」（习惯是先更新索引、后写交接 ⇒ 自己那份晚一步）。
      # ⭐⭐⭐⭐⭐ ⇒ 一致性必须机械化判定。只读门：唯一写入是自身 mktemp 临时文件。
      - name: Handoff index consistency + unbounded-file report
        run: bash scripts/ops/nt-handoff-hygiene.sh

      # ⭐⭐⭐⭐⭐ 注释星号噪声门（2026-10-06 新增）
      # ⭐⭐⭐⭐⭐ 只挡**新增**：一次清理（4526→285）当天就被证明不够 ——
      # ⭐⭐⭐⭐⭐ 紧随的 4 个提交又新增 21 行带 ⭐ 的注释。
      # ⭐⭐⭐⭐⭐ 只看 `+` 行里 `//` 之后的部分 ⇒ **不误判字符串字面量**
      # ⭐⭐⭐⭐⭐ （实测 51 处 ⭐ 在 `assert_eq!` 消息里，那是内容不是注释）。
      - name: No decorative star in newly added comments
        run: bash scripts/ops/nt-no-star-noise.sh

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --lib -p neotrix -p neotrix-types
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib -p neotrix -- -D warnings

  fmt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  # ---------------------------------------------------------------------------
  # 2026-09-29 移除 4 个幻影 job：frontend-tests / frontend-coverage /
  # frontend-build / e2e。
  #
  # 实测依据（`EVOLUTION-ROADMAP-CODE-NODES-2026-09-29.md` N-1）：
  #   - `neocodex-frontend/` 在 .gitignore:136 被整目录忽略，
  #     `git ls-files` 跟踪 0 个文件，磁盘上不存在
  #   - `e2e/` 同样 0 跟踪、磁盘上不存在
  #   - `src-tauri/` 已于 5c02e738 归档（599 files）
  #   ⇒ 这 4 个 job 在**任何干净检出上必然失败**（npm ci 在不存在的工作目录）。
  #     它们不是"偶尔红"，是恒红 —— 而恒红的门会训练人忽略红色。
  #
  # 这与提交 3edf3be7「发布链路: 移除幻影CSS门禁 (脚本不存在, 构建恒失败)」
  # 是同一类问题，那次修在 package.json，这次复发在 CI 层。
  #
  # 防复发：scripts/check-ci-refs.sh 在 CI 里检查每个 job 的
  # working-directory / path 是否被 git 跟踪。见 ci.yml 的 `check` job。
  # ---------------------------------------------------------------------------

  # 2026-09-29 重构：原 `full-features` 只编 `full` 一个组合，而 `full` 只覆盖
  # 17 个真门控 feature 中的 7 个。实测 `audio-decode` / `video-decode` /
  # `self_model` / `desktop` 四个**全部编译失败却长期无人发现** ——
  # 不在默认集 ⇒ `cargo check --lib` 编不到；原 job 无 `continue-on-error`
  # ⇒ CI 红了也没人读结果。`audio-decode` 等连一条 workflow 都不编。
  #
  # 改为**逐 feature 矩阵**：每个真门控 feature 单独编一遍。
  # 依据：2026-09-29 实测单 feature 编译 10s~6min，16 个串行不可接受；
  # 靠矩阵并行使墙钟 ≈ 最慢单个。
  # 数据来源：scripts/ops/nt_feature_matrix.py --list（零编译，0.16s）。
  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # 一个 feature 坏掉不影响其余报告
      matrix:
        feature:
          - audio-decode
          - desktop
          - echo_bridge
          - integration_tests
          - ios-bridge
          - keyring
          - network_tests
          - onnx
          - rkyv-storage
          - sandbox
          - self-update
          - self_model
          - simd-vsa
          - stealth-net
          - telemetry
          - video-decode
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
        with:
          key: feat-${{ matrix.feature }}
      # 失败时打印具体 error 行，而不是只留一行 exit code。
      #
      # 2026-09-30: was `--lib`. That made this matrix blind to two real breaks
      # that were sitting in the tree:
      #   1. ffi/consciousness_tree.rs + ffi/mod.rs — NeoTrixConfig.prefer_free
      #      missing from 3 initializers. All three are in #[cfg(test)] blocks,
      #      which `--lib` does not compile. Introduced by dcccecb6.
      #   2. examples/nt_whisper_spike.rs — read the now-private `Outlet.name` /
      #      `.input_type` / `.output_type` after the ort upgrade. Examples are
      #      not part of `--lib` either.
      # Both are invisible to the default build too (they sit behind
      # #[cfg(feature = "ios-bridge")] / onnx), so the default job, the 12,209
      # lib tests and this matrix were ALL green while the code did not build.
      # A feature matrix whose job is "does this feature build" must therefore
      # cover every target, not just the lib. Local mirror of this exact
      # coverage: scripts/check-feature-gates.sh
      - run: |
          set -o pipefail
          cargo check --features ${{ matrix.feature }} --all-targets -p neotrix 2>&1 | tail -40
      # 门禁自检：矩阵清单与 Cargo.toml 实际 feature 漂移时报警。
      # 新增 feature 而忘了进矩阵 = 又造一个永无人编的盲区（R-FEAT-1 的根因）。
      - name: check matrix covers all gated features
        run: |
          python3 scripts/ops/nt_feature_matrix.py --list > /tmp/fm.txt
          python3 - <<'PY' > /tmp/missing.txt
          import re, pathlib
          listed = open('/tmp/fm.txt', encoding='utf-8').read()
          real = set(re.findall(r'^  (\S+)\s+\d+\s+真门控$', listed, re.M))
          y = pathlib.Path('.github/workflows/ci.yml').read_text(encoding='utf-8')
          block = y.split('  feature-matrix:')[1].split('  test-action:')[0]
          inmatrix = set(re.findall(r'^          - (.+)$', block, re.M))
          print(' '.join(sorted(real - inmatrix)))
          PY
          if [ -s /tmp/missing.txt ]; then
            echo "::error::这些真门控 feature 不在 CI 矩阵里（=永无人编）: $(cat /tmp/missing.txt)"
            exit 1
          fi
          echo "matrix covers all gated features OK"


  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test NeoTrix Action
        uses: ./.github/actions/neotrix-action
        with:
          prompt: 'print("hello")'
          api-key: ${{ secrets.NEOTRIX_TEST_API_KEY || 'mock-key' }}
          max-budget-usd: '0.01'

  # 2026-09-27 新增。能力诚实度门：registry 声称的 Constellation 等级是否被
  # 其 metadata 声明的证据支撑。机制 nt_core_capability_tree::maturity_audit()
  # 本已完整实现且带自愈 (demote_mislabeled, 可逆)，但 CLI 此前恒返回 Ok(())
  # —— 机制齐备却无法被任何流水线引用，于是自愈路径从不触发、虚标长期累积。
  #
  # 2026-09-27 已转**阻塞态**：24 项虚标经逐条考据后确认「零跨层消费者」属实
  # （grep 全仓证伪：所谓外部消费者均为同名异物，如 merge_pdfs 撞
  # neotrix-types/core/file_parser/pdf.rs:155、detect_encoding 撞
  # shield/guard/input_gatekeeper.rs:117 的同名方法），故 demote 到 C1 是**如实**
  # 而非惩罚；另核实 2 个确有跨层消费者者（OcrEngine / ImageSuperResolver）
  # 已带真实 file:line 升到 C2。基线现为 0 项，--strict 转阻塞。
  capability-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build capability-tree CLI (leaf crate, ~12s)
        run: cargo build -p nt_core_capability_tree --bin neotrix-capability
      - name: Maturity audit (blocking)
        run: ./target/debug/neotrix-capability audit-maturity --strict
