name: NeoTrix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --lib -p neotrix
      - run: cargo check -p neotrix
      - name: Layer dependency check
        run: bash scripts/check-layer-deps.sh
      - name: "Truth-surface gate (ratchet: blocks NEW 0-byte .rs / undeclared test modules / tracked build artifacts)"
        run: bash scripts/check-truth-surface.sh --strict

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --lib -p neotrix
      - name: Egress privacy guard regression
        run: cargo test -p neotrix --lib egress_guard -- --nocapture

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      - name: Generate coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --lib -p neotrix -p neotrix-types
      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: lcov.info

  clippy:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --lib -p neotrix -- -D warnings

  fmt:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neocodex-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: neocodex-frontend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend-coverage:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neocodex-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: neocodex-frontend/package-lock.json
      - run: npm ci
      - run: npm run coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: neocodex-frontend/coverage
          retention-days: 14
          if-no-files-found: ignore

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: neocodex-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: neocodex-frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  full-features:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --features full --lib -p neotrix

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --bin neotrix
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: e2e
      - run: npx playwright install chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env:
          NEOTRIX_BIN: ${{ github.workspace }}/target/release/neotrix

  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test NeoTrix Action
        uses: ./.github/actions/neotrix-action
        with:
          prompt: 'print("hello")'
          api-key: ${{ secrets.NEOTRIX_TEST_API_KEY || 'mock-key' }}
          max-budget-usd: '0.01'

  # 2026-09-27 新增。能力诚实度门：registry 声称的 Constellation 等级是否被
  # 其 metadata 声明的证据支撑。机制 nt_core_capability_tree::maturity_audit()
  # 本已完整实现且带自愈 (demote_mislabeled, 可逆)，但 CLI 此前恒返回 Ok(())
  # —— 机制齐备却无法被任何流水线引用，于是自愈路径从不触发、虚标长期累积。
  #
  # 暂为**报告态**（不阻塞）：当前有 24 项虚标待补真实 wiring_evidence，
  # 详见 TODO.md「已知债 · 能力成熟度虚标」。补完后本 job 改用 --strict 转阻塞。
  capability-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Build capability-tree CLI (leaf crate, ~12s)
        run: cargo build -p nt_core_capability_tree --bin neotrix-capability
      - name: Maturity audit (report mode; --strict once baseline is clean)
        run: ./target/debug/neotrix-capability audit-maturity
