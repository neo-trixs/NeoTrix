name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true

jobs:
  changelog:
    runs-on: ubuntu-latest
    outputs:
      changelog: ${{ steps.git-cliff.outputs.content }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate changelog
        id: git-cliff
        uses: orhun/git-cliff-action@v4
        with:
          config: config/cliff.toml
          args: --latest --strip header

  build-cli:
    needs: changelog
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos_x64
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos_arm64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux_x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows_x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify external input provenance
        # 2026-09-30 修正路径。此前写 `scripts/provenance_check.sh`，该路径**从未存在**
        # （脚本被移到 nt_shield/safety_tools/，但 workflow 与脚本自身 usage 都没跟着改），
        # ⇒ 本 job 在任何干净检出上必然在这里崩掉，二进制永远传不上去。
        # 这是本仓第三次同族幻影门事故（见 scripts/check-ci-refs.sh 文件头）。
        #
        # 现在该门是 fail-closed 的：清单不存在 ⇒ 明确报错并 exit 1。
        # ⇒ 发布需要先提交
        # neotrix-core/src/l3_embodiment/nt_shield/provenance/external-inputs.json
        # （schema 见同目录 external-inputs.example.json）。这是**真实的待办**，
        # 不要为了让发布通过而删掉这个 step 或把门改回 fail-open。
        run: bash neotrix-core/src/l3_embodiment/nt_shield/safety_tools/provenance_check.sh
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: neotrix
          target: ${{ matrix.target }}
          archive: neotrix-${{ matrix.suffix }}
          checksum: sha256
          token: ${{ secrets.GITHUB_TOKEN }}
          features: self-update

  release:
    needs: [build-cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: neotrix-*
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neotrix-*.tar.gz
            neotrix-*.tar.gz.sha256
            NeoTrix_*.AppImage
            NeoTrix_*.dmg
            NeoTrix_*.msi
          generate_release_notes: true
          body: |
            ## Changelog

            ${{ needs.changelog.outputs.changelog || 'See GitHub release notes below.' }}

            ## Installation

            ### CLI
            ```bash
            curl -fsSL https://neotrix.ai/install.sh | bash
            # or
            brew install neotrix/tap/neotrix
            # or
            cargo install neotrix --features self-update
            ```

            ### Desktop
            Download the installer for your platform from the assets below.

            After installation, run `neotrix update` to check for updates.
