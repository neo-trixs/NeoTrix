name: NeoTrix Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly: Monday 6AM

env:
  CARGO_TERM_COLOR: always

jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Build project
        run: cargo build --lib -p neotrix

      - name: Run security scanner tests
        run: cargo test -p neotrix --lib -- scanning 2>&1 | tee scan-test-output.txt

      - name: Run security scan
        id: scan
        run: |
          cargo run -p neotrix -- security-scan --target . --ci-mode 2>&1 | tee scan-results.txt || true

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: scan-results.txt
          retention-days: 30

      - name: Check for critical findings
        run: |
          if grep -qi "critical\|error" scan-results.txt 2>/dev/null; then
            echo "::error::Critical or Error findings detected in security scan"
            exit 1
          fi
          echo "Security scan passed"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        # 版本必须与 config/.gitleaks-baseline.txt 的绑定版本一致（2026-09-29 对齐）。
        # ⛔ 勿再降回 8.18.2：基线是按 8.30.1 生成的，而 8.18.2→8.30.1 之间规则集
        # 有实质变更（v8.25 +clickhouse/perplexity · v8.28 +Anthropic +composite rules
        # · v8.30 +Airtable/Looker）⇒ 新版报出的指纹不在基线内 ⇒ CI 首跑即红，
        # 而那不是真泄漏，是版本错配。**规则集变 ⇒ 基线必重生成。**
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          # 版本闸：装到的必须就是要的，否则基线错配、门形同虚设
          installed="$(gitleaks version)"
          echo "$installed"
          case "$installed" in
            *"$GITLEAKS_VERSION"*) ;;
            *) echo "::error::gitleaks 版本错配：期望 ${GITLEAKS_VERSION}，实得 ${installed}"; exit 1 ;;
          esac

      - name: Verify gitleaks version matches baseline
        run: |
          # 版本错配 ⇒ 基线失效 ⇒ 门形同虚设。必须在**扫描之前**验，
          # 否则等于用错版本的规则集去比对基线，结论没有意义。
          if ! bash scripts/check-gitleaks-version.sh --strict; then
            echo "::error::gitleaks 版本与基线不匹配 —— 基线由特定版本的规则集生成"
            exit 1
          fi

      - name: Run gitleaks secret scan
        run: |
          # 2026-09-29 修两处恒绿幻影（实测，非手推）：
          #   ① --config .gitleaks.toml 指向不存在的路径（真身在 config/.gitleaks.toml）
          #      ⇒ gitleaks FTL 退出、不产出 report.json；
          #   ② `|| true` 吞掉退出码，下一步 grep 读不到 report 便走 else 打印
          #      "Gitleaks scan passed" ⇒ 任何密钥泄漏都报 PASS。
          # 与 release.yml 用 `config: config/cliff.toml` 对齐（cliff 那条路径一直是对的）。
          # `--exit-code 0` 是刻意的：「检出泄漏」不是扫描失败，交给下一步按基线判定；
          # 而「扫描本身跑不起来」在这里就红 —— 两者不可再混为一谈。
          gitleaks detect --source . --config config/.gitleaks.toml \
            --report-format json --report-path gitleaks-report.json \
            --exit-code 0 --verbose 2>&1 | tee gitleaks-output.txt
          # 报告必须真的产出，否则「无泄漏」与「没扫成」不可区分（R-SCAN-2）
          if [ ! -s gitleaks-report.json ]; then
            echo "::error::gitleaks produced no report — scan did not run, refusing to pass"
            exit 1
          fi

      - name: Upload gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

      - name: Check for leaked secrets
        run: |
          # 判据同 ①：文件缺失不再走 "passed"，而是明确失败。
          # 原写法 `grep ... 2>/dev/null` + `|| echo passed` 在报告缺失时恒绿。
          if [ ! -s gitleaks-report.json ]; then
            echo "::error::gitleaks-report.json missing or empty — cannot conclude 'no leaks'"
            exit 1
          fi
          # 判据改为**基线棘轮**（2026-09-29）。原判据 `grep '"Severity"'` 恒不匹配：
          # gitleaks 8.30.1 的 JSON 报告**没有 Severity 字段**（官方 jsonextra 模板
          # 字段表可证），故那一步即使扫描成功也永远不会红。
          # 存量 59 条已逐一读代码确认为扫描器自身测试夹具/公开常量 ⇒ 进基线放行；
          # 报**基线之外**的 fingerprint 才算新泄漏。实测：存量 59 全在基线内、
          # 新造 slack-bot-token 在基线外被判出（双向验证，非手推）。
          new_leaks=$(jq -r '.[].Fingerprint' gitleaks-report.json \
            | grep -vxFf config/.gitleaks-baseline.txt || true)
          if [ -n "$new_leaks" ]; then
            echo "::error::New secret(s) detected outside the audited baseline:"
            echo "$new_leaks"
            echo "::warning::If these are false positives, review them — never silence by adding to the baseline."
            exit 1
          fi
          echo "Gitleaks scan passed (no leaks outside the audited baseline)"

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx

      - name: Generate SBOM
        run: |
          mkdir -p sbom
          cargo cyclonedx --all --format json --output-dir sbom/

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: neotrix-sbom
          path: sbom/
          retention-days: 90

      - name: Verify SBOM
        run: |
          if [ -f sbom/neotrix-sbom.json ]; then
            echo "SBOM generated successfully"
            python3 -c "import json; d=json.load(open('sbom/neotrix-sbom.json')); print(f'Components: {len(d.get(\"components\",[]))}')"
          else
            echo "SBOM file not found"
            ls -la sbom/
            exit 1
          fi
