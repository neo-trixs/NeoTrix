# 能力体系裁决台账（P4，2026-10-08）
#
# ## 这份文件解决什么
#
# 2026-10-08 审计实测：仓里有 **13 套**并行的能力/插件表示法、**13 个**能力
# 注册表，而**只有一条**有活的 register→list→invoke 回路。多数系统
# 「定义了、建了、文档也写了，但没有生产消费者」。
#
# 历来的做法是**直接删**。但：
# - 审计本身警告「grep 命中不构成证据」⇒ 删除不可逆，误删代价高；
# - 仓里的教训写得很清楚：**先修裁判再清理**
#   （`ROADMAP-REDUNDANCY-FLAT-MISALIGN-2026-10-07`：3 条 P0 里 2 条是
#   「报 PASS 却结构上不可能失败」）。
#
# ⇒ 因此本轮**不删任何东西**，而是把「每个能力体系是什么、当前什么处置、
# 证据在哪」变成**机器可查的台账**，并立一道门守住它：
#   `scripts/ops/check_capability_inventory.sh`
#
# ## 处置语义（闭集，门会校验）
#
# | disposition | 含义 | 允许退役？ |
# |---|---|---|
# | `spine` | 脊柱本体或与其直接桥接（运行时唯一真源） | ❌ |
# | `active` | 有真实生产消费者 | ❌ |
# | `bridge-only` | 仅作为脊柱的**存量适配**存在，不得新增使用 | ⚠️ 只可删适配层 |
# | `dormant` | 定义完整但**零生产消费者**；保留是因为可能有未记录的调用面 | ⚠️ 需先记录再删 |
# | `deprecated` | 已判死，**禁止新增调用**，待择期删除 | ✅ |
#
# ## 门能查什么、不能查什么（诚实边界）
#
# ✅ 能查（零假阳性）：
#   - 每个声明的体系，其 `anchor` 符号**仍存在**（漂移检测）；
#   - `disposition` 取值在闭集内；
#   - 每个体系都有 `evidence` 字段（强制写证据，杜绝「据说没人用」）。
# ⛔ **不查**「生产消费者数量」——那需要判定「哪些调用点在 `#[cfg(test)]` 里」，
#   文本级正则必然产生假阳性，而假阳性会让人去「修」正确代码
#   （AGENTS.md R-SCAN-1）。该判断必须**人工读代码**并写进 `evidence`。
#
# ⇒ 这道门的作用是**防新增**（新体系必须先声明+写证据）与**防漂移**，
#   而不是替人做消费者计数。

