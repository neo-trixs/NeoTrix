# This template contains all of the possible sections and their default values
# Note that all fields that take a lint level have these possible values:
# * deny - An error will be produced and the check will fail
# * warn - A warning will be produced, but the check will not fail
# * allow - No warning or error will be produced, though in some cases a note

[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # ── 上游约束豁免（2026-08-10 审计）
    "RUSTSEC-2026-0085", "RUSTSEC-2026-0086", "RUSTSEC-2026-0087", "RUSTSEC-2026-0088",
    "RUSTSEC-2026-0089", "RUSTSEC-2026-0092", "RUSTSEC-2026-0093", "RUSTSEC-2026-0094",
    "RUSTSEC-2026-0095", "RUSTSEC-2026-0096", "RUSTSEC-2026-0099", "RUSTSEC-2026-0114",
    "RUSTSEC-2026-0222",
    "RUSTSEC-2026-0118", "RUSTSEC-2026-0195",
    "RUSTSEC-2026-0098", "RUSTSEC-2026-0104", "RUSTSEC-2026-0194",
    "RUSTSEC-2024-0411", "RUSTSEC-2024-0412", "RUSTSEC-2024-0413", "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415", "RUSTSEC-2024-0416", "RUSTSEC-2024-0417", "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419", "RUSTSEC-2024-0420", "RUSTSEC-2025-0098", "RUSTSEC-2025-0141",
    "RUSTSEC-2025-0075", "RUSTSEC-2025-0080", "RUSTSEC-2025-0081", "RUSTSEC-2025-0100",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0384",
    "RUSTSEC-2024-0429",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2025-0119",
    "RUSTSEC-2026-0119",
    "RUSTSEC-2026-0002",
    "RUSTSEC-2024-0382",
]

[licenses]
allow = [
    "MIT", "Apache-2.0", "BSD-3-Clause", "BSD-2-Clause", "Zlib", "ISC",
    "Unicode-3.0", "CC0-1.0", "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false
registries = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow-workspace = false
skip = []
skip-tree = [
    { name = "tokio", version = "1" },
    { name = "hyper", version = "0" },
    { name = "rustls", version = "0" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = []
gitlab = []
bitbucket = []
