# cargo-deny 供给门 (CI: .github/workflows/deny.yml)
# P3 结论前置: 全仓多版本并存 4 组, 3 组系第三方强制, 暂不 ban;
# 本文件先锁 advisories/licenses/sources, 多版本走台账 + 精确 skip。
# 台账 (2026-09-24, Cargo.lock 实测):
# - reqwest 0.11 ← oauth2 4 (我方直引; 升 v5 需改同步 exchange 为 async, 另立项)
# - reqwest 0.13 ← tauri 2.11 / tauri-plugin-updater / pmtiles (第三方, 不可改)
# - axum 0.7 ← tonic 0.12 ← opentelemetry-otlp (optional telemetry, 不可改)
# - wasmtime 41 ← agent-sandbox 0.4 (optional sandbox, 我方 wasmtime 42 与之冲突, 等上游)
# - tungstenite 0.23 ← async-tungstenite ← chromiumoxide (optional stealth-net)
# - tungstenite 0.29 ← tokio-tungstenite 0.29 ← axum 0.8 (我方直引链, 跟随 axum)

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "allow"
# workspace 内 path 依赖无 version 系单体仓正常形态, 放行
allow-wildcard-paths = true
wildcards = "deny"
deny = []
# 显式拒绝已知危险组合 (按需追加)
skip = []
skip-tree = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "OpenSSL",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # holon (simd-vsa): 唯一 git 依赖, 上游无 crates.io 发布
    "https://github.com/watmin/holon-rs",
]
