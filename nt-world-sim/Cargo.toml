[package]
name = "nt-world-sim"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["default"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
neotrix-sim = { path = "../neotrix-sim" }
tokio = { version = "1", features = ["full"] }
