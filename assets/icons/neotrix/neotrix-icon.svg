<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Mac squircle clip path -->
    <clipPath id="squircle">
      <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64z"/>
    </clipPath>
    <!-- Orange radial gradient -->
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFB040"/>
      <stop offset="60%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#CC6600"/>
    </radialGradient>
    <!-- Drop gradient -->
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD080"/>
      <stop offset="40%" stop-color="#FF9E20"/>
      <stop offset="100%" stop-color="#CC5500"/>
    </linearGradient>
    <!-- Glow -->
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#FFD080" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="5" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    
    <!-- Glow -->
    <rect width="1024" height="1024" fill="url(#glow)"/>
    
    <!-- Light rays -->
    <g opacity="0.15" stroke="#FFD080" stroke-width="3" fill="none">
      <line x1="512" y1="350" x2="512" y2="180"/>
      <line x1="512" y1="350" x2="640" y2="220"/>
      <line x1="512" y1="350" x2="384" y2="220"/>
      <line x1="512" y1="350" x2="700" y2="320"/>
      <line x1="512" y1="350" x2="324" y2="320"/>
      <line x1="512" y1="350" x2="680" y2="430"/>
      <line x1="512" y1="350" x2="344" y2="430"/>
      <line x1="512" y1="350" x2="512" y2="540"/>
    </g>
    
    <!-- Scatter drops -->
    <g filter="url(#glow-filter)">
      <!-- Top scatter -->
      <circle cx="512" cy="240" r="16" fill="#FFB040" opacity="0.9"/>
      <circle cx="512" cy="240" r="8" fill="#FFD080" opacity="0.5"/>
      <!-- Right scatter -->
      <circle cx="660" cy="310" r="13" fill="#FF9E20" opacity="0.85"/>
      <circle cx="660" cy="310" r="6" fill="#FFD080" opacity="0.4"/>
      <!-- Far right -->
      <circle cx="720" cy="420" r="10" fill="#FFB040" opacity="0.8"/>
      <!-- Bottom right -->
      <circle cx="640" cy="560" r="12" fill="#FF8C00" opacity="0.85"/>
      <circle cx="640" cy="560" r="5" fill="#FFD080" opacity="0.4"/>
      <!-- Bottom -->
      <circle cx="512" cy="620" r="14" fill="#FF9E20" opacity="0.9"/>
      <circle cx="512" cy="620" r="6" fill="#FFD080" opacity="0.45"/>
      <!-- Bottom left -->
      <circle cx="384" cy="560" r="11" fill="#FFB040" opacity="0.85"/>
      <circle cx="384" cy="560" r="5" fill="#FFD080" opacity="0.4"/>
      <!-- Left -->
      <circle cx="304" cy="420" r="10" fill="#FF8C00" opacity="0.8"/>
      <!-- Top left -->
      <circle cx="364" cy="310" r="13" fill="#FF9E20" opacity="0.85"/>
      <circle cx="364" cy="310" r="6" fill="#FFD080" opacity="0.4"/>
      <!-- Far top-left -->
      <circle cx="300" cy="240" r="9" fill="#FFB040" opacity="0.75"/>
      <!-- Far bottom-right -->
      <circle cx="700" cy="540" r="8" fill="#FFB040" opacity="0.7"/>
      <!-- Far top-right -->
      <circle cx="680" cy="260" r="9" fill="#FF9E20" opacity="0.75"/>
      <!-- Far bottom-left -->
      <circle cx="320" cy="540" r="8" fill="#FF8C00" opacity="0.7"/>
    </g>

    <!-- Main water drop -->
    <g filter="url(#shadow)">
      <path d="M512 300 
               C512 300 460 380 440 440 
               C420 500 420 540 440 570 
               C460 600 490 610 512 610 
               C534 610 564 600 584 570 
               C604 540 604 500 584 440 
               C564 380 512 300 512 300Z" 
            fill="url(#drop)"/>
    </g>
    
    <!-- Drop highlight -->
    <ellipse cx="498" cy="380" rx="18" ry="28" fill="white" opacity="0.35" transform="rotate(-10 498 380)"/>
    <ellipse cx="494" cy="365" rx="8" ry="12" fill="white" opacity="0.5" transform="rotate(-10 494 365)"/>
    
    <!-- "N" letter -->
    <g fill="none" stroke="white" stroke-width="12" stroke-linecap="round" opacity="0.9">
      <line x1="486" y1="440" x2="486" y2="530"/>
      <line x1="486" y1="440" x2="538" y2="530"/>
      <line x1="538" y1="440" x2="538" y2="530"/>
    </g>
  </g>
</svg>
