<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="NeoBot">
  <title>NeoBot</title>
  <!--
    NeoBot 图标 —— 透明底的可爱孩童鲨。

    模板沿用本仓图标生成规范（skills/assets/icons/neotrix/neotrix-icon.svg）：
    1024×1024 构造网格 · Mac squircle 轮廓 · 投影。

    ## 这一版改了什么（2026-09-30 第二轮）

    **① 背景透明**（用户要求「mac 背景透明」）
       上一版有不透明的深海径向渐变底 + 气泡。macOS 上一枚不透底的图标
       会显得像「贴上去的一块方砖」，尤其在浅色/深色壁纸之间切换时。
       现在：squircle 轮廓保留（仍是 mac 图标的正确形状），
       **内部完全透明**，只留鲨鱼剪影。
       ⇒ 投影改成「不透明剪影的投影」而不是「一块底板的投影」——
         否则透明区域里会浮出一块方形灰影，那是透明化最容易漏的一处。

    **② 孩童般笑脸**（用户要求「可爱孩童般笑脸」）
       cute 的四个来源全部加强，且都可单独指认：
         · 眼睛更大更圆，**两点高光**（一点是「有神」，两点是「亮晶晶」）
         · 嘴是**张开的笑**（有口腔深色 + 小舌），不是一条线 ——
           闭合的嘴在小尺寸读成中性脸，孩童气来自「露出牙齿的笑」
         · 腮红更大更粉，位置略低（脸颊，不是耳朵）
         · 整体比例更「圆」：头身比偏婴儿，头大身短
       刻意去掉：危险感元素（尖牙、锐利背鳍）—— 孩童脸与利齿互斥。

    ## 造型为什么这样

      · **侧影**而非正脸：正脸在 16px 单色档糊成一个圆；侧影的
        「圆吻 + 背鳍 + 新月尾」在 16px 仍各自可读。
      · **新月尾**（上叶大于下叶）是鲨的鉴别特征，鲸没有。
      · 背鳍**圆角**后掠 —— 尖角会破坏「无害」印象。

    ⛔ 原创造型，不临摹任何现有图标。内部只有鲨鱼与投影，无外部资源。
  -->
  <defs>
    <!-- Mac 轮廓：保留形状，内部透明 -->
    <clipPath id="squircle">
      <path d="M512 64C264.6 64 64 264.6 64 512s200.6 448 448 448 448-200.6 448-448S759.4 64 512 64z"/>
    </clipPath>

    <!-- 身体：背深腹浅。透明底上更需要这个明暗差，否则剪影会「糊」 -->
    <linearGradient id="body" x1="0.12" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#8FD8EE"/>
      <stop offset="55%" stop-color="#5AB6D6"/>
      <stop offset="100%" stop-color="#3A93B6"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DFF2F9"/>
    </linearGradient>
    <linearGradient id="fin" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#7CC6E0"/>
      <stop offset="100%" stop-color="#3E8CAC"/>
    </linearGradient>

    <!-- 投影：透明底上这是唯一还看得见的「体积」线索 -->
    <filter id="lift" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0A3A4C" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!--
      ⛔ 刻意不画任何底板 rect。
         透明底 + 投影时，若还留一块半透明底，投影会变成「方形灰影」，
         整个图标的透明化就白做了。
    -->

    <g filter="url(#lift)">
      <!-- 尾鳍：上叶明显大于下叶（异尾，鲨的鉴别特征） -->
      <path fill="url(#fin)" d="M726 588
               C782 556 826 494 850 420
               C858 390 894 396 890 430
               C882 502 870 552 860 594
               C854 628 872 652 900 678
               C922 698 900 726 872 706
               C812 664 766 630 730 606 Z"/>

      <!-- 背鳍：先画 ⇒ 根部被身体盖住，看起来天然连着。
           底宽 ~150、尖后掠、顶圆（窄而竖直会读成兔子耳朵）。 -->
      <path fill="url(#fin)" d="M570 418
               C578 330 622 266 704 236
               C758 216 790 254 762 294
               C740 328 722 368 706 414 Z"/>

      <!-- 身体：更圆更胖（婴儿头身比），吻部圆钝 -->
      <path fill="url(#body)" d="M236 596
               C228 476 316 396 452 390
               C520 387 566 392 606 402
               C766 436 812 486 832 546
               C812 612 742 660 638 672
               C520 686 386 688 306 662
               C262 646 238 624 236 596 Z"/>

      <!-- 腹：浅色隆起，孩童气的一大来源（圆滚滚的肚子） -->
      <path fill="url(#belly)" d="M300 602
               C300 662 402 692 532 688
               C652 684 740 644 756 588
               C744 640 662 672 552 676
               C440 680 340 656 300 602 Z"/>

      <!-- 背鳍分界：一体色下鳍会消失 -->
      <path fill="#3E8CAC" opacity="0.30" d="M576 414
               C584 330 626 270 704 240
               C720 232 734 242 726 258
               C674 298 626 352 592 410 Z"/>

      <!-- 胸鳍：圆角短鳍，像小手 -->
      <path fill="url(#fin)" d="M470 670 C492 706 528 736 570 750
               C586 756 580 732 566 718 C536 688 512 670 494 660 Z"/>
    </g>

    <!-- ══ 孩童般笑脸 ══════════════════════════════════════ -->

    <!-- 眼睛：更大更圆。**两点**高光 —— 一点是「有神」，两点是「亮晶晶」。 -->
    <g>
      <ellipse cx="360" cy="518" rx="62" ry="66" fill="#FFFFFF"/>
      <ellipse cx="352" cy="522" rx="34" ry="37" fill="#123A4A"/>
      <circle cx="339" cy="505" r="14" fill="#FFFFFF"/>
      <circle cx="366" cy="537" r="7"  fill="#FFFFFF" opacity="0.85"/>
    </g>

    <!-- 张开的笑：口腔深色 + 小舌。闭合的嘴读成中性脸；
         孩童气来自「露出牙齿的笑」，所以口腔要真的张开。 -->
    <g>
      <path d="M296 606
               C316 668 396 682 424 618
               C400 606 322 600 296 606 Z"
            fill="#123A4A"/>
      <!-- 小舌 -->
      <path d="M340 654 C354 668 384 670 396 656
               C380 648 356 648 340 654 Z"
            fill="#FF8FA3"/>
      <!-- 上齿：一条白弧，读成「露出的牙」 -->
      <path d="M300 606 C320 624 386 626 412 612
               C392 638 322 640 300 606 Z"
            fill="#FFFFFF"/>
    </g>

    <!-- 腮红：更大更粉，位置略低（是脸颊不是耳朵） -->
    <ellipse cx="282" cy="600" rx="42" ry="25" fill="#FF7F96" opacity="0.5"/>
    <ellipse cx="472" cy="614" rx="34" ry="20" fill="#FF7F96" opacity="0.4"/>

    <!-- 鳃：两道短线，贴吻端。不画满鳃 —— 满鳃显成熟不显孩童。 -->
    <g stroke="#3E8CAC" stroke-width="11" stroke-linecap="round" opacity="0.5" fill="none">
      <path d="M432 534 C424 560 424 582 430 602"/>
      <path d="M470 536 C463 560 463 582 468 602"/>
    </g>

    <!-- 身体高光：左上受光，落在背脊而非额头（落额头会读成一块白斑） -->
    <ellipse cx="470" cy="424" rx="108" ry="27" fill="#FFFFFF" opacity="0.34"
             transform="rotate(-11 470 424)"/>
    <ellipse cx="452" cy="416" rx="44" ry="12" fill="#FFFFFF" opacity="0.38"
             transform="rotate(-11 452 416)"/>
  </g>
</svg>
