<style>
  :root{--bg:#06060E;--bg2:#0E0E1A;--bg3:#161626;--gold:#D4A853;--gold2:#A08030;

  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--tx);font-family:var(--ff-sans);overflow:hidden;height:100vh;font-size:13px;}
  .header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:8px 16px;height:44px;background:linear-gradient(180deg,rgba(6,6,14,0.96),transparent);backdrop-filter:blur(12px);border-bottom:1px solid rgba(212,168,83,0.08);}

  .h-btn.primary{background:rgba(74,138,255,0.1);border-color:rgba(74,138,255,0.3);color:var(--t2);}

  .main{display:flex;height:100vh;padding-top:44px;}
  .map-area{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(ellipse at center,rgba(74,138,255,0.02),transparent 70%);}

  .continent-fill{fill:rgba(100,120,100,0.06);stroke:rgba(100,120,100,0.1);stroke-width:0.3;}

  .detail-full{grid-column:1/-1;}
  .detail-section{background:var(--bg2);border-radius:8px;padding:12px;border:1px solid rgba(212,168,83,0.06);}

  .detail-row{font-size:11px;color:var(--tx2);padding:3px 0;display:flex;justify-content:space-between;}

  .detail-desc{font-size:12px;color:var(--tx2);line-height:1.7;padding:8px 10px;background:rgba(255,255,255,0.02);border-radius:6px;border-left:2px solid var(--gold);}

  .action-btn{padding:5px 12px;border-radius:4px;font-size:9px;font-family:var(--ff-sans);cursor:pointer;transition:all 0.3s;border:1px solid rgba(212,168,83,0.08);background:rgba(255,255,255,0.02);color:var(--tx2);}

  @keyframes pulseGold{0%,100%{filter:drop-shadow(0 0 2px var(--gold));}50%{filter:drop-shadow(0 0 6px var(--gold));}}

  @keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
  .fade-in{animation:fadeIn 0.3s;}

<body>

<div class="header">

<script>
/* ═══════════════════════════════════════════════════════════════
   EWHR · EVIDENCE-WEIGHTED HISTORY RECONSTRUCTION · v0.2
   Association Engine · Weight Self-Calibration
   ═══════════════════════════════════════════════════════════════ */

// ── Era Parser ──
function parseEra(str) {
  if (!str) return { min:0, max:0, center:0 };
  str = str.replace(/,/g,'');
  if (str === 'modern') return { min:1900, max:2026, center:1963 };
  if (str === 'pre-1492 CE') return { min:0, max:1492, center:746 };
  const bp = str.match(/^([\d.]+)\s*BP$/);
  if (bp) return { min:+bp[1]-50, max:+bp[1]+50, center:+bp[1] };
  const bpr = str.match(/^([\d.]+)-([\d.]+)\s*BP$/);
  if (bpr) return { min:+bpr[1], max:+bpr[2], center:(+bpr[1]+ +bpr[2])/2 };
  const ce = str.match(/^([\d.]+)\s*CE$/);
  if (ce) return { min:2026-(+ce[1]+50), max:2026-(+ce[1]-50), center:2026- +ce[1] };
  const cer = str.match(/^([\d.]+)-([\d.]+)\s*CE$/);
  if (cer) { const lo=+cer[1], hi=+cer[2]; return { min:2026-hi, max:2026-lo, center:2026-(lo+hi)/2 }; }
  const bce = str.match(/^([\d.]+)\s*BCE$/);
  if (bce) return { min:2026- - +bce[1], max:2026-(- +bce[1]), center:2026- - +bce[1] };
  const bcer = str.match(/^([\d.]+)-([\d.]+)\s*BCE$/);
  if (bcer) { const lo=+bcer[1], hi=+bcer[2]; return { min:2026-hi, max:2026-lo, center:2026-(lo+hi)/2 }; }
  return { min:0, max:0, center:0 };
}

function temporalOverlap(a, b) {
  const ea = parseEra(a), eb = parseEra(b);
  const overlap = Math.min(ea.max, eb.max) - Math.max(ea.min, eb.min);
  if (overlap <= 0) return Math.max(0, 0.05 + overlap / Math.max(ea.max-ea.min, eb.max-eb.min, 1) * 0.1);
  const totalSpan = Math.max(ea.max-ea.min, eb.max-eb.min, overlap);
  return Math.min(1, overlap / totalSpan);
}

// ── Haversine Distance ──
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLon = (lon2-lon1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ── Core Data Structure ──
class EvidencePoint {
  constructor(data) {
    const hadCalibrated = data.calibratedScore !== undefined && data.calibratedScore !== data.effectiveConfidence;
    Object.assign(this, data);
    this.id = data.id;
    this.eraParsed = parseEra(data.era);
    this.rawConfidence = this.calcConfidence();
    this.forgeryRisk = this.calcForgeryRisk();
    this.effectiveConfidence = this.rawConfidence * (1 - this.forgeryRisk * 0.5);
    this.calibratedScore = hadCalibrated ? data.calibratedScore : this.effectiveConfidence;
  }

  calcConfidence() {
    const methods = this.datingMethods || [];
    if (methods.length === 0) return 0.2;
    const w = {'c14':0.9,'tl':0.75,'osl':0.8,'paleomag':0.6,'esr':0.65,'useries':0.85,'dendro':1.0,'strat':0.5,'dna':0.85,'insect':0.75,'inaa':0.85,'gcms':0.85,'srs':0.9,'xray':0.7,'lithic':0.6,'glyph':0.55,'archaeoastronomy':0.6};
    let sw = 0, n = 0;
    methods.forEach(m => { sw += w[m]||0.5; n++; });
    let base = sw / n;
    let ctx = this.contextClarity || 0.7;
    let pub = this.publicationLevel || 0.5;
    let indep = Math.min(1, (this.independentReplications || 0) * 0.3);
    return base * ctx * (pub + 0.3) * (0.5 + indep);
  }

  calcForgeryRisk() {
    return ( (this.provenanceGap||0) + (this.anachronismIndex||0) + (this.motivationScore||0) + (this.verificationGap||0) ) / 4;
  }

  get tier() {
    if (this.forgeryRisk > 0.8) return 5;
    const s = this.calibratedScore;
    if (s >= 0.75) return 1;
    if (s >= 0.55) return 2;
    if (s >= 0.35) return 3;
    if (s >= 0.15) return 4;
    return 5;
  }

  get tierLabel() { return ['','T1 双重确认','T2 单源确认','T3 初步可考','T4 存疑','T5 判定伪造'][this.tier]; }
  get tierColor() { return ['','#4AE86A','#4A8AFF','#E8C84A','#E8884A','#E84A4A'][this.tier]; }
  get tierClass() { return 't'+this.tier; }
}

// ── Evidence Database (75 entries, actual) ──
const EVIDENCE_DB = [
  // === T1: Double Confirmed (20 entries) ===

    datingMethods:['c14','dendro','strat'], contextClarity:0.95, publicationLevel:0.95, independentReplications:5,
    provenanceGap:0.05, anachronismIndex:0.05, motivationScore:0.05, verificationGap:0.05,
    ref:'Schmidt 1994-2014; UNESCO 2018; Nature 2025 C14 recalibration' },

  { id:'catalhoyuk', name:'恰塔霍裕克', lat:37.7, lng:32.8, era:'9,000 BP', category:'settlement',

    datingMethods:['c14','dendro','strat'], contextClarity:0.9, publicationLevel:0.9, independentReplications:4,
    provenanceGap:0.05, anachronismIndex:0.05, motivationScore:0.05, verificationGap:0.05,
    ref:'Ian Hodder 1993-2018' },

  { id:'xigou', name:'西沟遗址（装柄技术）', lat:33.0, lng:111.5, era:'72,000-160,000 BP', category:'tool',
    desc:'河南淅川出土2601件石制品，发现东亚最早复合工具装柄技术（嵌入式+倚靠式）。推翻"东亚旧石器保守落后"的西方中心论。',
    datingMethods:['osl','esr','paleomag','strat'], contextClarity:0.9, publicationLevel:0.95, independentReplications:3,
    provenanceGap:0.05, anachronismIndex:0.1, motivationScore:0.05, verificationGap:0.05,

  { id:'gantang', name:'甘棠箐木器', lat:24.0, lng:102.5, era:'300,000 BP', category:'tool',
    desc:'云南出土35件30万年前木器（挖掘棒、钩状刃器），东亚最古老木制工具，人工修理痕迹清晰可见。',

  { id:'fire400k', name:'40万年前用火证据（英国）', lat:51.3, lng:0.1, era:'400,000 BP', category:'tool',

// ── Association Engine ──
class BayesianAssociationEngine {
  constructor(evidenceDB) {
    this.db = evidenceDB;
    this.links = [];
    this.clusters = [];
    this.computeAll();
  }

  computeAll() {
    this.links = [];
    this.clusters = [];
    for (let i = 0; i < this.db.length; i++) {
      for (let j = i + 1; j < this.db.length; j++) {
        const prob = this.computeConnectionProb(this.db[i], this.db[j]);
        if (prob > 0.12) {
          this.links.push({
            from: this.db[i].id,
            to: this.db[j].id,
            probability: prob,
            strength: prob > 0.3 ? 'strong' : prob > 0.2 ? 'medium' : 'weak',
            factors: this.computeFactors(this.db[i], this.db[j])
          });
        }
      }
    }
    this.links.sort((a,b) => b.probability - a.probability);
    this.detectClusters();
  }

  computeConnectionProb(a, b) {
    // Prior: base probability any two given evidence are connected
    let prior = 0.08;

    // Spatial factor: inverse distance → closer = more likely to be connected
    const dist = haversineKm(a.lat, a.lng, b.lat, b.lng);
    const spatialFactor = Math.exp(-(dist*dist) / (2*3000*3000));

    // Temporal factor: era overlap
    const tempFactor = temporalOverlap(a.era, b.era);

    // Category factor: same category = 2x, related category = 1.5x
    const sameCat = a.category === b.category;
    const relatedCats = {
      'megalith':['technology','art'], 'technology':['megalith','tool'],
      'contact':['migration','writing'], 'migration':['contact','tool'],
      'settlement':['sunken','megalith'], 'art':['writing','tool','megalith'],
      'tool':['art','technology'], 'writing':['art','contact'],
      'sunken':['settlement'], 'medical':['technology'], 'forgery':[]
    };
    let catFactor = 1.0;
    if (sameCat) catFactor = 2.0;
    else if ((relatedCats[a.category]||[]).includes(b.category) || (relatedCats[b.category]||[]).includes(a.category)) catFactor = 1.5;

    // Method factor: shared dating methods = more confidence
    const sharedMethods = (a.datingMethods||[]).filter(m => (b.datingMethods||[]).includes(m)).length;
    const methodFactor = 1 + sharedMethods * 0.15;

    // Confidence factor: both high confidence = more likely a real connection
    const aScore = a.effectiveConfidence || 0.5;
    const bScore = b.effectiveConfidence || 0.5;
    const confFactor = (aScore + bScore) / 2;

    // Final association probability
    let prob = prior * spatialFactor * tempFactor * catFactor * methodFactor * (0.5 + confFactor);
    prob = Math.min(0.99, Math.max(0, prob));
    return prob;
  }

  computeFactors(a, b) {
    const dist = haversineKm(a.lat, a.lng, b.lat, b.lng);
    const temp = temporalOverlap(a.era, b.era);
    return {
      distance_km: Math.round(dist),
      distance_factor: +Math.exp(-(dist*dist) / (2*3000*3000)).toFixed(3),
      temporal_overlap: +temp.toFixed(3),
      same_category: a.category === b.category,
      shared_methods: (a.datingMethods||[]).filter(m => (b.datingMethods||[]).includes(m)).length
    };
  }

  detectClusters() {
    // Build graph adjacency
    const adj = {};
    this.db.forEach(e => adj[e.id] = []);
    this.links.forEach(l => {
      if (l.probability > 0.2) {
        adj[l.from].push({id:l.to, prob:l.probability});
        adj[l.to].push({id:l.from, prob:l.probability});
      }
    });

    // Find connected components (clusters) of size >= 3
    const visited = new Set();
    this.clusters = [];
    this.db.forEach(e => {
      if (visited.has(e.id)) return;
      const component = [];
      const queue = [e.id];
      visited.add(e.id);
      while (queue.length) {
        const cur = queue.shift();
        component.push(cur);
        (adj[cur]||[]).forEach(n => {
          if (!visited.has(n.id)) { visited.add(n.id); queue.push(n.id); }
        });
      }
      if (component.length >= 3) {
        const members = component.map(id => {
          const ep = this.db.find(x => x.id === id);
          return { id, name: ep?.name||id, lat: ep?.lat, lng: ep?.lng, tier: ep?.tier, score: ep?.effectiveConfidence };
        });
        const avgScore = members.reduce((s,m) => s+(m.score||0),0)/members.length;
        const avgLat = members.reduce((s,m) => s+m.lat,0)/members.length;
        const avgLng = members.reduce((s,m) => s+m.lng,0)/members.length;
        const internalLinks = this.links.filter(l => component.includes(l.from) && component.includes(l.to));
        this.clusters.push({
          id: 'C'+this.clusters.length,
          members,
          avgScore,
          avgLat, avgLng,
          internalLinks: internalLinks.length,
          size: component.length,
          name: '聚类 '+(this.clusters.length+1)
        });
      }
    });
    this.clusters.sort((a,b) => b.avgScore - a.avgScore);
    this.clusters.forEach((c,i) => {
      const topAreas = [...new Set(c.members.map(m => EVIDENCE_DB.find(e=>e.id===m.id)?.category||'').filter(Boolean))];
      c.name = '聚类'+(i+1)+': '+topAreas.slice(0,3).join('/');
    });
  }

  getLinksForEvidence(id) {
    return this.links.filter(l => l.from === id || l.to === id);
  }
}

// ── Weight Self-Calibrator ──
class WeightCalibrator {
  constructor(evidenceDB, bayesian) {
    this.db = evidenceDB;
    this.bayesian = bayesian;
    this.history = [];
  }

  run() {
    this.db.forEach(ep => {
      const links = this.bayesian.getLinksForEvidence(ep.id);
      if (links.length === 0) { ep.calibratedScore = ep.effectiveConfidence; return; }

      // Compute neighbor-weighted confidence
      let numerator = 0, denominator = 0;
      links.forEach(l => {
        const neighborId = l.from === ep.id ? l.to : l.from;
        const neighbor = this.db.find(e => e.id === neighborId);
        if (!neighbor) return;
        const weight = l.probability * (l.probability > 0.3 ? 1.5 : 1);
        numerator += weight * (neighbor.effectiveConfidence || 0.5);
        denominator += weight;
      });
      const neighborAvg = denominator > 0 ? numerator / denominator : 0.5;

      // Network-adjusted score: pull toward neighbor consensus
      const pullStrength = Math.min(0.15, links.length * 0.02);
      const adjusted = ep.effectiveConfidence + pullStrength * (neighborAvg - ep.effectiveConfidence);

      // Degree centrality boost: more connections = slightly more reliable
      const degree = links.length;
      const centralityBoost = Math.min(0.08, degree * 0.01);

      ep.calibratedScore = Math.max(0.01, Math.min(1, adjusted + centralityBoost));
    });

    this.history.push({
      time: new Date().toISOString(),
      type:'calibration',
      msg: `全局权重自校准完成。${this.db.length} 条物证通过贝叶斯网络重新均衡。`
    });
    return this.history[this.history.length-1];
  }
}

// ── Blind Spot Predictor ──
class BlindSpotPredictor {
  constructor(evidenceDB) {
    this.db = evidenceDB;
    this.blindSpots = [];
    this.compute();
  }

  compute() {
    this.blindSpots = [];
    // Grid: 15° x 15° cells
    const grid = {};
    const G = 10;
    for (let lat = -90; lat < 90; lat += G) {
      for (let lng = -180; lng < 180; lng += G) {
        const key = `${Math.floor(lat/G)},${Math.floor(lng/G)}`;
        grid[key] = { lat:lat+G/2, lng:lng+G/2, count:0, neighbors:0 };
      }
    }
    this.db.forEach(ep => {
      if (ep.lat === 0 && ep.lng === 0) return;
      const key = `${Math.floor(ep.lat/G)},${Math.floor(ep.lng/G)}`;
      if (grid[key]) grid[key].count++;
    });

    // Find blind spots: cells with 0 evidence but surrounded by ≥2 cells with evidence
    Object.entries(grid).forEach(([key, cell]) => {
      if (cell.count > 0) return;
      const parts = key.split(',').map(Number);
      let neighborCount = 0;
      for (let dl = -1; dl <= 1; dl++) {
        for (let dg = -1; dg <= 1; dg++) {
          if (dl === 0 && dg === 0) continue;
          const nk = `${parts[0]+dl},${parts[1]+dg}`;
          if (grid[nk] && grid[nk].count > 0) neighborCount++;
        }
      }
      if (neighborCount >= 2) {
        this.blindSpots.push({
          lat: cell.lat, lng: cell.lng,
          neighborCount,
          priority: neighborCount >= 4 ? 'high' : neighborCount >= 3 ? 'medium' : 'low'
        });
      }
    });

    this.blindSpots.sort((a,b) => b.neighborCount - a.neighborCount);
  }

  describeSpot(spot) {
    const areas = {
      '0,0': '中大西洋', '1,2': '非洲', '-1,-1': '南大西洋', '0,1': '中非',
      '0,-1': '中美洲', '-1,0': '南美洲北部', '2,0': '中亚', '2,1': '中亚/蒙古',
      '1,-1': '亚马逊', '-1,-2': '秘鲁外海', '3,0': '西伯利亚', '3,1': '中西伯利亚',
      '2,-2': '太平洋', '-2,-2': '南太平洋', '-2,3': '南印度洋', '2,3': '东南亚',
      '5,5': '北冰洋'
    };
    const key = `${Math.floor(spot.lat/10)},${Math.floor(spot.lng/10)}`;
    const area = areas[key] || `格 ${key}`;
    return { area, ...spot };
  }
}

function ll(lon, lat) { return { x:(lon+180)/360*1000, y:(90-lat)/180*500 }; }

function buildMap() {
  const svg = document.getElementById('worldMap');
  svg.innerHTML = '';

  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  bg.setAttribute('width','1000'); bg.setAttribute('height','500');
  bg.setAttribute('fill','var(--bg)');
  svg.appendChild(bg);

  // Continents
  fetch('https://cdn.jsdelivr.net/npm/world-map-path@1.0.2/world.json')
    .then(r => r.json())
    .then(data => {
      const g = document.createElementNS('http://www.w3.org/2000/svg','g');
      data.features.forEach(f => {
        const path = document.createElementNS('http://www.w3.org/2000/svg','path');
        path.setAttribute('d',f.d);
        path.setAttribute('class','continent-fill');
        g.appendChild(path);
      });
      svg.insertBefore(g, svg.firstChild);
    }).catch(() => {});

  // Graticule
  for (let lat=-80; lat<=80; lat+=20) {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1','0'); l.setAttribute('y1',ll(0,lat).y);
    l.setAttribute('x2','1000'); l.setAttribute('y2',ll(0,lat).y);
    l.setAttribute('class','graticule'); svg.appendChild(l);
  }
  for (let lon=-160; lon<=160; lon+=20) {
    const l = document.createElementNS('http://www.w3.org/2000/svg','line');
    l.setAttribute('x1',ll(lon,0).x); l.setAttribute('y1','0');
    l.setAttribute('x2',ll(lon,0).x); l.setAttribute('y2','500');
    l.setAttribute('class','graticule'); svg.appendChild(l);
  }

  // Equator
  const eq = document.createElementNS('http://www.w3.org/2000/svg','line');
  const eqy = ll(0,0).y;
  eq.setAttribute('x1','0'); eq.setAttribute('y1',eqy);
  eq.setAttribute('x2','1000'); eq.setAttribute('y2',eqy);
  eq.setAttribute('stroke','rgba(212,168,83,0.05)'); eq.setAttribute('stroke-width','0.5');
  svg.appendChild(eq);

  // Connection lines layer
  const connG = document.createElementNS('http://www.w3.org/2000/svg','g');
  connG.setAttribute('id','connLayer');
  svg.appendChild(connG);

  // Evidence dots layer
  const dotG = document.createElementNS('http://www.w3.org/2000/svg','g');
  dotG.setAttribute('id','dotLayer');
  svg.appendChild(dotG);

  // Render connection lines (only strong + medium)
  bayesian.links.forEach(l => {
    if (l.probability < 0.18) return;
    const from = EVIDENCE_DB.find(e => e.id === l.from);
    const to = EVIDENCE_DB.find(e => e.id === l.to);
    if (!from||!to) return;
    if ((from.lat===0&&from.lng===0)||(to.lat===0&&to.lng===0)) return;
    const p1 = ll(from.lng, from.lat), p2 = ll(to.lng, to.lat);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',p1.x); line.setAttribute('y1',p1.y);
    line.setAttribute('x2',p2.x); line.setAttribute('y2',p2.y);
    const opacity = Math.min(0.6, l.probability * 1.5);
    line.setAttribute('stroke',`rgba(212,168,83,${opacity})`);
    line.setAttribute('class','connect-line');
    line.style.opacity = (currentFilter==='all') ? '1' : '0';
    connG.appendChild(line);
  });

  // Render evidence dots
  EVIDENCE_DB.forEach(ep => {
    const epo = new EvidencePoint(ep);
    if (ep.lat===0&&ep.lng===0) return;
    const p = ll(ep.lng, ep.lat);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.dataset.epId = ep.id;
    g.dataset.tier = epo.tier;
    g.addEventListener('click', () => showDetail(epo));

    const dot = document.createElementNS('http://www.w3.org/2000/svg','circle');
    dot.setAttribute('cx',p.x); dot.setAttribute('cy',p.y);
    const r = epo.tier <= 1 ? 4.5 : epo.tier === 2 ? 3.5 : epo.tier === 5 ? 2.5 : 3;
    dot.setAttribute('r',r);
    dot.setAttribute('fill',epo.tierColor);
    dot.setAttribute('opacity',epo.tier===5?'0.5':'0.8');
    dot.setAttribute('class','ep-dot');
    if (epo.tier <= 1) dot.classList.add('glow-pulse');
    g.appendChild(dot);

    const lbl = document.createElementNS('http://www.w3.org/2000/svg','text');
    lbl.setAttribute('x',p.x); lbl.setAttribute('y',p.y+(epo.tier<=1?9:7));
    lbl.setAttribute('class','ep-label');
    lbl.setAttribute('fill',epo.tierColor);
    lbl.textContent = ep.name;
    g.appendChild(lbl);

    dotG.appendChild(g);
  });

  applyFilter();
  updateLegend();
  updateStats();
  renderCurrentTab();
}

}

// ── Tier Change Tracking ──
function trackTierChanges() {
  const before = EVIDENCE_DB.map(e => ({id:e.id, tier:new EvidencePoint(e).tier}));
  bayesian.computeAll();
  blindSpotter.compute();
  calibrator.run();

  const after = EVIDENCE_DB.map(e => ({id:e.id, tier:new EvidencePoint(e).tier}));
  let changes = [];
  before.forEach((b,i) => {
    if (b.tier !== after[i].tier) {
      const ep = EVIDENCE_DB.find(e => e.id === b.id);
      changes.push(`${ep?.name||b.id}: T${b.tier}→T${after[i].tier}`);
    }
  });
  return changes;
}

function runCalibration() {
  const changes = trackTierChanges();
  const result = calibrator.history[calibrator.history.length-1] || { type:'calibration', msg:'校准完成' };
  engine.addEntry(result.type, result.msg);

  const t1s = EVIDENCE_DB.filter(e => new EvidencePoint(e).tier === 1);
  const t5s = EVIDENCE_DB.filter(e => new EvidencePoint(e).tier === 5);
  engine.addEntry('observation', `校准后: T1=${t1s.length} T5=${t5s.length} 比率=${(t1s.length/t5s.length).toFixed(1)}`);

  if (changes.length > 0) {
    engine.addEntry('selfcorrect', `层级变更: ${changes.join('; ')}`);
  }

  saveData();
  buildMap();
}

// ── Persistence ──
const STORAGE_KEY = 'ewhr_v02_data';

function stripComputed(obj) {
  const clean = {...obj};
  delete clean.eraParsed; delete clean.rawConfidence; delete clean.forgeryRisk;
  delete clean.effectiveConfidence; delete clean.calibratedScore;
  return clean;
}

function saveData() {
  try {
    const data = {
      evidence: EVIDENCE_DB.map(e => stripComputed(e)),
      log: engine.log,
      calibrations: calibrator.history
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch(e) { /* storage full or unavailable */ }
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);

    // Restore evidence (merge with defaults for new fields)
    if (data.evidence && data.evidence.length > 0) {
      EVIDENCE_DB.length = 0;
      data.evidence.forEach(e => EVIDENCE_DB.push(stripComputed(e)));
    }

    // Restore log
    if (data.log) engine.log = data.log;

    // Restore calibration history
    if (data.calibrations) calibrator.history = data.calibrations;

    engine.addEntry('update', `持久化数据恢复: ${EVIDENCE_DB.length} 条物证, ${engine.log.length} 条日志`);
    return true;
  } catch(e) { return false; }
}

function exportJSON() {
  const data = {
    version: '0.2',
    exported: new Date().toISOString(),
    evidence: EVIDENCE_DB.map(e => stripComputed(e)),
    log: engine.log,
    stats: {
      total: EVIDENCE_DB.length,
      t1: EVIDENCE_DB.filter(e=>new EvidencePoint(e).tier===1).length,
      t2: EVIDENCE_DB.filter(e=>new EvidencePoint(e).tier===2).length,
      t3: EVIDENCE_DB.filter(e=>new EvidencePoint(e).tier===3).length,
      t4: EVIDENCE_DB.filter(e=>new EvidencePoint(e).tier===4).length,
      t5: EVIDENCE_DB.filter(e=>new EvidencePoint(e).tier===5).length,
      clusters: bayesian.clusters.length,
      strongLinks: bayesian.links.filter(l=>l.probability>0.25).length
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ewhr-export-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function importJSON(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.evidence || !Array.isArray(data.evidence)) {
        alert('无效的EWHR导出文件');
        return;
      }
      const count = data.evidence.length;
      data.evidence.forEach(ep => {
        if (!EVIDENCE_DB.find(x => x.id === ep.id)) EVIDENCE_DB.push(stripComputed(ep));
      });
      engine.addEntry('update', `导入 ${count} 条物证 (去重后新增)`);
      saveData();
      bayesian.computeAll();
      blindSpotter.compute();
      calibrator.run();
      buildMap();
    } catch(err) { alert('导入失败: '+err.message); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

    desc: g('f-desc').value.trim(),
    ref: g('f-ref').value.trim(),
    datingMethods: g('f-methods').value.split(',').map(s=>s.trim()).filter(Boolean),

    contextClarity: parseFloat(g('f-ctx').value) ?? 0.7,
    publicationLevel: parseFloat(g('f-pub').value) ?? 0.5,
    provenanceGap: parseFloat(g('f-pgap').value) ?? 0.1,

    motivationScore: parseFloat(g('f-ms').value) ?? 0.05,
    verificationGap: parseFloat(g('f-vg').value) ?? 0.1,
  };

  if (existingId) {
    const idx = EVIDENCE_DB.findIndex(e => e.id === existingId);
    if (idx >= 0) Object.assign(EVIDENCE_DB[idx], data);

  } else {
    if (EVIDENCE_DB.find(e => e.id === data.id)) {
      alert('ID已存在，请使用唯一ID');
      return;
    }
    EVIDENCE_DB.push(data);
    engine.addEntry('update', `新增物证: ${data.name} [${data.era}]`);
  }

  saveData();
  bayesian.computeAll();
  blindSpotter.compute();
  calibrator.run();
  closeDetail();
  buildMap();
}

// ── Timeline View ──
function renderTimeline() {
  const el = document.getElementById('spList');
  const items = EVIDENCE_DB.filter(e => e.lat !== 0 || e.lng !== 0)
    .map(e => new EvidencePoint(e))
    .filter(e => e.eraParsed.center > 0)
    .sort((a,b) => a.eraParsed.center - b.eraParsed.center);

  if (items.length === 0) {
    el.innerHTML = '<div style="color:var(--tx3);font-size:10px;padding:10px;">暂无年代数据</div>';
    return;
  }

  const minYear = items[0].eraParsed.center;
  const maxYear = items[items.length-1].eraParsed.center;
  const range = Math.max(1, maxYear - minYear);

  // Group into eras
  const eras = {
    '1万年内': { min:0, max:10000, items:[] },
    '1-5万年': { min:10000, max:50000, items:[] },
    '5-50万年': { min:50000, max:500000, items:[] },
    '50万-200万年': { min:500000, max:2000000, items:[] },
    '>200万年': { min:2000000, max:Infinity, items:[] }
  };

  items.forEach(item => {
    const y = item.eraParsed.center;
    if (y <= 10000) eras['1万年内'].items.push(item);
    else if (y <= 50000) eras['1-5万年'].items.push(item);
    else if (y <= 500000) eras['5-50万年'].items.push(item);
    else if (y <= 2000000) eras['50万-200万年'].items.push(item);
    else eras['>200万年'].items.push(item);
  });

  let html = `<div style="font-size:10px;color:var(--tx3);margin-bottom:8px;">
    时间线: ${items.length} 条物证, 跨度 ${(minYear/1000).toFixed(0)}k - ${(maxYear/1000).toFixed(0)}k BP</div>`;

  Object.entries(eras).forEach(([label, era]) => {
    if (era.items.length === 0) return;
    const t1 = era.items.filter(i=>i.tier===1).length;
    const t2 = era.items.filter(i=>i.tier===2).length;
    const t3 = era.items.filter(i=>i.tier===3).length;
    const t4 = era.items.filter(i=>i.tier===4).length;

    html += `<div style="margin-bottom:10px;">
      <div style="font-size:11px;color:var(--tx);font-weight:600;margin-bottom:4px;">
        ${label} <span style="font-size:9px;color:var(--tx3);font-weight:400;">(${era.items.length} 条 · T1:${t1} T2:${t2} T3:${t3} T4:${t4})</span>
      </div>`;

    era.items.sort((a,b)=>b.tier - a.tier).forEach(item => {
      html += `<div class="ep-card ep-card-${item.tierClass}" data-evidence-id="${item.id.replace(/['"]/g,'')}" style="padding:5px 8px;">
        <div style="display:flex;justify-content:space-between;">
          <span style="font-size:10px;color:var(--tx);">${item.name} <span class="detail-tag tag-${item.tierClass}" style="font-size:7px;">${item.tierLabel}</span></span>
          <span style="font-size:8px;color:var(--tx3);">${item.era}</span>
        </div>
      </div>`;
    });
    html += '</div>';
  });

  el.innerHTML = html;
}

// ── Init (with persistence) ──
document.addEventListener('DOMContentLoaded', () => {
  loadData();
  bayesian.computeAll();
  blindSpotter.compute();
  calibrator.run();

  // Auto-save on page unload
  window.addEventListener('beforeunload', saveData);

  buildMap();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
window.__engine = engine;
window.__bayesian = bayesian;
window.__calibrator = calibrator;
window.__blind = blindSpotter;
window.__evidence = EVIDENCE_DB;

// Event delegation: evidence card clicks → showDetail
document.addEventListener('click', e => {
  const card = e.target.closest('[data-evidence-id]');
  if (card) {
    const id = card.dataset.evidenceId;
    const raw = EVIDENCE_DB.find(r => r.id === id);
    if (raw) showDetail(new EvidencePoint(raw));
    return;
  }
  if (e.target.closest('[data-action="save-evidence"]')) {
    const btn = e.target.closest('[data-action="save-evidence"]');
    saveEvidenceForm(btn.dataset.existingId);
    return;
  }
  if (e.target.closest('[data-action="close-detail"]')) {
    closeDetail();
  }
});

function updateLegend() {
  document.getElementById('legend').innerHTML = '<div class="legend-title">置信度图例</div>'+
    [['#4AE86A','T1 双重确认 (≥2独立复现)'],['#4A8AFF','T2 单源确认'],['#E8C84A','T3 初步可考'],
     ['#E8884A','T4 存疑'],['#E84A4A','T5 判定伪造']].map(([c,n])=>
      `<div class="legend-item"><span class="legend-dot" style="background:${c}"></span>${n}</div>`
    ).join('');
}

function updateStats() {
  const filtered = EVIDENCE_DB;
  const t1=filtered.filter(e=>new EvidencePoint(e).tier===1).length;
  const t2=filtered.filter(e=>new EvidencePoint(e).tier===2).length;
  const t3=filtered.filter(e=>new EvidencePoint(e).tier===3).length;
  const t4=filtered.filter(e=>new EvidencePoint(e).tier===4).length;
  const t5=filtered.filter(e=>new EvidencePoint(e).tier===5).length;
  const strongLinks = bayesian.links.filter(l=>l.probability>0.25).length;
  document.getElementById('statsBar').innerHTML =
    `<div class="stat-item">📦 物证 <span class="stat-num">${filtered.length}</span></div>
    <div class="stat-item" style="color:var(--t1);">T1 <span class="stat-num">${t1}</span></div>
    <div class="stat-item" style="color:var(--t2);">T2 <span class="stat-num">${t2}</span></div>
    <div class="stat-item" style="color:var(--t3);">T3 <span class="stat-num">${t3}</span></div>
    <div class="stat-item" style="color:var(--t4);">T4 <span class="stat-num">${t4}</span></div>
    <div class="stat-item" style="color:var(--t5);">T5 <span class="stat-num">${t5}</span></div>
    <div class="stat-item">🔗 强关联 <span class="stat-num">${strongLinks}</span></div>
    <div class="stat-item" style="color:var(--tx2);">聚类 <span class="stat-num">${bayesian.clusters.length}</span></div>`;
}

</script>
