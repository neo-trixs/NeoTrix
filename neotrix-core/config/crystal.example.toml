# 晶体核心上游池模板（复制为 crystal.toml 后填 key；crystal.toml 已忽略提交）。
port = 3000
discover_limit = 5

# 认证 token（执行契约 v1）：空 = legacy 开放 + 启动 warn；
# 置了就强制校验所有 /v1/* + /admin/* 的 `Authorization: Bearer <token>`；
# /healthz 恒开放；文件 token 为空时可用环境变量 CRYSTAL_TOKEN 兜底。
# token = ""

[[upstream]]
name = "example"
base_url = "https://api.example.com/v1"
api_key = "sk-..."
models = []
# models 为空 = 启动探活后自动取前 discover_limit 个；
# 非空 = 只链指定的，如 models = ["gpt-4o-mini"]。
