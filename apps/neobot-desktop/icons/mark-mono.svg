<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="NeoBot">
  <title>NeoBot</title>
  <!--
    NeoBot UI 档（侧栏 / 托盘 / favicon，16~24px）—— 与 icons/icon.svg
    **同物种不同表达**，不是缩小的 app 图标。

    # 为什么不能直接缩 app 图标（实测）
    icons/icon.svg 是 1024 网格的完整卡通（眼/腮红/鳃/气泡/辉光）。
    栅格化到 16px 后**读不出来** —— 只剩一个蓝色团块。
    对照组：neotrix 自家的 nt-core/nt-act 在 16px 同样是一团（16px 是凑齐档位，
    不是它真正的使用尺寸）。但 UI 侧栏/t Tray/favicon 真的会用到 16~24px，
    所以**不能照抄这个降级**，得另做一档。

    # 这一档的取舍
      · 保留「可爱」的两个最小充分条件：**大眼** + **圆胖身**。
      · 舍弃腮红/鳃裂/气泡/投影 —— 16px 下它们各占 1~2px，纯噪点。
      · 背鳍与尾鳍保留，但压成**圆角三角**；尾鳍上下叶**并成一片**，
        因为分开的两片在 16px 会读成剪刀。
      · 描边加粗到 1.8 —— 抗栅格化衰减。
      · 不用渐变：单色实心在最小档最稳。配色取 app 图标的深海蓝（#2A9CC4）。
    ⛔ 仍是**原创**，不临摹任何现有图标。
  -->
  <g>
    <!-- 尾鳍：上下叶并成一片圆角叶 -->
    <path fill="#2A9CC4" d="M17.6 12.6 C18.7 11.7 19.6 10.3 20.1 8.7 C20.3 8.1 21 8.3 20.9 8.9
                          C20.7 11.1 20.5 12.6 20.4 13.6 C20.3 14.6 20.7 15.2 21.3 15.9
                          C21.7 16.4 21.2 16.9 20.6 16.6 C19.2 15.8 18.2 14.4 17.4 13.4 Z"/>
    <!-- 背鳍：圆角三角 -->
    <path fill="#2A9CC4" d="M12.4 9.4 C12.8 8.1 13.7 7.0 14.9 6.5 C15.7 6.2 16.3 6.9 16.0 7.6
                          C15.6 8.6 15.3 9.4 15.1 10.1 Z"/>
    <!-- 身体：圆胖 -->
    <path fill="#2A9CC4" d="M2.4 12.6 C2.4 10.4 4.2 9.0 7.2 8.7 C9.4 8.5 11.2 8.6 12.6 8.9
                          C14.6 9.3 16.2 10.3 17.2 11.6 C16.2 13.4 14.3 14.5 11.8 14.8
                          C8.8 15.1 5.0 14.9 3.2 13.8 C2.7 13.5 2.4 13.1 2.4 12.6 Z"/>
    <!-- 腹：浅色分界，一刀即可，16px 不需要渐变过渡 -->
    <path fill="#BFE9F5" d="M3.4 12.8 C3.2 13.6 4.6 14.3 6.6 14.5 C9.2 14.8 12.4 14.6 14.2 13.9
                          C15.4 13.4 16.4 12.7 17.1 11.9 C16.2 13.6 14.3 14.7 11.8 15.0
                          C8.8 15.3 5.0 15.1 3.2 14.0 C2.8 13.7 3.2 13.2 3.4 12.8 Z"/>
  </g>
  <!-- 眼：大、深、带一点高光。这是 cute 的全部来源，不能省。 -->
  <ellipse cx="6.6" cy="11.7" rx="1.75" ry="1.9" fill="#FFFFFF"/>
  <circle cx="6.75" cy="11.8" r="0.95" fill="#12303C"/>
  <circle cx="6.35" cy="11.25" r="0.34" fill="#FFFFFF"/>
</svg>
