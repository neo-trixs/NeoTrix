<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="NeoBot">
  <title>NeoBot</title>
  <!--
    NeoBot 图标 —— 派生自 dsh-harness-desktop 0.19.1 的 public/favicon.svg（MIT，
    Copyright (c) 2026 deepseek-harness-desktop contributors）。

    取用与改动：
      取 —— 64 网格 / rx14 圆角底 / 纯色剪影 + 白色腹斑 / 单点眼。
              这套语言的关键在**剪影本身能读出生物**，不靠渐变与细节。
      改 —— 鲸 → 海豚。刻意保留「同构图语言」而不是重画，
            因为换动物时最容易丢的就是**可读性**：剪影一旦加上过多细节，
            缩到 16px 就糊成一团。

    为什么是海豚：
      ① 尖吻（rostrum）、镰形后掠背鳍、深叉水平尾鳍 —— 这三样是海豚区别于
         鲸的**形**，一眼可辨；而「换颜色 / 加高光」不叫换动物。
      ② 恰好是对鲸的**细小微调**，符合改动幅度最小的要求。
      ③ 海豚以声音交流 —— 对话式产品。

    ⛔ 两次踩同一个坑（第一版就是这么废掉的）：
       **鳍的根部必须压进身体**。第一版把尾鳍与背鳍都画在身体轮廓之外，
       渲染出来是**两片漂浮的碎片** —— 一眼就不像动物。
       ⇒ 现在尾鳍基部伸到 x=45（身体后端在 x≈48），背鳍基部落在 y=25
         （该处背部在 y≈22），两者都**深入体内**。
         而它们的画法是「先画鳍、再画身体盖住重叠处」—— 同色覆盖，
         读起来就是长在身上。静态检查看不出这个错，**只能看渲染图**。

    ⛔ 另一个坑：注释里若出现连续两个连字符会**提前闭合 XML 注释**，
       而字节门只查 U+FFFD、不查 XML 语法 ⇒ 要靠 qlmanage 才报得出来。
       所以这里的分节一律用 ═。
  -->
  <rect width="64" height="64" rx="14" fill="#ffffff"/>

  <g transform="translate(3.2 4) scale(0.90)">
    <!-- ① 尾鳍（先画）：基部伸进身体后端。两叶之间深叉。 -->
    <path fill="#000000" d="M44 29C50 25 55 19 58 13C54 20 52 25 51 30
      C52 34 55 38 59 43C54 40 50 37 46 36Z"/>

    <!-- ② 背鳍（先画）：镰形后掠，基部压在背上。 -->
    <path fill="#000000" d="M26 26C29 18 34 12 40 11C37 16 36 20 36 24
      C32.5 25 29 25.5 26 26Z"/>

    <!-- ③ 身体：流线型。吻端尖、额隆、后收到尾柄。 -->
    <path fill="#000000" d="M3 33C3 27 9 23 19 22C31 21 42 25 47 31
      C48.5 33 48.5 34 47 36C42 40 31 43 20 42C9 41 3 38 3 33Z"/>

    <!-- ④ 吻部（rostrum）：斜伸尖喙。⛔ 少了它就回到鲸。 -->
    <path fill="#000000" d="M4.2 30.8C2 31.2 0.4 32.4 0 33.8
      C0.6 35.2 2.4 36.1 4.6 36C6.3 33.8 6.7 31.9 6 30.3C5.4 30.4 4.8 30.6 4.2 30.8Z"/>

    <!-- ⑤ 胸鳍：短而弯，位置靠前。 -->
    <path fill="#000000" d="M16.5 40.5C13.6 43.2 12 46.2 12.4 48.4
      C15.7 47.5 18.5 45.6 20 43C18.9 42.1 17.7 41.3 16.5 40.5Z"/>

    <!-- ⑥ 腹斑：纯白贴下缘。⛔ 不做渐变 —— 上游就是纯色，加渐变会破坏风格一致性。 -->
    <path fill="#ffffff" d="M7 36.8C11.5 40.8 18.4 43 25.4 43
      C32.7 43 39.6 40.9 43.4 37.2C37.6 39.7 31.6 40.8 25.4 40.8
      C18.2 40.8 11.9 39.5 7 36.8Z"/>

    <!-- ⑦ 眼：眼位在吻根**之后**。⛔ 画在吻前面就成鱼了。 -->
    <circle cx="13.6" cy="31.4" r="2.1" fill="#ffffff"/>
    <circle cx="14" cy="31.6" r="1.05" fill="#000000"/>

    <!-- ⑧ 嘴线：海豚标志性的「微笑」弧。 -->
    <path fill="none" stroke="#ffffff" stroke-width="1.15" stroke-linecap="round"
          d="M2.4 34.4C5.2 35.7 8.4 35.8 11 34.9"/>
  </g>
</svg>
