<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/neobot/icons/mark-mono.svg" />
    <title>NeoBot</title>
    <!--
      样式加载顺序**不可颠倒**：
        tokens.css  → 定义 primitive + semantic
        shell.css   → 壳层布局，只引用 semantic
        base/primitives/sheet → 基础组件，只引用 semantic
      乱序的后果是「组件里的 var() 解析不到」，而 CSS 变量解析失败**不报错**，
      只会让该属性静默失效（颜色变透明 / 继承）。所以本仓有 check-tokens.mjs 守这条。
    -->
    <link rel="stylesheet" href="/src/ui/tokens.css" />
    <link rel="stylesheet" href="/src/ui/shell.css" />
    <link rel="stylesheet" href="/src/ui/base.css" />
    <link rel="stylesheet" href="/src/ui/primitives.css" />
<link rel="stylesheet" href="/src/ui/blocks.css" />
    <link rel="stylesheet" href="/src/ui/sheet.css" />
  </head>
  <body>
    <div class="app">
      <!-- ── 左：会话栏 ─────────────────────────────────── -->
      <aside class="side" aria-label="会话">
        <header class="side-head">
          <span class="brand">
            <img src="/mark-mono.svg" alt="" class="brand-mark" width="20" height="20" />
            <span class="brand-name">NeoBot</span>
          </span>
          <button id="btn-new-group" class="nb-icon-btn" type="button" title="新建群组" aria-label="新建群组">群</button>
        </header>
        <div class="side-search">
          <input id="search" type="search" placeholder="搜索会话与成员…" aria-label="搜索会话" />
        </div>
        <div id="side-panels" class="side-panels"></div>
        <nav class="convs" id="convs" aria-label="会话列表"></nav>
        <footer class="side-foot">
          <span id="host-badge" class="side-badge"></span>
        </footer>
      </aside>

      <!-- ── 右：对话栏 ─────────────────────────────────── -->
      <main class="thread-col">
        <div id="thread" class="thread" role="log" aria-live="polite" aria-label="对话"></div>

        <div class="composer">
          <div class="composer-row">
            <button id="btn-evidence" class="nb-btn nb-btn--ghost nb-btn--sm" type="button" title="证据汇总">证据</button>
            <button id="btn-agent-run" class="nb-btn nb-btn--ghost nb-btn--sm" type="button" title="手动跑一轮 agent">跑一轮</button>
            <span class="composer-spacer"></span>
            <span id="status" class="status" data-state="idle">空闲</span>
          </div>
          <div class="composer-input">
            <textarea id="input" rows="1" placeholder="消息…（Enter 发送，Shift+Enter 换行）" aria-label="消息"></textarea>
            <button id="btn-send" class="nb-btn nb-btn--primary" type="button">发送</button>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
