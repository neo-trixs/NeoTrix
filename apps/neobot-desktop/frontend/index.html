<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeoBot</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- 左轨：只保留对话 + 设置 -->
      <nav class="rail" id="rail">
        <div class="avatar" id="me-avatar" style="width:44px;height:44px;font-size:17px" title="我">我</div>
        <div style="height:14px"></div>
        <button class="rail-btn active" data-view="convos" data-icon="chat" title="对话"><span class="rail-badge hidden" id="badge-convos"></span></button>
        <button class="rail-btn" id="btn-workbench" data-icon="folder" title="工作台（文件 / 变动 / 任务 / 侧聊）"></button>
        <div class="spacer"></div>
        <button class="rail-btn" id="btn-settings" data-icon="gear" title="设置"></button>
      </nav>

      <div class="body" id="body">
        <!-- 对话栏：搜索 + 统一对话列表 + 队友 -->
        <aside class="convs">
          <div class="convs-search"><input id="convs-q" placeholder="搜索对话…" /><button class="icon-btn" id="btn-new" data-icon="plus" title="新对话"></button><button class="icon-btn" id="btn-group" data-icon="users" title="发起群聊"></button></div>
          <div class="convs-scroll" id="convs-scroll"></div>
        </aside>
        <div class="grip" id="grip-convs" title="拖拽调宽"></div>

        <!-- 中间对话：扁平泡 + 白胶囊作曲区 -->
        <section class="chat">
          <div class="chat-head">
            <div id="moodball" style="width:40px;height:40px" title="NeoBot"></div>
            <div class="head-center">
              <div class="t" id="head-title">新对话</div>
              <div class="s" id="head-sub">local-first · 数据只在 ~/.neobot</div>
            </div>
            <div class="grow"></div>
            <div class="head-search">
              <span id="head-searchcount" class="muted"></span>
              <span id="head-searchbox" class="hidden"><input id="head-searchinput" placeholder="搜索本会话…" /></span>
              <button class="icon-btn" id="head-search" data-icon="search" title="搜索本会话"></button>
            </div>
          </div>
          <div id="thread" class="thread"></div>
          <div id="hero" class="hero hidden"></div>
          <div class="composer">
            <div class="inputrow">
              <div id="attchips" class="attchips hidden"></div>
              <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
              <div class="actionbar">
                <div style="display:flex;gap:6px;align-items:center">
                  <button id="btn-model" class="modelbtn" title="切换模型">回显</button>
                  <button id="btn-attach" class="icon-btn" data-icon="plus" title="添加附件（图/文件/视频）"></button>
                </div>
                <div class="aright">
                  <span id="tok-est" class="tok-est hidden"></span>
                  <button id="btn-send" title="发送"></button>
                </div>
              </div>
              <div id="modelpanel" class="modelpanel hidden"></div>
            </div>
          </div>
        </section>

        <!-- 右：智能画板 -->
        <div class="grip" id="grip-info" title="拖拽调宽，双击收起/展开"></div>
        <aside class="info" id="info"></aside>

        <!-- 工作台：右列（侧边栏页签 + 文件树 / 编辑器 / 变动 / 任务 / 侧聊） -->
        <div class="grip" id="grip-sb" title="拖拽调宽"></div>
        <aside class="sb hidden" id="sb-panel"></aside>
      </div>
    </div>

    <div id="toasts"></div>
    <div id="ctxmenu" class="ctxmenu hidden"></div>

    <!-- 新建会话：个人 DM / 发起群组 -->
    <div id="newconvo" class="scrim hidden">
      <div class="confirm-box" style="width:380px">
        <div id="nc-title">发起群组</div>
        <input id="nc-name" class="hidden" maxlength="80" placeholder="群组名称" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;margin:10px 0 2px;outline:none" />
        <div id="nc-members" class="checklist"></div>
        <div class="btnrow" style="justify-content:flex-end;margin-bottom:0">
          <button class="btn" id="nc-no">取消</button>
          <button class="btn primary" id="nc-yes">创建</button>
        </div>
      </div>
    </div>

    <!-- 群组成员 -->
    <div id="convoinfo" class="scrim hidden">
      <div class="confirm-box" style="width:360px">
        <div id="ci-title"></div>
        <ul id="ci-members" class="mini-list"></ul>
        <div class="rowline"><input id="ci-add" maxlength="8" placeholder="加成员（须已登记）" /><button class="btn" id="ci-addbtn">添加</button></div>
        <div class="btnrow" style="justify-content:flex-end;margin-bottom:0">
          <button class="btn" id="ci-close">关闭</button>
        </div>
      </div>
    </div>

    <!-- 确认/输入框 -->
    <div id="confirm" class="scrim hidden">
      <div class="confirm-box">
        <div id="confirm-text"></div>
        <input id="confirm-input" class="hidden" maxlength="160" />
        <div class="btnrow" style="justify-content:flex-end;margin-bottom:0">
          <button class="btn" id="confirm-no">取消</button>
          <button class="btn danger" id="confirm-yes">确认</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
