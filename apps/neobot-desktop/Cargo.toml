[package]
name = "neobot-desktop"
version.workspace = true
edition.workspace = true
description = "NeoBot — independent local-first agent desktop app (thin Tauri shell over neotrix-neobot). No neotrix core, no Docker/Postgres/cloud."
license.workspace = true
repository.workspace = true

[[bin]]
name = "neobot-desktop"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
neotrix-neobot = { workspace = true }
