[package]
name = "neobot-desktop"
description = "NeoBot — 本地优先的 agent 沟通界面（Tauri 薄壳）"
version = "0.24.0"
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "neobot-desktop"
path = "src/main.rs"

[lib]
name = "neobot_desktop"
path = "src/lib.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macOS 透明桌宠窗（`WebviewWindowBuilder::transparent` 在 macOS 上被门控在这后面；
# 与上游同开。缺它时 pet 窗只能是不透明方块，透明是桌宠存在的前提）。
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# 壳启动必用：`opener` 开外链，`store` 读配置/状态。
# ⛔ 缺哪个都会报「not allowed by ACL」而不是「命令不存在」——
#    两者的排查方向完全不同，所以它们必须**在**而不是靠 stub。
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
# 优先级 1 的 9 个「纯接线」命令所需。
# 这四个都是**平台能力**，不是 agent 能力 —— 所以自己接比自己写便宜得多，
# 也比自己写可靠（剪贴板/通知/开机自启都有系统级细节）。
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
# ⛔ 逻辑**不在这里复制**。本 app 是薄壳，能力全部来自同仓的库。
#    d5413335 删除内嵌 app 的理由之一就是「桌面端曾是两份同源物」；
#    这次重建若复制 crates/neotrix-neobot 的代码，等于把那个问题原样造回来。
#    故只做 path 依赖，逻辑单一真源仍在库里。
neotrix-neobot = { path = "../../crates/neotrix-neobot" }
serde = { workspace = true }
serde_json = { workspace = true }
# 用量窗口下界（本地日历天；与库 `totals` 同口径，见 commands.rs 注释）。
chrono = { workspace = true }

[dev-dependencies]
# 真 store 往返测试用的临时目录。刻意不用 mock —— mock 与真数据
# 各自绿而彼此对不上，正是 MOCK_ITEMS 能长期冒充真实列表的原因。
tempdir = "0.3"

[lints.rust]
unsafe_code = "forbid"
