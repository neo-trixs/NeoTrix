[workspace]
members = [
    "neotrix-core",
    "crates/neotrix-types",
    "crates/neotrix-sysctl",
    "crates/neotrix-consciousness",
    "crates/neotrix-reasoning",
    "crates/neotrix-gateway",
    "crates/neotrix-multi-agent",
    "crates/nt-core-capability-tree",
    "crates/nt-term-viz",
    "crates/neotrix-neobot",
    "crates/neotrix-audit",
    "apps/neobot-desktop",
]

resolver = "2"

[workspace.package]
version = "0.23.0"
edition = "2021"
rust-version = "1.81"
authors = ["NeoTrix Team"]
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/neo-trixs/NeoTrix"
description = "NeoTrix - Self-evolving reasoning kernel with 18 stages of neural architecture"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "2"
# 内部 path 依赖统一版本源 (P3 供给收敛; deny wildcards 门要求显式 version)
neotrix = { version = "0.23.0", path = "neotrix-core" }
neotrix-types = { version = "0.23.0", path = "crates/neotrix-types" }
neotrix-sysctl = { version = "0.23.0", path = "crates/neotrix-sysctl" }
neotrix-consciousness = { version = "0.23.0", path = "crates/neotrix-consciousness" }
neotrix-reasoning = { version = "0.23.0", path = "crates/neotrix-reasoning" }
neotrix-gateway = { version = "0.23.0", path = "crates/neotrix-gateway" }
neotrix-multi-agent = { version = "0.23.0", path = "crates/neotrix-multi-agent" }
neotrix-neobot = { version = "0.23.0", path = "crates/neotrix-neobot" }
neotrix-audit = { version = "0.23.0", path = "crates/neotrix-audit" }
nt_core_capability_tree = { version = "0.1.0", path = "crates/nt-core-capability-tree" }

[workspace.lints.clippy]
# Restriction gates removed from workspace lints 2026-10-08 after N4 diagnosis:
# they produced 6812 denied-warning errors against Warning lib.rs deny(warnings).
# New decision path: default-off restriction lints; enable per crate/module when needed.
# rustc unsafe fences stay: #![forbid(unsafe_code)] / deny(unsafe_op_in_unsafe_fn).
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
overflow-checks = true
# 2026-10-06 治 target 体积：把 dev 的调试信息砍到「够用」而非「 fullest」。
#
# ## 实测（`-p neotrix`，每个变体都从 `cargo clean` 起，同一台机器）
#
# | 配置                                   | target |  deps  |
# |----------------------------------------|-------:|-------:|
# | `debug = "full"`（原默认）             |  9.7G  |  5.3G  |
# | `debug = "line-tables-only"`（扁平）   |  7.5G  |  3.7G  |
# | `debug = 0`（扁平）                    |  6.0G  |  2.3G  |
# | **本配置：扁平 line-tables + 依赖 0**  |**6.8G**|**3.0G**|
#
# ⇒ 相对原默认 **体积 −30%**。
#
# ## ⛔ 关于「编译耗时」：**不给结论**
#
# 同一份代码四次 clean 构建实测 2m55s / 3m17s / 4m31s / 5m14s，
# **不随 debug 递减**（最省的 DWARF 配置反而最慢）⇒ 本机（共享树、
# 多窗口并发）耗时由噪声主导。**体积是确定性的（文件大小），耗时不是。**
# 曾在此处写过「−45% 时间」，那是把噪声当信号，已撤回。
# 要下耗时结论必须同一配置重复多次取分布。
#
# ## 为什么是「依赖 0、我们保留行号」而不是扁平 `debug = 0`
#
# 实测 `RUST_BACKTRACE=1`（故意 panic 的探针）：
# - 扁平 `debug = 0` ⇒ 帧只有函数名，**无 file:line**
# - 本配置 ⇒ `probe_frames at ./tests/…/tmp_bt.rs:4:14` ✓
#
# 代价：panic 若发生在**源码依赖内部**（serde 等），那一帧没有行号。
# 接受它：本仓排障靠「读那一行本身」（AGENTS.md R-SCAN-1b），panic 绝大多数
# 来自自己的代码；多花 0.8G 换回workspace 代码的行号是划算的。
# ⚠️ 预编译的 std/core（工具链 sysroot）**不受** `package."*"` 影响 ⇒ 它们的
#   行号始终在（实测 `library/core/src/slice/index.rs:272:10` 仍可读）。
debug = "line-tables-only"

# 第三方依赖的调试信息是纯成本：我们几乎不在依赖内部排障，而依赖占了
# artifact 体积的大头⇒ 一律 DWARF 全丢。
[profile.dev.package."*"]
debug = 0

[profile.bench]
inherits = "release"
debug = true
