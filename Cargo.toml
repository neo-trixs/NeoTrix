[workspace]
members = [
    "neotrix-core",
    "crates/neotrix-types",
    "crates/neotrix-sysctl",
    "crates/neotrix-consciousness",
    "crates/neotrix-reasoning",
    "crates/neotrix-gateway",
    "crates/neotrix-multi-agent",
    "crates/nt-core-capability-tree",
    "crates/nt-term-viz",
    "crates/neotrix-neobot",
    "crates/neotrix-audit",
    "apps/neobot-desktop",
]

resolver = "2"

[workspace.package]
version = "0.23.0"
edition = "2021"
rust-version = "1.81"
authors = ["NeoTrix Team"]
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/neo-trixs/NeoTrix"
description = "NeoTrix - Self-evolving reasoning kernel with 18 stages of neural architecture"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "2"
# 内部 path 依赖统一版本源 (P3 供给收敛; deny wildcards 门要求显式 version)
neotrix = { version = "0.23.0", path = "neotrix-core" }
neotrix-types = { version = "0.23.0", path = "crates/neotrix-types" }
neotrix-sysctl = { version = "0.23.0", path = "crates/neotrix-sysctl" }
neotrix-consciousness = { version = "0.23.0", path = "crates/neotrix-consciousness" }
neotrix-reasoning = { version = "0.23.0", path = "crates/neotrix-reasoning" }
neotrix-gateway = { version = "0.23.0", path = "crates/neotrix-gateway" }
neotrix-multi-agent = { version = "0.23.0", path = "crates/neotrix-multi-agent" }
neotrix-neobot = { version = "0.23.0", path = "crates/neotrix-neobot" }
neotrix-audit = { version = "0.23.0", path = "crates/neotrix-audit" }
nt_core_capability_tree = { version = "0.1.0", path = "crates/nt-core-capability-tree" }

[workspace.lints.clippy]
# Restriction lints — bug prevention (R-P2xx)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
string_slice = "warn"
indexing_slicing = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
overflow-checks = true
# 2026-10-06 治target 体积（实测数据见 commit 正文）：
# dev 的 debug 取默认 full ⇒ 每个 rlib/rmeta/test 二进制内嵌全量 DWARF。
# 改 line-tables-only：保留 file:line（panic 回溯仍可读），只丢掉看变量值
# 所需的完整 DWARF。本仓无依赖调试器的流程 ⇒ 这部分调试信息是纯成本。
debug = "line-tables-only"
#   实测（`-p neotrix`，均从 cargo clean 起，同一台机器）：
#   | debug      | target |  deps  | 耗时  |
#   | full(默认) |  9.7G  |  5.3G  | 5m14s |
#   | line-tables|  7.5G  |  3.7G  | 2m55s |
#   | 0          |  6.0G  |  2.3G  | 3m17s |
#   ⇒ 取 line-tables：比 full 省 23% 体积 / 45% 时间，且**每个栈帧仍带
#     file:line**（实测 RUST_BACKTRACE=1 对比：debug=0 只有函数名）。
#   ⇒ 不取 0：省下的 1.5G 不值「栈帧没有行号」—— 本仓排障靠回溯。
#   ⚠️ 改 profile 会让**全部**指纹失效，但**旧产物不会被自动删** ⇒
#   实测改完直接构建，target 反而涨到 16G（1259 个 rlib，同 crate 两版并存）。
#   ⇒ 改 profile 后要么 `cargo clean`，要么用 `cargo-sweep` 按天龄回收陈旧件。

[profile.bench]
inherits = "release"
debug = true
