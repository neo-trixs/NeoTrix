[workspace]
members = [
    "neotrix-core",
    "src-tauri",
    "crates/neotrix-types",
    "crates/neotrix-sysctl",
    "guard_core",
    "neotrix-core/src/neotrix/nt_core_capability_tree",
]

resolver = "2"

[workspace.package]
version = "0.18.0"
edition = "2021"
rust-version = "1.81"
authors = ["NeoTrix Team"]
license = "MIT"
repository = "https://github.com/neotrix/neotrix"
description = "NeoTrix - Self-evolving reasoning kernel with 18 stages of neural architecture"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
uuid = { version = "1", features = ["v4", "serde"] }

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true
