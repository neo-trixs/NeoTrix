[workspace]
members = [
    "neotrix-core",
    "src-tauri",
    "crates/neotrix-types",
    "crates/neotrix-sysctl",
    "crates/neotrix-consciousness",
    "crates/neotrix-reasoning",
    "crates/neotrix-gateway",
    "crates/neotrix-multi-agent",
    "neotrix-core/src/neotrix/nt_core_capability_tree",
    "crates/nt-lang",
    "crates/neotrix-game",
    "crates/neotrix-neobot",
    # "crates/neotrix-decision-engine",  # disabled: pre-existing compilation errors
]

resolver = "2"

[workspace.package]
version = "0.21.0"
edition = "2021"
rust-version = "1.81"
authors = ["NeoTrix Team"]
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/neo-trixs/NeoTrix"
description = "NeoTrix - Self-evolving reasoning kernel with 18 stages of neural architecture"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0.0"
uuid = { version = "1", features = ["v4", "serde"] }
ureq = "2"

[workspace.lints.clippy]
# Restriction lints — bug prevention (R-P2xx)
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
string_slice = "warn"
indexing_slicing = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
large_futures = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
undocumented_unsafe_blocks = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
overflow-checks = true

[profile.bench]
inherits = "release"
debug = true
