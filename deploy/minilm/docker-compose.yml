version: '3.8'

services:
  minilm:
    image: ghcr.io/huggingface/text-embeddings-inference:1.5
    container_name: neotrix-minilm
    ports:
      - "8237:80"
    environment:
      - MODEL_ID=sentence-transformers/all-MiniLM-L6-v2
      - MAX_BATCH_SIZE=32
      - MAX_CONCURRENT_REQUESTS=128
      - POOLING=mean
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # 可选：GPU 加速版本 (如果有 NVIDIA GPU)
