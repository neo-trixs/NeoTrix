[package]
name = "neotrix-gateway"
version.workspace = true
edition = "2021"
description = "NeoTrix L5 Gateway — model routing, skill registry, search, BYOA, capability system, gate control"
license.workspace = true
repository.workspace = true

[dependencies]
neotrix-types = { path = "../neotrix-types" }
neotrix-sysctl = { path = "../neotrix-sysctl" }
neotrix-consciousness = { path = "../neotrix-consciousness" }
neotrix-decision-engine = { path = "../neotrix-decision-engine", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = "1"
tracing = "0.1"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
anyhow = { version = "1", optional = true }
async-trait = "0.1"

[features]
default = []
full = ["anyhow", "decision-engine"]
decision-engine = ["dep:neotrix-decision-engine"]
