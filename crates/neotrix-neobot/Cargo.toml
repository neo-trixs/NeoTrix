[package]
name = "neotrix-neobot"
version.workspace = true
edition = "2021"
description = "NeoBot — local-first personal agent app core (absorbed OpenMuse/openbot/cumora). SQLite + fail-closed gateway + EngineAdapter, no Docker/Postgres/cloud required."
license.workspace = true
repository.workspace = true

[[bin]]
name = "neobot"
path = "src/bin/neobot.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
# Qwen-MM-Plugins 会话客户端解码 MCP image 块用（与 neotrix-core 同版本，
# Cargo.lock 已有 base64 0.21.7，只加图边不加新包）。
base64 = "0.21"
# 效果键 sha256（`nt_effect_key`；lock 已有 sha2 0.10.9，只加图边不加新包）。
sha2 = "0.10"
# PDF 原生坐标 grounding（`nt_pdf_ground` 读 content 流取文字位置 homage：
# 与 neotrix-core 同为 lopdf 0.42，lock 已有，只加图边）。
lopdf = "0.42"
tokio = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
thiserror = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
zip = { version = "1", default-features = false, features = ["deflate"] }
# nt_llama 的进程生命周期日志。`log` 是零后端 facade (~10KB, 仅 cfg-if),
# 不引任何日志实现 —— 后端由最终二进制决定。与 neotrix-core 同一套口径。
log = "0.4"

[lints]
workspace = true
