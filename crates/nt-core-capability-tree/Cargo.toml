[package]
name = "nt_core_capability_tree"
version = "0.1.0"
edition = "2021"
description = "NeoTrix capability tree registry, evolution engine, and CLI"
license = "MIT"
repository = "https://github.com/neo-trixs/NeoTrix"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
indexmap = { version = "2.0", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
# 终端渲染原语（宽度感知对齐 / 树连线）—— 取代内联硬编码框线字符
nt-term-viz = { path = "../nt-term-viz" }
uuid = { version = "1.8", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
daggy = "0.9"
petgraph = "0.6"

# 继承 workspace 的 18 条限制 lint (unwrap_used / indexing_slicing / panic ...)。
# 缺这一节 = 这 4,670 LOC 完全不受 clippy 门禁约束 (audit 2026-09-27)。
[lints]
workspace = true

[[bin]]
name = "neotrix-capability"
path = "src/main.rs"

[dev-dependencies]
# 仅测试用：派发端口是 async，测试需要一个 executor。
# ⚠️ **仅 dev-dependency** —— 共享 crate 的运行时依赖保持为零，
#    端口本身只用 `std::future`（见 dispatch::BoxFuture）。
# 曾试图在测试里手写 `block_on`，但那需要 `RawWaker`（unsafe）
# ⇒ 被本 crate 的 `#![forbid(unsafe_code)]` 正确拦下⇒ 改用 tokio。
tokio = { version = "1", features = ["rt", "macros"] }
