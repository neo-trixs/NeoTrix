<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PetBar 森林山水场景预览</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #FAF8F4;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  font-family: system-ui, -apple-system, sans-serif;
  flex-direction: column;
  gap: 16px;
}
h2 { color: #8A7A6A; font-weight: 400; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
.subtitle { color: #B0A490; font-size: 12px; margin-top: -12px; }
.preview-wrap {
  width: 780px;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 8px 32px rgba(0,0,0,0.1);
  background: #fff;
}
.chat-mock {
  height: 200px;
  background: linear-gradient(180deg, rgba(250,248,244,0.95) 0%, rgba(245,242,236,0.98) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  color: #B0A490;
  font-size: 13px;
  border-bottom: 1px solid rgba(0,0,0,0.04);
  position: relative;
  flex-direction: column;
  gap: 8px;
}
.chat-mock span {
  background: rgba(0,0,0,0.03);
  padding: 8px 20px;
  border-radius: 20px;
}
.chat-mock .messages-indicator {
  font-size: 11px;
  color: #C4944A;
  opacity: 0.6;
}
.petbar-container {
  width: 100%;
  height: 130px;
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: height 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
}
.petbar-container.collapsed { height: 48px; }
canvas { display: block; width: 100%; height: 100%; transform-origin: top center; transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1); }
.petbar-container.collapsed canvas { transform: scaleY(0.37); }
.status-mock {
  height: 28px;
  background: rgba(0,0,0,0.03);
  display: flex;
  align-items: center;
  padding: 0 12px;
  gap: 8px;
  font-size: 11px;
  color: #86868b;
}
.status-mock .dot { width: 6px; height: 6px; border-radius: 50%; background: #34c759; }
.controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  justify-content: center;
}
.controls button {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.1);
  background: #fff;
  font-size: 12px;
  color: #5a4a3a;
  cursor: pointer;
  transition: all 0.15s;
}
.controls button:hover { background: #F5F2EC; border-color: rgba(0,0,0,0.15); }
.controls button.active { background: #C4944A; color: #fff; border-color: #C4944A; }
.controls label { font-size: 12px; color: #8A7A6A; display: flex; align-items: center; gap: 6px; cursor: pointer; }
.legend {
  display: flex;
  gap: 16px;
  font-size: 11px;
  color: #8A7A6A;
  flex-wrap: wrap;
  justify-content: center;
}
.legend span { display: flex; align-items: center; gap: 4px; }
.legend kbd {
  background: rgba(0,0,0,0.06);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 10px;
  color: #5a4a3a;
}
</style>
</head>
<body>

<h2>✦ PetBar 森林山水场景 ✦</h2>
<p class="subtitle">点日月切换昼夜 · 点宠物跳跃 · 点树惊鸟 · 点水涟漪 · 点地星尘</p>

<div class="preview-wrap">
  <div class="chat-mock">
    <span>对话区域 (ChatPanel)</span>
    <div class="messages-indicator">有消息时 PetBar 自动折叠为底部薄条</div>
  </div>
  <div class="petbar-container" id="petbar-root">
    <canvas id="petbar-canvas"></canvas>
  </div>
  <div class="status-mock">
    <span class="dot"></span>
    <span>Ready</span>
    <span style="margin-left:auto">0/13 experts · 会话 1/1</span>
  </div>
</div>

<div class="controls">
  <button id="btn-excite">🎾 逗宠物</button>
  <button id="btn-toggle">☀️ 切换昼夜</button>
  <button id="btn-bird">🐦 惊鸟</button>
  <label><input type="checkbox" id="chk-busy"> Agent 忙碌</label>
  <label><input type="checkbox" id="chk-collapse"> 折叠模式</label>
</div>

<div class="legend">
  <span>🦊 <kbd>点击宠物</kbd> 跳跃 + 星光</span>
  <span>☀️🌙 <kbd>点击日月</kbd> 切换昼夜</span>
  <span>🌲 <kbd>点击树丛</kbd> 飞鸟惊起</span>
  <span>🌊 <kbd>点击河流</kbd> 涟漪扩散</span>
  <span>🪨 <kbd>点击地面</kbd> 星尘飞扬</span>
</div>

<script>
const H = 130;
const H_COLLAPSED = 48;
const GROUND_Y = 95;
const PET_W = 18;

let isDark = false;
let agentBusy = false;
let collapsed = false;
let mouseX = null;

const pet = {
  x: 60, y: GROUND_Y - 2, targetX: 200,
  action: "idle", step: 0, timer: 0,
  earAngle: 0, tailPhase: 0, lookX: 0,
  jumpY: 0, jumpVy: 0, blink: 0, dir: 1,
};
let particles = [];

function rand(min, max) { return min + Math.random() * (max - min); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function mountainY(x, W, seed) {
  const s = (x / W) * 6.2832;
  return Math.sin(s*0.7+seed)*14 + Math.sin(s*1.5+seed*2)*8 + Math.sin(s*3.1+seed*3)*4 + Math.sin(s*6.7+seed*4)*2 + 10;
}

function drawMountains(ctx, W, baseY, height, seed, color, alpha, snowLine) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.beginPath(); ctx.moveTo(0, baseY + height);
  const pts = [];
  for (let x = 0; x <= W; x += 3) {
    const y = baseY + height - mountainY(x, W, seed) * (height / 40);
    ctx.lineTo(x, y); pts.push({x,y});
  }
  ctx.lineTo(W, baseY + height); ctx.closePath(); ctx.fillStyle = color; ctx.fill();
  if (snowLine !== undefined) {
    ctx.beginPath(); let started = false;
    for (const p of pts) { if (p.y < baseY + snowLine) { if (!started) { ctx.moveTo(p.x, p.y); started = true; } else ctx.lineTo(p.x, p.y); } else { started = false; } }
    ctx.strokeStyle = "rgba(255,255,255,0.3)"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  ctx.restore();
}

function drawTree(ctx, x, baseY, h, w, color, shadow) {
  if (shadow) { ctx.save(); ctx.globalAlpha = 0.08; ctx.beginPath(); ctx.ellipse(x+2, baseY+h*0.2, w*0.3, h*0.15, 0, 0, Math.PI*2); ctx.fillStyle="#000"; ctx.fill(); ctx.restore(); }
  const layers = 3;
  for (let i = 0; i < layers; i++) {
    const ly = baseY + (h*i)/layers, lw = w * (1 - i*0.25);
    ctx.beginPath(); ctx.moveTo(x, ly); ctx.lineTo(x - lw/2, ly + h/layers*0.8); ctx.lineTo(x - lw*0.2, ly + h/layers*0.8);
    ctx.lineTo(x - lw*0.3, ly + h/layers); ctx.lineTo(x + lw*0.3, ly + h/layers); ctx.lineTo(x + lw*0.2, ly + h/layers*0.8);
    ctx.lineTo(x + lw/2, ly + h/layers*0.8); ctx.closePath();
    ctx.fillStyle = color; ctx.globalAlpha = 1 - i*0.12; ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawDeciduous(ctx, x, baseY, h, w, color) {
  ctx.beginPath(); ctx.ellipse(x, baseY+h*0.4, w*0.5, h*0.5, 0, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.ellipse(x - w*0.2, baseY+h*0.3, w*0.35, h*0.35, 0, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + w*0.2, baseY+h*0.35, w*0.3, h*0.3, 0, 0, Math.PI*2); ctx.fillStyle = color; ctx.fill();
}

function drawScene(ctx, W, time) {
  const t = time * 0.001;
  const skyGrad = ctx.createLinearGradient(0, 0, 0, GROUND_Y+10);
  if (isDark) { skyGrad.addColorStop(0, "#0d0d1a"); skyGrad.addColorStop(0.3, "#1a1a30"); skyGrad.addColorStop(0.6, "#2a2740"); skyGrad.addColorStop(1, "#3a3550"); }
  else { skyGrad.addColorStop(0, "#f7e8d0"); skyGrad.addColorStop(0.3, "#f0dcc0"); skyGrad.addColorStop(0.6, "#e4cdad"); skyGrad.addColorStop(1, "#d4bfa0"); }
  ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, W, GROUND_Y+10);

  if (isDark) {
    for (let i = 0; i < 40; i++) {
      const sx = (i*131.7+23)%W, sy = (i*89.3+11)%(GROUND_Y*0.55);
      const tw = 0.4 + Math.sin(t*1.8+i*3.1)*0.3+0.3;
      ctx.globalAlpha = tw*0.7; ctx.fillStyle = i%7===0?"#ffe8b0":"#fff";
      ctx.beginPath(); ctx.arc(sx, sy, 0.4+(i%3)*0.2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  const cx2 = W*0.8, cy2 = isDark ? 16 : 20;
  if (isDark) {
    const g = ctx.createRadialGradient(cx2, cy2, 1, cx2, cy2, 28);
    g.addColorStop(0, "rgba(230,220,200,1)"); g.addColorStop(0.2, "rgba(230,220,200,0.4)"); g.addColorStop(1,"rgba(230,220,200,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx2, cy2, 28, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#e6dcc8"; ctx.beginPath(); ctx.arc(cx2, cy2, 5.5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(200,190,170,0.3)"; ctx.beginPath(); ctx.arc(cx2-1.5, cy2-1, 1, 0, Math.PI*2); ctx.fill();
  } else {
    const g = ctx.createRadialGradient(cx2, cy2, 1, cx2, cy2, 30);
    g.addColorStop(0, "rgba(255,210,120,0.7)"); g.addColorStop(0.5, "rgba(255,200,100,0.2)"); g.addColorStop(1, "rgba(255,200,100,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx2, cy2, 30, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "#FFD59A"; ctx.beginPath(); ctx.arc(cx2, cy2, 7, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,220,160,0.4)"; ctx.beginPath(); ctx.arc(cx2-2, cy2-1.5, 1.5, 0, Math.PI*2); ctx.fill();
  }

  // Mist
  ctx.save(); ctx.globalAlpha = isDark?0.08:0.1;
  for (let i=0;i<3;i++) {
    const my = 30+i*12+Math.sin(t*0.2+i*1.7)*3;
    ctx.fillStyle = isDark?"#4a4560":"#e8ddd0";
    ctx.beginPath(); ctx.ellipse(W*0.3+Math.sin(t*0.1+i)*40, my, W*0.5, 4+i*2, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(W*0.7+Math.cos(t*0.08+i*2)*30, my+2, W*0.4, 3+i*1.5, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Clouds
  ctx.save(); ctx.globalAlpha = isDark?0.12:0.25;
  for (let i=0;i<4;i++) {
    const cx3 = ((i*180+80+t*(8+i*4))%(W+120))-60, cy3 = 12+i*5+Math.sin(i*2.1)*3, cw = 35+i*12;
    ctx.fillStyle = isDark?"#555":"#fff";
    ctx.beginPath(); ctx.ellipse(cx3, cy3, cw*0.5, 4, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx3-cw*0.2, cy3+1, cw*0.3, 3, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx3+cw*0.25, cy3+1.5, cw*0.35, 3.5, 0, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();

  // Mountains with snow caps
  drawMountains(ctx, W, 18, 38, 1.3, isDark?"#3a3548":"#c8bca8", 0.6, isDark?22:24);
  drawMountains(ctx, W, 28, 33, 2.7, isDark?"#2e2a3a":"#b4a894", 0.75, isDark?28:30);
  drawMountains(ctx, W, 38, 28, 4.1, isDark?"#221f2c":"#a09484", 0.85);

  // Ridge lines
  ctx.save(); ctx.globalAlpha = isDark?0.12:0.1;
  for (let r=0;r<2;r++) {
    ctx.strokeStyle = isDark?"#4a4560":"#b8a898"; ctx.lineWidth = 0.5; ctx.beginPath(); const by = 38+r*10;
    for (let x=0;x<=W;x+=6) { const y = by + mountainY(x,W,3.3+r*0.7)*0.5+5; x===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.stroke();
  }
  ctx.restore();

  // Deciduous trees
  ctx.save();
  for (let i=0;i<20;i++) { const tx=(i*73+19)%W, th=14+(i*11)%10, tw=8+(i*7)%6; const c=isDark?`hsl(${130+(i%20)},${25+(i%15)}%,${16+(i%10)}%)`:`hsl(${115+(i%15)},${35+(i%10)}%,${38+(i%12)}%)`; ctx.globalAlpha=isDark?0.65:0.55; drawDeciduous(ctx, tx, 60-th*0.25, th, tw, c); }
  ctx.restore();
  // Pine trees
  ctx.save();
  for (let i=0;i<18;i++) { const tx=(i*97+37)%W, th=11+(i*13)%12, tw=5+(i*5)%5; const c=isDark?`hsl(${140+(i%15)},${18+(i%12)}%,${13+(i%8)}%)`:`hsl(${120+(i%20)},${40+(i%15)}%,${32+(i%15)}%)`; ctx.globalAlpha=isDark?0.7:0.65; drawTree(ctx, tx, 64-th*0.2, th, tw, c, true); }
  ctx.restore();

  // River
  const riverYs=[72,74,76,78,80], riverColors=isDark?["#1e3048","#223858","#264068","#223858","#1e3048"]:["#7aa8c8","#8ab8d0","#94c4d8","#8ab8d0","#7aa8c8"];
  for (let i=0;i<riverYs.length;i++) { ctx.save(); ctx.globalAlpha=0.35+i*0.08; ctx.fillStyle=riverColors[i]; ctx.beginPath(); ctx.moveTo(0,riverYs[i]); for(let x=0;x<=W;x+=4) ctx.lineTo(x,riverYs[i]+Math.sin(x*0.02+t*0.5+i*1.3)*2); ctx.lineTo(W,riverYs[i]+2); ctx.lineTo(0,riverYs[i]+2); ctx.closePath(); ctx.fill(); ctx.restore(); }

  // Shimmer
  ctx.save(); ctx.globalAlpha=0.25;
  for (let i=0;i<10;i++) { const sx=((t*25+i*70+Math.sin(i*2.3)*20)%(W+50))-25, sy=74+Math.sin(i*1.7+t*0.4)*3; ctx.fillStyle=isDark?`rgba(200,220,255,${0.15+Math.sin(t+i)*0.1})`:`rgba(255,255,255,${0.3+Math.sin(t+i)*0.15})`; ctx.beginPath(); ctx.ellipse(sx, sy, 2+Math.sin(t*0.5+i)*1, 0.8, 0.3, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();

  // Reflection
  ctx.save(); ctx.globalAlpha=isDark?0.12:0.15;
  for (let i=0;i<5;i++) { const ry=76+i*3; ctx.fillStyle=isDark?"#e6dcc8":"#FFD59A"; ctx.globalAlpha=(isDark?0.12:0.15)-i*0.02; ctx.beginPath(); ctx.ellipse(W*0.8, ry+Math.sin(t+i*2)*1.5, 11-i*2, 1.2, 0, 0, Math.PI*2); ctx.fill(); }
  ctx.restore();

  // Ground
  const gg=ctx.createLinearGradient(0,GROUND_Y,0,H);
  if(isDark){gg.addColorStop(0,"#2a3520");gg.addColorStop(0.4,"#1e2818");gg.addColorStop(1,"#141c10");}else{gg.addColorStop(0,"#b0c098");gg.addColorStop(0.4,"#98a880");gg.addColorStop(1,"#809468");}
  ctx.fillStyle=gg; ctx.fillRect(0,GROUND_Y,W,H-GROUND_Y);

  // Grass
  for(let i=0;i<30;i++){const gx=(i*43+7)%W,gy=GROUND_Y+3+(i*13)%16,gh=2+(i*11)%5;ctx.save();ctx.globalAlpha=0.3+(i%5)*0.12;ctx.strokeStyle=isDark?"#3a5530":"#6a8a50";ctx.lineWidth=0.8;ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx-0.8,gy-gh);ctx.moveTo(gx,gy);ctx.lineTo(gx+1,gy-gh*0.7);ctx.moveTo(gx,gy);ctx.lineTo(gx+0.5,gy-gh*1.1);ctx.stroke();ctx.restore();}

  // Flowers
  for(let i=0;i<8;i++){const fx=(i*97+29)%W,fy=GROUND_Y+8+(i*17)%20;const fc=isDark?["#e08090","#90b0e0","#e0c080"][i%3]:["#e8a0b0","#b0d0f0","#f0d8a0"][i%3];ctx.save();ctx.globalAlpha=0.6;for(let p=0;p<5;p++){const a=(p/5)*Math.PI*2;ctx.beginPath();ctx.arc(fx+Math.cos(a)*1.2,fy+Math.sin(a)*1.2,0.7,0,Math.PI*2);ctx.fillStyle=fc;ctx.fill();}ctx.fillStyle=isDark?"#e0d888":"#f0e888";ctx.beginPath();ctx.arc(fx,fy,0.5,0,Math.PI*2);ctx.fill();ctx.restore();}

  // Rocks
  for(let i=0;i<6;i++){const rx=(i*89+37)%W,ry=GROUND_Y+9+(i*13)%14,rs=2.5+(i*5)%4;ctx.beginPath();ctx.ellipse(rx,ry,rs,rs*0.55,0,0,Math.PI*2);ctx.fillStyle=isDark?"#444040":"#8a8070";ctx.fill();ctx.fillStyle=isDark?"#555050":"#9a9080";ctx.beginPath();ctx.ellipse(rx-rs*0.2,ry-rs*0.1,rs*0.4,rs*0.25,-0.3,0,Math.PI*2);ctx.fill();}

  // Edge darkening
  const eg=ctx.createLinearGradient(0,H-18,0,H); eg.addColorStop(0,"transparent"); eg.addColorStop(1,isDark?"rgba(0,0,0,0.35)":"rgba(0,0,0,0.08)"); ctx.fillStyle=eg; ctx.fillRect(0,H-18,W,18);

  // Particles
  for (const p of particles) {
    const lr = p.life/p.maxLife; ctx.save(); ctx.globalAlpha = lr;
    switch (p.type) {
      case "leaf":
        ctx.fillStyle = isDark?`hsl(40,30%,${25+p.life*0.1}%)`:`hsl(35,50%,${45+p.life*0.1}%)`;
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.x); ctx.beginPath(); ctx.ellipse(0,0,p.size,p.size*0.5,0,0,Math.PI*2); ctx.fill(); ctx.restore();
        break;
      case "firefly":
        const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3); g.addColorStop(0,`rgba(255,255,200,${0.6*lr})`); g.addColorStop(1,"rgba(255,255,200,0)");
        ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x, p.y, p.size*3, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle="#ffffd0"; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        break;
      case "ripple":
        ctx.strokeStyle=isDark?"rgba(200,220,255,0.3)":"rgba(255,255,255,0.4)"; ctx.lineWidth=0.6; ctx.globalAlpha=(1-lr)*0.4;
        ctx.beginPath(); ctx.ellipse(p.x,p.y,p.size*(1+(1-lr)*2),p.size*0.3*(1+(1-lr)*2),0,0,Math.PI*2); ctx.stroke();
        break;
      case "bird":
        ctx.strokeStyle=isDark?"#555":"#666"; ctx.lineWidth=1.2; ctx.globalAlpha=lr*0.7;
        const w=Math.sin(t*6+p.x)*2;
        ctx.beginPath(); ctx.moveTo(p.x-3,p.y); ctx.quadraticCurveTo(p.x-1,p.y-2-w,p.x,p.y); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(p.x+3,p.y); ctx.quadraticCurveTo(p.x+1,p.y-2+w,p.x,p.y); ctx.stroke();
        break;
      case "sparkle":
        const sg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size); sg.addColorStop(0,`rgba(255,255,200,${lr})`); sg.addColorStop(1,"rgba(255,255,200,0)");
        ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
        break;
    }
    ctx.restore();
  }
}

function drawPet(ctx, time, mx) {
  const t=time*0.001, px=pet.x, py=pet.y+pet.jumpY;
  ctx.save(); ctx.translate(px,py);
  const bodyW=12,bodyH=9,headR=7,earH=5,earW=4,legH=4;
  const bc=isDark?"#D4A84E":"#C4944A", bl="#E8D5A3", dc="#8A6A2E", b2=isDark?"#e0c060":"#d4a858";

  ctx.save(); const tw=Math.sin(t*(pet.action==="excited"?8:3)+pet.tailPhase);
  ctx.translate(-bodyW*0.4,-bodyH*0.2+Math.sin(t*2)*0.5); ctx.rotate(0.4+tw*0.3);
  ctx.beginPath(); ctx.ellipse(0,-legH-2,2.5,4.5,0.2,0,Math.PI*2); ctx.fillStyle=bc; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-legH-4,1.8,2.5,0,0,Math.PI*2); ctx.fillStyle=b2; ctx.fill();
  ctx.beginPath(); ctx.ellipse(0,-legH-5.5,1,1.2,0,0,Math.PI*2); ctx.fillStyle=bl; ctx.fill();
  ctx.restore();

  const wc=pet.action==="walk"||pet.action==="excited", sitting=pet.action==="sleep"||pet.action==="scratch";
  const lp=wc?Math.sin(t*8):0, lp2=wc?Math.sin(t*8+Math.PI):0.3;
  if(sitting){for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*3,legH*0.5,2.5,1.5,0,0,Math.PI*2);ctx.fillStyle=bc;ctx.fill();}}
  else {
    for(const s of[-1,1]){const lh=legH+(wc?Math.max(0,s>0?lp:lp2):0)*1.5;ctx.beginPath();ctx.moveTo(s*3.5,0);ctx.lineTo(s*3.5,lh);ctx.strokeStyle=dc;ctx.lineWidth=1.8;ctx.lineCap="round";ctx.stroke();ctx.beginPath();ctx.arc(s*3.5,lh,1.2,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill();}
    for(const s of[-1,1]){const lh=legH+(wc?Math.max(0,s>0?lp2:lp):0.5)*1.5;ctx.beginPath();ctx.moveTo(s*1.2,0);ctx.lineTo(s*1.2,lh);ctx.strokeStyle=dc;ctx.lineWidth=1.8;ctx.lineCap="round";ctx.stroke();ctx.beginPath();ctx.arc(s*1.2,lh,1.2,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill();}
  }

  ctx.beginPath();ctx.ellipse(0,-bodyH*0.3,bodyW*0.5,bodyH*0.5,0,0,Math.PI*2);ctx.fillStyle=bc;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-bodyH*0.1,bodyW*0.3,bodyH*0.3,0,0,Math.PI*2);ctx.fillStyle=bl;ctx.fill();
  ctx.save();ctx.translate(0,sitting?-bodyH*0.3:-bodyH*0.5-headR*0.5);

  const ea=pet.earAngle+(pet.action==="excited"?0.3:(pet.action==="sleep"?-0.15:0));
  for(const s of[-1,1]){ctx.save();ctx.translate(s*earW*0.6,-headR*0.3);ctx.rotate(s*ea);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-earW*0.5,-earH);ctx.lineTo(earW*0.5,-earH);ctx.closePath();ctx.fillStyle=bc;ctx.fill();ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(-earW*0.3,-earH+2);ctx.lineTo(earW*0.3,-earH+2);ctx.closePath();ctx.fillStyle=bl;ctx.fill();ctx.restore();}

  if(pet.action==="sleep"){
    ctx.beginPath();ctx.ellipse(0,0,headR,headR*0.9,0,0,Math.PI*2);ctx.fillStyle=bc;ctx.fill();
    ctx.beginPath();ctx.ellipse(0,headR*0.2,headR*0.6,headR*0.4,0,0,Math.PI*2);ctx.fillStyle=bl;ctx.fill();
    for(const s of[-1,1]){const ex=s*headR*0.5;ctx.beginPath();ctx.arc(ex,-headR*0.15,1.8,0,Math.PI);ctx.strokeStyle=dc;ctx.lineWidth=0.8;ctx.stroke();}
    ctx.beginPath();ctx.arc(0,headR*0.25,1,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill();
    ctx.save();ctx.fillStyle=isDark?"rgba(200,200,255,0.4)":"rgba(100,100,180,0.3)";ctx.font="5px sans-serif";
    for(let i=0;i<3;i++){ctx.globalAlpha=0.3-i*0.08;ctx.fillText("z",6+i*4+Math.sin(t+i)*1,-headR-5-i*5);}
    ctx.restore();
  } else if(pet.action==="scratch"){
    ctx.save();ctx.rotate(0.08);ctx.beginPath();ctx.ellipse(0,0,headR,headR*0.9,0,0,Math.PI*2);ctx.fillStyle=bc;ctx.fill();ctx.beginPath();ctx.ellipse(0,headR*0.2,headR*0.6,headR*0.4,0,0,Math.PI*2);ctx.fillStyle=bl;ctx.fill();ctx.restore();
    for(const s of[-1,1]){const ex=s*headR*0.5,sq=s>0?0.3:1;ctx.beginPath();ctx.ellipse(ex,-headR*0.15,2.8,2.5*sq,0,0,Math.PI*2);ctx.fillStyle="#f0f0f0";ctx.fill();ctx.strokeStyle=dc;ctx.lineWidth=0.4;ctx.stroke();ctx.beginPath();ctx.arc(ex,-headR*0.15+0.2,1.4,0,Math.PI*2);ctx.fillStyle=isDark?"#1a1a2e":"#2a2a3e";ctx.fill();ctx.beginPath();ctx.arc(ex+0.6,-headR*0.15-0.4,0.6,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.7)";ctx.fill();}
    ctx.beginPath();ctx.arc(0,headR*0.25,1.2,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill();
  } else {
    ctx.beginPath();ctx.ellipse(0,0,headR,headR*0.9,0,0,Math.PI*2);ctx.fillStyle=bc;ctx.fill();
    ctx.beginPath();ctx.ellipse(0,headR*0.2,headR*0.6,headR*0.4,0,0,Math.PI*2);ctx.fillStyle=bl;ctx.fill();
    const lt=mx!==null?clamp((mx-px)*0.02,-1.5,1.5):pet.lookX*0.01, bk=pet.blink>0;
    for(const s of[-1,1]){const ex=s*headR*0.5;ctx.beginPath();ctx.ellipse(ex,-headR*0.15,2.8,bk?0.3:2.5,0,0,Math.PI*2);ctx.fillStyle="#f0f0f0";ctx.fill();ctx.strokeStyle=dc;ctx.lineWidth=0.4;ctx.stroke();if(!bk){ctx.beginPath();ctx.arc(ex+lt*0.4,-headR*0.15+0.2,1.4,0,Math.PI*2);ctx.fillStyle=isDark?"#1a1a2e":"#2a2a3e";ctx.fill();ctx.beginPath();ctx.arc(ex+lt*0.4+0.6,-headR*0.15-0.4,0.6,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.7)";ctx.fill();}}
    ctx.beginPath();ctx.ellipse(0,headR*0.25,1.2,0.8,0,0,Math.PI*2);ctx.fillStyle=dc;ctx.fill();
    ctx.beginPath();ctx.arc(0,headR*0.4,1.5,0.1,Math.PI-0.1);ctx.strokeStyle=dc;ctx.lineWidth=0.5;ctx.stroke();
  }

  if((pet.action==="excited"||pet.action==="walk")&&pet.action!=="sleep"){ctx.save();ctx.globalAlpha=0.2;for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*headR*0.6,headR*0.15,2.5,1.5,0,0,Math.PI*2);ctx.fillStyle="#E8A080";ctx.fill();}ctx.restore();}
  ctx.restore();ctx.restore();

  ctx.save();ctx.globalAlpha=0.12;
  ctx.beginPath();ctx.ellipse(px,pet.y+pet.jumpY+(sitting?2:legH+1),6+(pet.jumpY>0?pet.jumpY*0.08:0),2+(pet.jumpY>0?pet.jumpY*0.05:0),0,0,Math.PI*2);
  ctx.fillStyle="#000";ctx.fill();ctx.restore();
}

function updatePet(dt, W) {
  pet.timer+=dt; pet.blink=Math.max(0,pet.blink-dt*0.003);
  if(pet.blink===0&&Math.random()<0.002) pet.blink=1;
  if(pet.jumpY>0||pet.jumpVy!==0){pet.jumpVy-=0.002*dt;pet.jumpY+=pet.jumpVy*dt*0.06;if(pet.jumpY<=0){pet.jumpY=0;pet.jumpVy=0;}}
  pet.earAngle=Math.sin(pet.timer*0.001)*0.1;
  if(agentBusy&&pet.action!=="excited"&&pet.action!=="sleep"&&Math.random()<0.003){pet.action="excited";pet.jumpVy=3;pet.timer=0;}
  switch(pet.action){
    case"sleep":if(pet.timer>3000+Math.random()*3000){pet.action="idle";pet.timer=0;}break;
    case"scratch":if(pet.timer>1200+Math.random()*800){pet.action="idle";pet.timer=0;}break;
    case"idle":if(pet.timer>1500+Math.random()*2000){const r=Math.random();if(r<0.3){pet.action="walk";pet.targetX=clamp(pet.x+(Math.random()>0.5?1:-1)*rand(30,100),PET_W,W-PET_W);pet.timer=0;pet.dir=pet.targetX>pet.x?1:-1;}else if(r<0.45){pet.action="look";pet.timer=0;}else if(r<0.5){pet.action="scratch";pet.timer=0;}else{pet.action="walk";pet.targetX=clamp(pet.x+(Math.random()>0.5?1:-1)*rand(30,100),PET_W,W-PET_W);pet.timer=0;pet.dir=pet.targetX>pet.x?1:-1;}}break;
    case"look":if(pet.timer>800+Math.random()*600){pet.action="idle";pet.timer=0;}pet.lookX=Math.sin(pet.timer*0.004)*5;break;
    case"walk":{const sp=agentBusy?0.08:0.04;const dx=pet.targetX-pet.x;if(Math.abs(dx)<2){pet.action="idle";pet.timer=0;}else{pet.x+=Math.sign(dx)*sp*dt;}if(agentBusy&&Math.random()<0.002)pet.jumpVy=2.5;break;}
    case"excited":if(pet.timer>600){pet.action="idle";pet.timer=0;}else if(pet.timer>200&&pet.timer%300<20)pet.jumpVy=2;pet.lookX=Math.sin(pet.timer*0.01)*3;pet.x=clamp(pet.x+Math.sin(pet.timer*0.006)*0.01*dt,PET_W,W-PET_W);break;
  }
  pet.tailPhase+=agentBusy?0.06*dt*0.06:0.02*dt*0.06;
}

function spawnBird(W){const s=Math.random()>0.5;particles.push({x:s?-10:W+10,y:10+rand(0,20),vx:s?rand(0.3,0.8):rand(-0.8,-0.3),vy:rand(-0.05,0.05),life:1,maxLife:300+rand(0,200),type:"bird",size:1});}
function spawnLeaf(W){particles.push({x:rand(0,W),y:rand(40,70),vx:rand(-0.15,0.15),vy:rand(0.1,0.25),life:1,maxLife:400+rand(0,300),type:"leaf",size:1.5+rand(0,1)});}
function spawnFirefly(W){particles.push({x:rand(0,W),y:rand(50,GROUND_Y-5),vx:rand(-0.1,0.1),vy:rand(-0.1,0.1),life:1,maxLife:500+rand(0,400),type:"firefly",size:1+rand(0,0.5)});}
function spawnRippleAt(x,y){for(let i=0;i<3;i++)particles.push({x,y:y+rand(-1,1),vx:0,vy:0,life:1,maxLife:40+i*10,type:"ripple",size:2+i*2});}
function spawnSparkles(x,y,c){for(let i=0;i<c;i++)particles.push({x:x+rand(-5,5),y:y+rand(-5,5),vx:rand(-0.2,0.2),vy:rand(-0.5,-0.1),life:1,maxLife:30+rand(0,30),type:"sparkle",size:1.5+rand(0,1)});}

function hitTest(x,y,W){
  if(Math.abs(x-pet.x)<15&&Math.abs(y-(pet.y+pet.jumpY))<15)return"pet";
  const cx=W*0.8,cy=isDark?16:20; if(Math.abs(x-cx)<20&&Math.abs(y-cy)<20)return"celestial";
  if(y>=70&&y<=83)return"river"; if(y>=45&&y<=70)return"trees";
  return"ground";
}

const canvas=document.getElementById("petbar-canvas"), ctx=canvas.getContext("2d");
const container=document.getElementById("petbar-root");

let W, clickCd=0, lastTime, birdTimer=0, leafTimer=0, fireflyTimer=0;

function resize(){W=container.clientWidth;canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;canvas.style.width=W+"px";canvas.style.height=H+"px";}
resize();window.addEventListener("resize",resize);

function getCY(e){const r=canvas.getBoundingClientRect();const raw=e.clientY-r.top;return collapsed?raw/0.37:raw;}
canvas.addEventListener("mousemove",e=>{const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;});
canvas.addEventListener("mouseleave",()=>{mouseX=null;});
canvas.addEventListener("click",e=>{
  const now=performance.now(); if(now-clickCd<200)return; clickCd=now;
  const r=canvas.getBoundingClientRect(), cx=e.clientX-r.left, cy=getCY(e), hit=hitTest(cx,cy,W);
  switch(hit){
    case"pet":if(pet.jumpY<1){pet.jumpVy=5;pet.action="excited";pet.timer=0;}spawnSparkles(pet.x,pet.y-10,8);break;
    case"celestial":isDark=!isDark;spawnSparkles(W*0.8,isDark?16:20,12);break;
    case"river":spawnRippleAt(cx,cy);break;
    case"trees":for(let i=0;i<3;i++)spawnBird(W);break;
    case"ground":spawnSparkles(cx,cy,5);break;
  }
});

document.getElementById("btn-excite").onclick=()=>{if(pet.jumpY<1){pet.jumpVy=5;pet.action="excited";pet.timer=0;}spawnSparkles(pet.x,pet.y-10,8);};
document.getElementById("btn-toggle").onclick=()=>{isDark=!isDark;};
document.getElementById("btn-bird").onclick=()=>{for(let i=0;i<5;i++)spawnBird(W);};
document.getElementById("chk-busy").onchange=e=>{agentBusy=e.target.checked;};
document.getElementById("chk-collapse").onchange=e=>{collapsed=e.target.checked;container.classList.toggle("collapsed",collapsed);};

lastTime=performance.now();
function loop(now){
  const dt=Math.min(now-lastTime,50); lastTime=now; const t=performance.now();
  if(W===0){requestAnimationFrame(loop);return;}
  updatePet(dt,W);

  birdTimer+=dt;if(birdTimer>4000+Math.random()*3000){birdTimer=0;if(Math.random()<0.3)spawnBird(W);}
  leafTimer+=dt;if(leafTimer>800+Math.random()*600){leafTimer=0;spawnLeaf(W);}
  if(isDark){fireflyTimer+=dt;if(fireflyTimer>600+Math.random()*400){fireflyTimer=0;if(particles.filter(p=>p.type==="firefly").length<6)spawnFirefly(W);}}

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life+=dt*0.002;p.x+=p.vx;p.y+=p.vy;if(p.type==="bird")p.vy+=Math.sin(t*0.01+p.x)*0.005;if(p.type==="leaf")p.vx+=Math.sin(t*0.003+p.x)*0.003;if(p.life>=p.maxLife||p.x<-30||p.x>W+30)particles.splice(i,1);}

  ctx.save();ctx.scale(devicePixelRatio,devicePixelRatio);
  drawScene(ctx,W,t);
  drawPet(ctx,t,mouseX);
  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
