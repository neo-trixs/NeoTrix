<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NeoTrix · PetBar Showcase</title>
<style>
  :root {
    --bg: #f0ebe3; --card-bg: rgba(255,255,255,0.72); --card-border: rgba(0,0,0,0.06);
    --text: #1a1a20; --text2: #5a5a62; --text3: #909098;
    --shadow: 0 8px 40px rgba(0,0,0,0.07); --btn-bg: rgba(0,0,0,0.04); --btn-hover: rgba(0,0,0,0.08);
    --accent: #C4944A; --accent2: #E85454;
  }
  [data-theme="dark"] {
    --bg: #12121a; --card-bg: rgba(30,30,40,0.82); --card-border: rgba(255,255,255,0.06);
    --text: #e8e8ec; --text2: #909098; --text3: #606068;
    --shadow: 0 8px 40px rgba(0,0,0,0.3); --btn-bg: rgba(255,255,255,0.05); --btn-hover: rgba(255,255,255,0.09);
    --accent: #D4A84E; --accent2: #FF6B6B;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; font-family: -apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Noto Sans SC",sans-serif; }
  body {
    background: var(--bg); color: var(--text);
    display: flex; align-items: center; justify-content: center;
    padding: 24px; transition: background 0.3s;
    position: relative; overflow: hidden;
  }
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(ellipse 60% 50% at 20% 80%, rgba(196,148,74,0.06) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 85% 20%, rgba(196,148,74,0.04) 0%, transparent 55%);
  }
  [data-theme="dark"] body::before {
    background: radial-gradient(ellipse 60% 50% at 20% 80%, rgba(200,150,80,0.08) 0%, transparent 60%),
                radial-gradient(ellipse 50% 60% at 85% 20%, rgba(200,150,80,0.05) 0%, transparent 55%);
  }
  .app {
    position: relative; z-index: 1;
    width: 100%; max-width: 960px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .header {
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 {
    font-size: 20px; font-weight: 600; letter-spacing: -0.02em;
  }
  .header h1 span { color: var(--accent); }
  .header-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 14px; border-radius: 10px; border: 1px solid var(--card-border);
    background: var(--btn-bg); color: var(--text2); font-size: 12px; font-weight: 500;
    cursor: pointer; transition: all 0.15s; font-family: inherit;
    white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hover); color: var(--text); }
  .btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
  .btn-icon { padding: 6px; width: 30px; height: 30px; justify-content: center; }

  .card {
    background: var(--card-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 20px; border: 1px solid var(--card-border);
    box-shadow: var(--shadow); overflow: hidden;
  }
  .card-title {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--card-border);
    font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px;
  }
  .card-title .badge {
    display: flex; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 500; color: var(--text3); text-transform: none; letter-spacing: 0;
  }
  .card-title .badge svg { width: 12px; height: 12px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .dot.on { background: #4CAF50; }
  .dot.off { background: var(--text3); }

  /* PetBar container */
  .pet-wrap {
    position: relative; width: 100%; overflow: hidden; cursor: pointer;
    transition: height 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
  }
  .pet-wrap canvas {
    display: block; width: 100%; height: 100%;
    transform-origin: top center;
    transition: transform 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
  }

  /* Controls panel */
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px;
    border-top: 1px solid var(--card-border); align-items: center;
  }
  .controls .group {
    display: flex; align-items: center; gap: 4px;
    padding: 2px 4px; border-radius: 8px; background: var(--btn-bg);
  }
  .controls .group .btn { border: none; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 11px; }
  .controls .group .btn.on { background: var(--accent); color: #fff; }
  .controls .sep { width: 1px; height: 20px; background: var(--card-border); margin: 0 4px; }
  .controls .label { font-size: 10px; color: var(--text3); font-weight: 500; text-transform: uppercase; letter-spacing: 0.3px; margin-right: 2px; }

  .info-bar {
    display: flex; flex-wrap: wrap; gap: 12px; padding: 10px 20px;
    border-top: 1px solid var(--card-border);
    font-size: 11px; color: var(--text2); font-family: "SF Mono","JetBrains Mono",Menlo,monospace;
  }
  .info-bar .stat { display: flex; align-items: center; gap: 4px; }
  .info-bar .stat .val { color: var(--accent); font-weight: 600; }

  .legend {
    display: flex; flex-wrap: wrap; gap: 4px 12px; padding: 0 20px 12px;
    font-size: 10px; color: var(--text3);
  }
  .legend span { display: flex; align-items: center; gap: 3px; cursor: default; }
  .legend .swatch { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

  .size-slider { -webkit-appearance: none; width: 60px; height: 3px; border-radius: 3px; background: var(--text3); outline: none; }
  .size-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); cursor: pointer; }

  /* Toast */
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    padding: 8px 20px; border-radius: 10px; background: var(--text); color: var(--bg);
    font-size: 12px; font-weight: 500;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15); opacity: 0;
    transition: opacity 0.25s, transform 0.25s; pointer-events: none; z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .controls { flex-direction: column; align-items: stretch; }
    .controls .group { justify-content: center; }
    .header h1 { font-size: 16px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1>🦊 <span>PetBar</span> Showcase</h1>
    <div class="header-actions">
      <button class="btn" onclick="toggleTheme()" title="Toggle theme">
        <svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5" stroke="currentColor" fill="none"/><line x1="7" y1="1.5" x2="7" y2="3"/><line x1="7" y1="11" x2="7" y2="12.5"/><line x1="1.5" y1="7" x2="3" y2="7"/><line x1="11" y1="7" x2="12.5" y2="7"/></svg>
        <span id="themeLabel">浅色</span>
      </button>
    </div>
  </div>

  <div class="card">
    <div class="card-title">
      <span>🌄 迷你森林场景</span>
      <span class="badge">
        <span class="dot on" id="statusDot"></span>
        <span id="statusLabel">运行中</span>
      </span>
    </div>

    <div class="pet-wrap" id="petWrap">
      <canvas id="petCanvas"></canvas>
    </div>

    <div class="controls">
      <div class="group">
        <span class="label">主题</span>
        <button class="btn on" id="thmDay" onclick="setThemeMode('day')">☀️ 昼</button>
        <button class="btn" id="thmNight" onclick="setThemeMode('night')">🌙 夜</button>
        <button class="btn" id="thmAuto" onclick="setThemeMode('auto')">🔄 自动</button>
      </div>

      <div class="sep"></div>

      <div class="group">
        <span class="label">模式</span>
        <button class="btn" id="collapseBtn" onclick="toggleCollapse()">📐 折叠</button>
        <button class="btn" onclick="toggleScale()">🔍 <span id="scaleLabel">1x</span></button>
      </div>

      <div class="sep"></div>

      <div class="group">
        <span class="label">触发</span>
        <button class="btn" onclick="triggerPet()">🦊 宠</button>
        <button class="btn" onclick="triggerSun()">☀️ 星</button>
        <button class="btn" onclick="triggerBirds()">🐦 鸟</button>
        <button class="btn" onclick="triggerRiver()">🌊 水</button>
        <button class="btn" onclick="triggerGround()">✨ 地</button>
      </div>
    </div>

    <div class="info-bar">
      <span class="stat">宠状态: <span class="val" id="petState">idle</span></span>
      <span class="stat">宠位置: <span class="val" id="petPos">—</span></span>
      <span class="stat">粒子数: <span class="val" id="particleCount">0</span></span>
      <span class="stat">FPS: <span class="val" id="fps">60</span></span>
    </div>

    <div class="legend">
      <span><span class="swatch" style="background:#C4944A"></span>点宠 → 跳+星</span>
      <span><span class="swatch" style="background:#FFD59A"></span>点日/月 → 昼夜</span>
      <span><span class="swatch" style="background:#6a98b8"></span>点河 → 涟漪</span>
      <span><span class="swatch" style="background:#5a8a4a"></span>点树 → 飞鸟</span>
      <span><span class="swatch" style="background:#a0b088"></span>点地 → 星芒</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const H_BASE = 130;
let H = H_BASE, SHOW_H = H_BASE, SCALE_MODE = 1; // 1x or 2x
const GROUND_Y = 95, PET_W = 18;
let isDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
let themeMode = "auto"; // "day" | "night" | "auto"
let nightToggle = false;
let collapsed = false;

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._hide); t._hide = setTimeout(() => t.classList.remove('show'), 1500);
}

function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,l,h){return Math.max(l,Math.min(h,v))}
function noise(x){const n=Math.sin(x*12.9898+78.233)*43758.5453;return n-Math.floor(n)}
function fbm(x,o){let v=0,amp=0.5,freq=1;for(let i=0;i<o;i++){v+=amp*noise(x*freq);freq*=2;amp*=0.5}return v}
function mountainH(x,W,seed){return fbm(x/W*3+seed,5)*28+fbm(x/W*6+seed*2,3)*8+6}

// ── Draw helpers ──
function drawMountain(ctx,W,baseY,hScale,seed,color,shadowColor,snowColor,snowLine){
  const pts=[];
  ctx.beginPath();ctx.moveTo(0,baseY+hScale);
  for(let x=0;x<=W;x+=2){const y=baseY+hScale-mountainH(x,W,seed)*(hScale/40);ctx.lineTo(x,y);pts.push({x,y})}
  ctx.lineTo(W,baseY+hScale);ctx.closePath();ctx.fillStyle=color;ctx.fill();
  ctx.beginPath();
  for(let i=Math.floor(pts.length/3);i<pts.length;i++){const p=pts[i];i===Math.floor(pts.length/3)?ctx.moveTo(p.x,p.y):ctx.lineTo(p.x,p.y)}
  ctx.lineTo(W,baseY+hScale);ctx.lineTo(pts[Math.floor(pts.length/3)].x,baseY+hScale);ctx.closePath();ctx.fillStyle=shadowColor;ctx.fill();
  const snowH=snowLine+5+fbm(seed*3,2)*6;
  ctx.beginPath();let started=false;
  for(const p of pts){if(p.y<baseY+snowH){if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}else started=false}
  ctx.strokeStyle=snowColor;ctx.lineWidth=2.5;ctx.lineCap="round";ctx.stroke();
  ctx.beginPath();started=false;
  for(const p of pts){if(p.y<baseY+snowH-3){if(!started){ctx.moveTo(p.x,p.y);started=true}else ctx.lineTo(p.x,p.y)}else started=false}
  ctx.strokeStyle=snowColor;ctx.lineWidth=4;ctx.globalAlpha=0.3;ctx.stroke();ctx.globalAlpha=1;
}

function drawTree(ctx,x,baseY,h,w,isDark,isPine){
  const trunkH=h*0.2,crownH=h-trunkH;
  ctx.strokeStyle=isDark?"#3a2a1a":"#5a3a28";ctx.lineWidth=Math.max(1.5,w*0.18);ctx.lineCap="round";
  ctx.beginPath();ctx.moveTo(x,baseY);ctx.lineTo(x,baseY-trunkH);ctx.stroke();
  ctx.save();ctx.globalAlpha=0.06;ctx.fillStyle="#000";ctx.beginPath();ctx.ellipse(x+1.5,baseY,w*0.3,crownH*0.08,0,0,Math.PI*2);ctx.fill();ctx.restore();
  if(isPine){
    for(let i=0;i<4;i++){
      const ty=baseY-trunkH-crownH*i/4,tw=w*(1-i*0.2),th=crownH/4*0.9;
      const shade=isDark?12+i*4:30+i*8,hue=isDark?130+i*5:115+i*3;
      ctx.fillStyle=`hsl(${hue},${isDark?30:45}%,${shade}%)`;
      ctx.beginPath();ctx.moveTo(x,ty);ctx.quadraticCurveTo(x-tw/2,ty+th*0.4,x-tw*0.35,ty+th);
      ctx.lineTo(x+tw*0.35,ty+th);ctx.quadraticCurveTo(x+tw/2,ty+th*0.4,x,ty);ctx.closePath();ctx.fill();
    }
    ctx.fillStyle=isDark?"rgba(100,180,100,0.08)":"rgba(160,220,120,0.12)";
    ctx.beginPath();ctx.ellipse(x,baseY-trunkH-crownH*0.15,w*0.2,crownH*0.08,0,0,Math.PI*2);ctx.fill();
  }else{
    const hue=isDark?45:80,sat=isDark?25:50,light=isDark?20:38;
    const colors=[`hsl(${hue},${sat}%,${light+8}%)`,`hsl(${hue-5},${sat+5}%,${light}%)`,`hsl(${hue-10},${sat+10}%,${light-5}%)`];
    ctx.fillStyle=colors[2];ctx.beginPath();ctx.ellipse(x,baseY-trunkH-crownH*0.5,w*0.5,crownH*0.45,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=colors[1];ctx.beginPath();ctx.ellipse(x-w*0.12,baseY-trunkH-crownH*0.55,w*0.38,crownH*0.38,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(x+w*0.14,baseY-trunkH-crownH*0.55,w*0.35,crownH*0.35,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=colors[0];ctx.beginPath();ctx.ellipse(x,baseY-trunkH-crownH*0.65,w*0.3,crownH*0.3,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=isDark?"rgba(180,200,120,0.06)":"rgba(200,230,160,0.1)";
    ctx.beginPath();ctx.ellipse(x-w*0.08,baseY-trunkH-crownH*0.7,w*0.12,crownH*0.08,-0.3,0,Math.PI*2);ctx.fill();
  }
}

// ── Enhanced scene: 4th mountain layer + waterfall + cabin ──
function drawScene(ctx,W,t,isDark,particles,S){
  const GY=GROUND_Y*S;

  // Sky gradient
  const sky=ctx.createLinearGradient(0,0,0,GY+10*S);
  if(isDark){sky.addColorStop(0,"#0a0a18");sky.addColorStop(0.25,"#151530");sky.addColorStop(0.5,"#252340");sky.addColorStop(0.75,"#353050");sky.addColorStop(1,"#454060")}
  else{sky.addColorStop(0,"#f7e8d0");sky.addColorStop(0.25,"#f3e0c5");sky.addColorStop(0.5,"#edd5b5");sky.addColorStop(0.75,"#e5cda8");sky.addColorStop(1,"#dcc0a0")}
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,GY+10*S);

  // Stars
  if(isDark)for(let i=0;i<45;i++){const sx=((i*131.7+23)*(i%7+1))%W,sy=(((i*89.3+11)%65)*S)+((i*7)%4)*S;
    const tw=0.3+Math.sin(t*1.8+i*3.1)*0.3;ctx.globalAlpha=Math.max(0,tw*0.55);ctx.fillStyle=i%5===0?"#ffe8b0":"#fff";
    const r=0.25+(i%4)*0.12;ctx.beginPath();ctx.arc(sx,sy,r*Math.min(1,S+0.3),0,Math.PI*2);ctx.fill()
    // Constellation lines (every 3 stars)
    if(i%3===0&&i<42){const sx2=((i+3)*131.7+23)%W,sy2=((((i+3)*89.3+11)%65)*S);ctx.globalAlpha=0.06;ctx.strokeStyle="#888";ctx.lineWidth=0.3;
      ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx2,sy2);ctx.stroke()}
  }
  ctx.globalAlpha=1;

  // Shooting star
  if(isDark&&Math.sin(t*0.0003+1.5)>0.97){
    const ssx=((t*0.02+50)%W),ssy=((t*0.01+10)%20)*S;
    ctx.save();ctx.globalAlpha=0.6;ctx.strokeStyle="rgba(255,255,255,0.6)";ctx.lineWidth=0.5;
    ctx.beginPath();ctx.moveTo(ssx,ssy);ctx.lineTo(ssx+20*S,ssy+4*S);ctx.stroke();
    const sg=ctx.createRadialGradient(ssx,ssy,0,ssx,ssy,3*S);sg.addColorStop(0,"rgba(255,255,255,0.8)");sg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle=sg;ctx.beginPath();ctx.arc(ssx,ssy,3*S,0,Math.PI*2);ctx.fill();ctx.restore();
  }

  // Celestial
  const cx=W*0.8,cy=(isDark?14:18)*S;
  if(isDark){
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,22*S);g.addColorStop(0,"rgba(230,220,200,1)");g.addColorStop(0.2,"rgba(230,220,200,0.35)");g.addColorStop(1,"rgba(230,220,200,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,22*S,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e6dcc8";ctx.beginPath();ctx.arc(cx,cy,5*S,0,Math.PI*2);ctx.fill();
    ctx.fillStyle="rgba(200,190,170,0.25)";ctx.beginPath();ctx.arc(cx-1.3*S,cy-0.8*S,0.8*S,0,Math.PI*2);ctx.fill();
    const mg=ctx.createRadialGradient(cx,cy,0,cx,cy,50*S);mg.addColorStop(0,"rgba(200,200,255,0.04)");mg.addColorStop(1,"rgba(200,200,255,0)");
    ctx.fillStyle=mg;ctx.beginPath();ctx.arc(cx,cy,50*S,0,Math.PI*2);ctx.fill();
  }else{
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,35*S);g.addColorStop(0,"rgba(255,210,120,0.7)");g.addColorStop(0.3,"rgba(255,200,100,0.2)");g.addColorStop(1,"rgba(255,200,100,0)");
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,35*S,0,Math.PI*2);ctx.fill();ctx.fillStyle="#FFD59A";ctx.beginPath();ctx.arc(cx,cy,6.5*S,0,Math.PI*2);ctx.fill();
    // Sun rays (animated rotation)
    ctx.save();ctx.globalAlpha=0.07;
    for(let i=0;i<10;i++){const a=t*0.0004+i/10*Math.PI*2+Math.sin(t*0.0001)*0.3;ctx.fillStyle="#FFD59A";
      ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*16*S,cy+Math.sin(a)*16*S,5*S,1.2*S,a,0,Math.PI*2);ctx.fill()}
    ctx.restore();
    // Sun glow rays
    ctx.save();ctx.globalAlpha=0.03;
    for(let i=0;i<16;i++){const a=i/16*Math.PI*2;ctx.fillStyle="#FFF5E0";
      ctx.beginPath();ctx.ellipse(cx+Math.cos(a)*25*S,cy+Math.sin(a)*25*S,12*S,0.8*S,a,0,Math.PI*2);ctx.fill()}
    ctx.restore();
  }

  // Distant mist layer (very back)
  ctx.save();ctx.globalAlpha=isDark?0.04:0.05;
  ctx.fillStyle=isDark?"#3a3550":"#e8ddd0";
  ctx.beginPath();ctx.ellipse(W*0.5+Math.sin(t*0.05)*20,20*S,W*0.55,6*S,0,0,Math.PI*2);ctx.fill();
  ctx.restore();

  // Clouds (enhanced)
  ctx.save();ctx.globalAlpha=isDark?0.12:0.25;
  for(let i=0;i<5;i++){const cxx=((i*150+60+t*(5+i*2.5))%(W+120))-60,cyy=(8+i*5.5+Math.sin(i*2.1)*2.5)*S,cw=30+i*14;
    ctx.fillStyle=isDark?"#555":"#fff";
    ctx.beginPath();ctx.ellipse(cxx,cyy,cw*0.45,3.2*S,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cxx-cw*0.2,cyy+0.6*S,cw*0.28,2.2*S,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(cxx+cw*0.22,cyy+1*S,cw*0.32,2.8*S,0,0,Math.PI*2);ctx.fill();
    // Cloud shadow on ground
    if(!isDark){ctx.globalAlpha=0.03;ctx.fillStyle="#888";
      const shx=cxx-15*S,shy=(85+Math.sin(i*0.5)*3)*S;
      ctx.beginPath();ctx.ellipse(shx,shy,cw*0.3,2*S,0,0,Math.PI*2);ctx.fill()}
  }
  ctx.restore();

  // ── 4 MOUNTAIN LAYERS (one extra distant) ──
  // Layer 4: very distant (faint)
  const dAlpha=isDark?0.25:0.2;
  ctx.save();ctx.globalAlpha=dAlpha;
  drawMountain(ctx,W,8*S,28*S,5.7,isDark?"#4a4560":"#d4c8b8",isDark?"#3a3550":"#c4b8a8","rgba(200,200,220,0.15)","rgba(255,255,255,0.15)",16*S);
  ctx.restore();

  // Layer 3: far
  drawMountain(ctx,W,16*S,36*S,1.3,isDark?"#3a3548":"#c8bca8",isDark?"#2e2a3a":"#b8a898",isDark?"rgba(200,200,220,0.3)":"rgba(255,255,255,0.35)",20*S);
  // Layer 2: mid
  drawMountain(ctx,W,26*S,32*S,2.7,isDark?"#2e2a3a":"#b4a894",isDark?"#221f2c":"#a49884",isDark?"rgba(200,200,220,0.25)":"rgba(255,255,255,0.3)",26*S);
  // Layer 1: front
  drawMountain(ctx,W,36*S,26*S,4.1,isDark?"#221f2c":"#a09484",isDark?"#1a1722":"#908478",isDark?"rgba(180,180,200,0.2)":"rgba(255,255,255,0.25)",30*S);

  // Waterfall on closest mountain
  ctx.save();ctx.globalAlpha=isDark?0.12:0.15;
  const wfx=W*0.25,wfy=32*S;
  ctx.fillStyle=isDark?"rgba(200,220,255,0.2)":"rgba(200,230,255,0.25)";
  for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(wfx+Math.sin(i*2)*2*S,wfy+Math.sin(t*0.3+i)*1.5*S+i*8*S,1.2*S,3*S,0,0,Math.PI*2);ctx.fill()}
  ctx.restore();

  // Small cabin on hillside (depth detail)
  ctx.save();ctx.globalAlpha=isDark?0.35:0.3;
  const cbx=W*0.72,cby=34*S,cs=4*S;
  ctx.fillStyle=isDark?"#3a2a1a":"#6a4a3a";ctx.fillRect(cbx-cs*0.6,cby-cs*0.5,cs*1.2,cs*0.5);
  ctx.fillStyle=isDark?"#5a3a2a":"#8a6a5a";ctx.beginPath();ctx.moveTo(cbx-cs*0.7,cby-cs*0.5);ctx.lineTo(cbx,cby-cs*0.9);ctx.lineTo(cbx+cs*0.7,cby-cs*0.5);ctx.closePath();ctx.fill();
  ctx.fillStyle=isDark?"#d0c868":"#f0e060";ctx.fillRect(cbx-cs*0.1,cby-cs*0.35,cs*0.2,cs*0.35);
  ctx.restore();

  // Ridge detail lines
  ctx.save();ctx.globalAlpha=isDark?0.12:0.1;
  for(let r=0;r<3;r++){ctx.strokeStyle=isDark?"#4a4560":"#b8a898";ctx.lineWidth=0.4;
    ctx.beginPath();const by=(30+r*10)*S;
    for(let x=0;x<=W;x+=4){const y=by+mountainH(x,W,2.8+r*0.9)*0.3*S;x===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}ctx.stroke()}
  ctx.restore();

  // Background forest (deciduous)
  ctx.save();
  for(let i=0;i<22;i++){const tx=((i*73+19)*(i%5+1))%W,th=(12+(i*11)%8)*S,tw=(7+(i*7)%5)*S;
    ctx.globalAlpha=isDark?0.5:0.45;drawTree(ctx,tx,(56-th*0.25)*S,th,tw,isDark,false)}
  ctx.restore();

  // Mid forest (pine)
  ctx.save();
  for(let i=0;i<18;i++){const tx=((i*97+37)*(i%3+1))%W,th=(10+(i*13)%10)*S,tw=(4+(i*5)%4)*S;
    ctx.globalAlpha=isDark?0.6:0.55;drawTree(ctx,tx,(60-th*0.2)*S,th,tw,isDark,true)}
  ctx.restore();

  // River
  const riverYs=[70,72,74,76,78],riverColors=isDark?["#1a2a40","#1e3050","#223860","#1e3050","#1a2a40"]:["#6a98b8","#7aa8c8","#86b4d0","#7aa8c8","#6a98b8"];
  for(let i=0;i<riverYs.length;i++){ctx.save();ctx.globalAlpha=0.3+i*0.07;ctx.fillStyle=riverColors[i];ctx.beginPath();
    ctx.moveTo(0,riverYs[i]*S);for(let x=0;x<=W;x+=3)ctx.lineTo(x,riverYs[i]*S+Math.sin(x*0.018+t*0.4+i*1.3)*1.8*S);
    ctx.lineTo(W,(riverYs[i]+2)*S);ctx.lineTo(0,(riverYs[i]+2)*S);ctx.closePath();ctx.fill();ctx.restore()}

  // River foam edges
  ctx.save();ctx.globalAlpha=isDark?0.08:0.12;
  for(let side of[-1,1]){ctx.fillStyle=isDark?"#3a4a60":"#b8d0d8";
    ctx.beginPath();ctx.moveTo(0,73*S+side*3*S);
    for(let x=0;x<=W;x+=3)ctx.lineTo(x,73*S+side*3*S+Math.sin(x*0.015+t*0.3)*1.2*S);
    ctx.lineTo(W,73*S);ctx.lineTo(0,73*S);ctx.closePath();ctx.fill()}
  // Additional foam lines
  ctx.globalAlpha=isDark?0.06:0.08;
  for(let i=0;i<3;i++){ctx.strokeStyle=isDark?"#5a7090":"#c8dce8";ctx.lineWidth=0.5;
    ctx.beginPath();const fy=71+i*2.5*S;
    for(let x=0;x<=W;x+=5){ctx.lineTo(x,fy+Math.sin(x*0.03+t*0.5+i*2)*0.8*S)}ctx.stroke()}
  ctx.restore();

  // River shimmer
  ctx.save();ctx.globalAlpha=0.2;
  for(let i=0;i<10;i++){const sx=((t*18+i*65+Math.sin(i*2.3)*12)%(W+40))-20,sy=(72+Math.sin(i*1.7+t*0.35)*2.5)*S;
    ctx.fillStyle=isDark?"rgba(180,200,240,0.2)":"rgba(255,255,255,0.35)";ctx.beginPath();ctx.ellipse(sx,sy,(1.5+Math.sin(t*0.4+i)*0.8)*S,0.6*S,0.3,0,Math.PI*2);ctx.fill()}
  ctx.restore();

  // Reflection of sun/moon
  ctx.save();
  for(let i=0;i<5;i++){const ry=(75+i*2.5)*S;ctx.globalAlpha=((isDark?0.1:0.12)-i*0.02)*(S>0.5?1:1.5);
    ctx.fillStyle=isDark?"#e6dcc8":"#FFD59A";ctx.beginPath();ctx.ellipse(W*0.8,ry+Math.sin(t+i*1.5)*1*S,(9-i*1.8)*S,0.8*S,0,0,Math.PI*2);ctx.fill()}
  ctx.restore();

  // Ground
  const gg=ctx.createLinearGradient(0,GY,0,H*S);
  if(isDark){gg.addColorStop(0,"#2a3520");gg.addColorStop(0.3,"#1e2818");gg.addColorStop(0.6,"#182214");gg.addColorStop(1,"#121c0e")}
  else{gg.addColorStop(0,"#b8c8a0");gg.addColorStop(0.3,"#a0b088");gg.addColorStop(0.6,"#88a070");gg.addColorStop(1,"#709058")}
  ctx.fillStyle=gg;ctx.fillRect(0,GY,W,H*S-GY);

  // Ground texture dots
  ctx.save();ctx.globalAlpha=0.04;
  for(let i=0;i<40;i++){const gx=(i*37+13)%W,gy=GY+2*S+((i*23)%(H*S-GY-2*S));ctx.fillStyle=isDark?"#4a6040":"#8aa870";ctx.beginPath();ctx.arc(gx,gy,0.5*S,0,Math.PI*2);ctx.fill()}
  ctx.restore();

  // Grass patches
  for(let i=0;i<30;i++){const gx=(i*43+7)%W,gy=GY+(2+(i*13)%16)*S,gh=(1.5+(i*11)%3.5)*S,a=0.2+(i%5)*0.08;
    ctx.save();ctx.globalAlpha=a*(S>0.5?1:0.8);ctx.strokeStyle=isDark?"#3a5530":"#6a8a50";ctx.lineWidth=Math.max(0.4,0.6*S);
    ctx.beginPath();ctx.moveTo(gx,gy);ctx.lineTo(gx-0.6*S,gy-gh);ctx.moveTo(gx,gy);ctx.lineTo(gx+0.7*S,gy-gh*0.6);
    ctx.moveTo(gx,gy);ctx.lineTo(gx+0.25*S,gy-gh*1.2);ctx.stroke();ctx.restore()}

  // Flowers
  for(let i=0;i<10;i++){const fx=((i*97+29)*(i%2+1))%W,fy=GY+(5+(i*17)%20)*S,fc=isDark?["#d07080","#80a0d0","#d0b070","#b080d0","#70d0a0"][i%5]:["#e8a0b0","#b0d0f0","#f0d8a0","#d0b0f0","#a0e0c0"][i%5],fs=Math.min(1,S+0.4);
    ctx.save();ctx.globalAlpha=0.5*fs;
    for(let p=0;p<5;p++){const a=p/5*Math.PI*2+0.3;ctx.beginPath();ctx.arc(fx+Math.cos(a)*1.2*S,fy+Math.sin(a)*1.2*S,0.6*S,0,Math.PI*2);ctx.fillStyle=fc;ctx.fill()}
    ctx.fillStyle=isDark?"#d0c878":"#f0e888";ctx.beginPath();ctx.arc(fx,fy,0.4*S,0,Math.PI*2);ctx.fill();ctx.restore()}

  // Rocks
  for(let i=0;i<6;i++){const rx=(i*89+37)%W,ry=GY+(6+(i*13)%14)*S,rs=(2+(i*5)%3.5)*S;
    ctx.beginPath();ctx.ellipse(rx,ry,rs,rs*0.45,0,0,Math.PI*2);ctx.fillStyle=isDark?"#444040":"#8a8070";ctx.fill();
    ctx.fillStyle=isDark?"#555050":"#9a9080";ctx.beginPath();ctx.ellipse(rx-rs*0.2,ry-rs*0.1,rs*0.35,rs*0.22,-0.3,0,Math.PI*2);ctx.fill()}

  // Foreground vignette
  const eg=ctx.createLinearGradient(0,H*S-20*S,0,H*S);eg.addColorStop(0,"transparent");eg.addColorStop(1,isDark?"rgba(0,0,0,0.35)":"rgba(0,0,0,0.08)");
  ctx.fillStyle=eg;ctx.fillRect(0,H*S-20*S,W,20*S);

  // ── Particles ──
  for(const p of particles){const lr=clamp(p.life/p.maxLife,0,1);ctx.save();ctx.globalAlpha=lr*(p.alpha??1);
    switch(p.type){
      case"leaf":{const c=isDark?`hsl(35,25%,${20+lr*15}%)`:`hsl(30,55%,${40+lr*20}%)`;ctx.fillStyle=c;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.x*0.1+t);ctx.scale(S,S);
        ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*0.45,0,0,Math.PI*2);ctx.fill();ctx.restore();break}
      case"petal":{const c=isDark?`hsl(330,40%,${35+lr*20}%)`:`hsl(330,60%,${55+lr*20}%)`;ctx.fillStyle=c;ctx.globalAlpha=lr*0.5;
        ctx.save();ctx.translate(p.x,p.y);ctx.rotate(t+p.x);ctx.scale(S,S);
        ctx.beginPath();ctx.ellipse(0,0,p.size,p.size*0.3,0,0,Math.PI*2);ctx.fill();ctx.restore();break}
      case"butterfly":{
        const bw=Math.sin(t*0.01+p.x)*1.5*S;ctx.globalAlpha=lr*0.7;
        ctx.fillStyle=isDark?"#d0a0b0":"#e8b0c8";
        ctx.beginPath();ctx.ellipse(p.x-0.8*S,p.y,p.size*0.5*S-bw*0.3,p.size*0.3*S,-0.2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=isDark?"#b08090":"#d0a0b0";
        ctx.beginPath();ctx.ellipse(p.x+0.8*S,p.y,p.size*0.5*S+bw*0.3,p.size*0.3*S,0.2,0,Math.PI*2);ctx.fill();
        ctx.fillStyle=isDark?"#2a2a3e":"#4a3a4e";ctx.beginPath();ctx.ellipse(p.x,p.y,0.3*S,0.6*S,0,0,Math.PI*2);ctx.fill();break}
      case"firefly":{const g=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*4*S);
        g.addColorStop(0,`rgba(255,255,200,${0.5*lr})`);g.addColorStop(1,"rgba(255,255,200,0)");
        ctx.fillStyle=g;ctx.beginPath();ctx.arc(p.x,p.y,p.size*4*S,0,Math.PI*2);ctx.fill();
        ctx.fillStyle="#ffffd0";ctx.beginPath();ctx.arc(p.x,p.y,p.size*S,0,Math.PI*2);ctx.fill();break}
      case"ripple":ctx.strokeStyle=isDark?"rgba(200,220,255,0.35)":"rgba(255,255,255,0.45)";ctx.lineWidth=0.4*S;ctx.globalAlpha=(1-lr)*0.35;
        ctx.beginPath();ctx.ellipse(p.x,p.y,p.size*(1+(1-lr)*2.5)*S,p.size*0.25*(1+(1-lr)*2.5)*S,0,0,Math.PI*2);ctx.stroke();break
      case"bird":ctx.strokeStyle=isDark?"#555":"#666";ctx.lineWidth=Math.max(0.4,0.8*S);ctx.globalAlpha=lr*0.55;
        const ww=Math.sin(t*5+p.x)*1.5;
        ctx.beginPath();ctx.moveTo(p.x-2*S,p.y);ctx.quadraticCurveTo(p.x-0.6*S,p.y-(1.5+ww)*S,p.x,p.y);ctx.stroke();
        ctx.beginPath();ctx.moveTo(p.x+2*S,p.y);ctx.quadraticCurveTo(p.x+0.6*S,p.y-(1.5-ww)*S,p.x,p.y);ctx.stroke();break
      case"sparkle":{const sg=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*2*S);
        sg.addColorStop(0,`rgba(255,255,220,${lr})`);sg.addColorStop(1,"rgba(255,255,220,0)");
        ctx.fillStyle=sg;ctx.beginPath();ctx.arc(p.x,p.y,p.size*2*S,0,Math.PI*2);ctx.fill();break}
      case"glow":{const g2=ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*3*S);
        g2.addColorStop(0,`rgba(255,220,180,${0.4*lr})`);g2.addColorStop(1,"rgba(255,220,180,0)");
        ctx.fillStyle=g2;ctx.beginPath();ctx.arc(p.x,p.y,p.size*3*S,0,Math.PI*2);ctx.fill();break}
    }ctx.restore()}
}

// ── Pet ──
function drawPet(ctx,pet,t,isDark,mouseX,S){
  const px=pet.x,py=(pet.y+pet.jumpY)*S;ctx.save();ctx.translate(px,py);
  const sc=Math.min(1,S+0.15);ctx.scale(sc,sc);
  const bodyW=12,bodyH=9,headR=7,earH=5,earW=4,legH=4;
  const bodyColor=isDark?"#D4A84E":"#C4944A",bodyLight=isDark?"#e0c060":"#d4a858",bellyColor="#E8D5A3",darkColor="#8A6A2E";
  // Tail
  ctx.save();const tw=Math.sin(t*0.001*(pet.action==="excited"?8:3)+pet.tailPhase);
  ctx.translate(-bodyW*0.4,-bodyH*0.2+Math.sin(t*0.002)*0.5);ctx.rotate(0.4+tw*0.3);
  ctx.beginPath();ctx.ellipse(0,-legH-2,2.5,4.5,0.2,0,Math.PI*2);ctx.fillStyle=bodyColor;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-legH-4,1.8,2.5,0,0,Math.PI*2);ctx.fillStyle=bodyLight;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-legH-5.5,1,1.2,0,0,Math.PI*2);ctx.fillStyle=bellyColor;ctx.fill();ctx.restore();
  const wc=pet.action==="walk"||pet.action==="excited",sitting=pet.action==="sleep"||pet.action==="scratch";
  const lp=wc?Math.sin(t*0.008):0,lp2=wc?Math.sin(t*0.008+Math.PI):0.3;
  if(sitting){for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*3,legH*0.5,2.5,1.5,0,0,Math.PI*2);ctx.fillStyle=bodyColor;ctx.fill()}}
  else{
    for(const s of[-1,1]){const lh=legH+(wc?Math.max(0,s>0?lp:lp2):0)*1.5;
      ctx.beginPath();ctx.moveTo(s*3.5,0);ctx.lineTo(s*3.5,lh);ctx.strokeStyle=darkColor;ctx.lineWidth=1.8;ctx.lineCap="round";ctx.stroke();
      ctx.beginPath();ctx.arc(s*3.5,lh,1.2,0,Math.PI*2);ctx.fillStyle=darkColor;ctx.fill()}
    for(const s of[-1,1]){const lh=legH+(wc?Math.max(0,s>0?lp2:lp):0.5)*1.5;
      ctx.beginPath();ctx.moveTo(s*1.2,0);ctx.lineTo(s*1.2,lh);ctx.strokeStyle=darkColor;ctx.lineWidth=1.8;ctx.lineCap="round";ctx.stroke();
      ctx.beginPath();ctx.arc(s*1.2,lh,1.2,0,Math.PI*2);ctx.fillStyle=darkColor;ctx.fill()}}
  ctx.beginPath();ctx.ellipse(0,-bodyH*0.3,bodyW*0.5,bodyH*0.5,0,0,Math.PI*2);ctx.fillStyle=bodyColor;ctx.fill();
  ctx.beginPath();ctx.ellipse(0,-bodyH*0.1,bodyW*0.3,bodyH*0.3,0,0,Math.PI*2);ctx.fillStyle=bellyColor;ctx.fill();
  ctx.fillStyle=bodyLight;ctx.globalAlpha=0.3;ctx.beginPath();ctx.ellipse(-bodyW*0.2,-bodyH*0.45,bodyW*0.15,bodyH*0.2,-0.3,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  const headY=sitting?-bodyH*0.3:-bodyH*0.5-headR*0.5;ctx.save();ctx.translate(0,headY);
  const earAngle=pet.earAngle+(pet.action==="excited"?0.3:(pet.action==="sleep"?-0.15:0));
  for(const s of[-1,1]){ctx.save();ctx.translate(s*earW*0.6,-headR*0.3);ctx.rotate(s*earAngle);
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-earW*0.5,-earH);ctx.lineTo(earW*0.5,-earH);ctx.closePath();ctx.fillStyle=bodyColor;ctx.fill();
    ctx.beginPath();ctx.moveTo(0,-2);ctx.lineTo(-earW*0.3,-earH+2);ctx.lineTo(earW*0.3,-earH+2);ctx.closePath();ctx.fillStyle=bellyColor;ctx.fill();ctx.restore()}
  if(pet.action==="sleep"){
    ctx.beginPath();ctx.ellipse(0,0,headR,headR*0.9,0,0,Math.PI*2);ctx.fillStyle=bodyColor;ctx.fill();
    ctx.beginPath();ctx.ellipse(0,headR*0.2,headR*0.6,headR*0.4,0,0,Math.PI*2);ctx.fillStyle=bellyColor;ctx.fill();
    for(const s of[-1,1]){const ex=s*headR*0.5;ctx.beginPath();ctx.arc(ex,-headR*0.15,1.8,0,Math.PI);ctx.strokeStyle=darkColor;ctx.lineWidth=0.8;ctx.stroke()}
    ctx.beginPath();ctx.arc(0,headR*0.25,1,0,Math.PI*2);ctx.fillStyle=darkColor;ctx.fill();
    ctx.save();ctx.fillStyle=isDark?"rgba(200,200,255,0.35)":"rgba(100,100,180,0.25)";ctx.font="5px sans-serif";
    for(let i=0;i<3;i++){ctx.globalAlpha=0.25-i*0.06;ctx.fillText("z",6+i*4+Math.sin(t*0.001+i)*1,-headR-5-i*5)}ctx.restore()
  }else{
    ctx.beginPath();ctx.ellipse(0,0,headR,headR*0.9,0,0,Math.PI*2);ctx.fillStyle=bodyColor;ctx.fill();
    ctx.beginPath();ctx.ellipse(0,headR*0.2,headR*0.6,headR*0.4,0,0,Math.PI*2);ctx.fillStyle=bellyColor;ctx.fill();
    const lookTarget=mouseX!==null?clamp((mouseX-pet.x)*0.02,-1.5,1.5):pet.lookX*0.01,blinking=pet.blink>0;
    for(const s of[-1,1]){const ex=s*headR*0.5;ctx.beginPath();ctx.ellipse(ex,-headR*0.15,2.8,blinking?0.3:2.5,0,0,Math.PI*2);ctx.fillStyle="#f0f0f0";ctx.fill();
      ctx.strokeStyle=darkColor;ctx.lineWidth=0.4;ctx.stroke();if(!blinking){ctx.beginPath();ctx.arc(ex+lookTarget*0.4,-headR*0.15+0.2,1.4,0,Math.PI*2);ctx.fillStyle=isDark?"#1a1a2e":"#2a2a3e";ctx.fill();
        ctx.beginPath();ctx.arc(ex+lookTarget*0.4+0.6,-headR*0.15-0.4,0.6,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.7)";ctx.fill()
        // Pupil highlight
        ctx.beginPath();ctx.arc(ex+lookTarget*0.4+0.4,-headR*0.15-0.5,0.3,0,Math.PI*2);ctx.fillStyle="rgba(255,255,255,0.4)";ctx.fill()}}
    ctx.beginPath();ctx.ellipse(0,headR*0.25,1.2,0.8,0,0,Math.PI*2);ctx.fillStyle=darkColor;ctx.fill();
    ctx.beginPath();ctx.arc(0,headR*0.4,1.5,0.1,Math.PI-0.1);ctx.strokeStyle=darkColor;ctx.lineWidth=0.5;ctx.stroke();
    ctx.beginPath();ctx.arc(0,headR*0.35,0.4,0,Math.PI*2);ctx.fillStyle=darkColor;ctx.fill();
    ctx.save();ctx.globalAlpha=0.12;ctx.strokeStyle=darkColor;ctx.lineWidth=0.3;
    for(const s of[-1,1]){ctx.beginPath();ctx.moveTo(s*2,headR*0.25);ctx.lineTo(s*5,headR*0.1);ctx.stroke();
      ctx.beginPath();ctx.moveTo(s*2,headR*0.25);ctx.lineTo(s*5.5,headR*0.35);ctx.stroke();}
    ctx.restore();
  }
  if(pet.action==="excited"||pet.action==="walk"){ctx.save();ctx.globalAlpha=0.18;
    for(const s of[-1,1]){ctx.beginPath();ctx.ellipse(s*headR*0.6,headR*0.15,2.5,1.5,0,0,Math.PI*2);ctx.fillStyle="#E8A080";ctx.fill()}ctx.restore()}
  ctx.restore();ctx.restore();
  ctx.save();ctx.globalAlpha=0.1;ctx.beginPath();ctx.ellipse(px,(pet.y+pet.jumpY)*S+(sitting?2:legH+1)*sc,6*sc,2*sc,0,0,Math.PI*2);ctx.fillStyle="#000";ctx.fill();ctx.restore()
}

function updatePet(pet,dt,W,agentBusy){
  pet.timer+=dt;pet.blink=Math.max(0,pet.blink-dt*0.003);
  if(pet.blink===0&&Math.random()<0.0015)pet.blink=1;
  if(pet.jumpY>0||pet.jumpVy!==0){pet.jumpVy-=0.0018*dt;pet.jumpY+=pet.jumpVy*dt*0.06;if(pet.jumpY<=0){pet.jumpY=0;pet.jumpVy=0}}
  pet.earAngle=Math.sin(pet.timer*0.001)*0.1;
  if(agentBusy&&pet.action!=="excited"&&pet.action!=="sleep"&&Math.random()<0.003){pet.action="excited";pet.jumpVy=3;pet.timer=0}
  switch(pet.action){
    case"sleep":if(pet.timer>3000+Math.random()*3000){pet.action="idle";pet.timer=0}break;
    case"scratch":if(pet.timer>1200+Math.random()*800){pet.action="idle";pet.timer=0}break;
    case"idle":if(pet.timer>1500+Math.random()*2000){const r=Math.random();
      if(r<0.35){pet.action="walk";pet.targetX=clamp(pet.x+(Math.random()>0.5?1:-1)*rand(40,120),PET_W,W-PET_W);pet.timer=0;pet.dir=pet.targetX>pet.x?1:-1}
      else if(r<0.5){pet.action="look";pet.timer=0}else if(r<0.56){pet.action="scratch";pet.timer=0}
      else{pet.action="walk";pet.targetX=clamp(pet.x+(Math.random()>0.5?1:-1)*rand(40,120),PET_W,W-PET_W);pet.timer=0;pet.dir=pet.targetX>pet.x?1:-1}}break;
    case"look":if(pet.timer>800+Math.random()*600){pet.action="idle";pet.timer=0}pet.lookX=Math.sin(pet.timer*0.004)*5;break;
    case"walk":{const speed=agentBusy?0.08:0.04,dx=pet.targetX-pet.x;if(Math.abs(dx)<2){pet.action="idle";pet.timer=0}else{pet.x+=Math.sign(dx)*speed*dt;pet.dir=dx>0?1:-1}if(agentBusy&&Math.random()<0.002)pet.jumpVy=2.5;break}
    case"excited":if(pet.timer>600){pet.action="idle";pet.timer=0}else if(pet.timer>200&&pet.timer%300<20)pet.jumpVy=2;pet.lookX=Math.sin(pet.timer*0.01)*3;pet.x=clamp(pet.x+Math.sin(pet.timer*0.006)*0.008*dt,PET_W,W-PET_W);break
  }
  pet.tailPhase+=agentBusy?0.06*dt*0.06:0.02*dt*0.06
}

// ── Init ──
const canvas=document.getElementById("petCanvas"),cont=document.getElementById("petWrap");
if(!canvas||!cont)throw"no canvas";
const ctx=canvas.getContext("2d");if(!ctx)throw"no ctx";

let W=0,t=0,anim=0,lastTime=performance.now(),mouseX=null;
let clickCd=0;
const particles=[];
const pet={x:60,y:GROUND_Y-2,targetX:100,action:"idle",step:0,timer:0,earAngle:0,tailPhase:0,lookX:0,jumpY:0,jumpVy:0,blink:0,dir:1,sitTimer:0};
let birdTimer=0,leafTimer=0,fireflyTimer=0,butterflyTimer=0;
let fpsFrames=0,fpsTime=0,currentFps=60;

function resize(){
  SHOW_H = SCALE_MODE === 2 ? H_BASE * 2 : H_BASE;
  H = SHOW_H;
  const w=cont.clientWidth;W=w;
  canvas.width=w*devicePixelRatio;canvas.height=H*devicePixelRatio;
  canvas.style.width=w+"px";canvas.style.height=H+"px";
}
resize();new ResizeObserver(resize).observe(cont);

function getScaleY(){return collapsed?48/H:1}

function getIsDark(){
  if(themeMode==="day")return false;
  if(themeMode==="night")return true;
  const sys = window.matchMedia("(prefers-color-scheme: dark)").matches;
  return nightToggle ? !sys : sys;
}

function getCanvasY(clientY){const r=canvas.getBoundingClientRect();return(clientY-r.top)/getScaleY()}

function hitTest(x,y){
  const petY=(pet.y+pet.jumpY)*(collapsed?48/H:1);
  if(Math.abs(x-pet.x)<14&&Math.abs(y-petY)<14)return"pet";
  const cx=W*0.8,cy=(getIsDark()?14:18)*(collapsed?48/H:1);
  if(Math.abs(x-cx)<18&&Math.abs(y-cy)<18)return"celestial";
  if(y>=68&&y<=82)return"river";if(y>=40&&y<=68)return"trees";return"ground"
}

canvas.addEventListener("mousemove",function(e){const r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left});
canvas.addEventListener("mouseleave",function(){mouseX=null});
canvas.addEventListener("click",function(e){
  const now=performance.now();if(now-clickCd<200)return;clickCd=now;
  const r=canvas.getBoundingClientRect(),cx=e.clientX-r.left,cy=getCanvasY(e.clientY),hit=hitTest(cx,cy);
  const S=getScaleY();
  switch(hit){
    case"pet":if(pet.jumpY<1){pet.jumpVy=5;pet.action="excited";pet.timer=0}
      for(let i=0;i<10;i++)particles.push({x:pet.x+rand(-4,4),y:(pet.y-10)+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)});
      for(let i=0;i<6;i++)particles.push({x:pet.x+rand(-6,6),y:pet.y+rand(-6,6),vx:rand(-0.05,0.05),vy:rand(-0.08,-0.02),life:1,maxLife:40+rand(0,30),type:"glow",size:1.5+rand(0,1)});toast("🦊 *跳跃+星光*");break
    case"celestial":nightToggle=!nightToggle;
      for(let i=0;i<15;i++)particles.push({x:W*0.8+rand(-6,6),y:(getIsDark()?14:18)+rand(-6,6),vx:rand(-0.05,0.05),vy:rand(-0.08,-0.02),life:1,maxLife:40+rand(0,30),type:"glow",size:1.5+rand(0,1)});
      for(let i=0;i<8;i++)particles.push({x:W*0.8+rand(-4,4),y:(getIsDark()?14:18)+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)});
      toast(getIsDark()?"🌙 夜晚模式":"☀️ 白天模式");break
    case"river":for(let i=0;i<4;i++)particles.push({x:cx,y:cy+rand(-0.5,0.5),vx:0,vy:0,life:1,maxLife:35+i*10,type:"ripple",size:2+i*1.5});
      for(let i=0;i<4;i++)particles.push({x:cx+rand(-4,4),y:cy+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)});toast("🌊 涟漪荡漾");break
    case"trees":for(let i=0;i<3+Math.floor(Math.random()*2);i++){const side=Math.random()>0.5;
        particles.push({x:side?-15:W+15,y:rand(8,22)*S,vx:side?rand(0.4,0.9):rand(-0.9,-0.4),vy:rand(-0.04,0.04),life:1,maxLife:300+rand(0,200),type:"bird",size:1})}
      for(let i=0;i<5;i++)particles.push({x:cx+rand(-3,3),y:cy,vx:rand(-0.3,0.3),vy:rand(-0.2,-0.05),life:1,maxLife:60+rand(0,40),type:"petal",size:1.5+rand(0,1)});toast("🐦 群鸟惊飞");break
    case"ground":for(let i=0;i<8;i++)particles.push({x:cx+rand(-4,4),y:cy+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)});
      for(let i=0;i<5;i++)particles.push({x:cx+rand(-6,6),y:cy+rand(-6,6),vx:rand(-0.05,0.05),vy:rand(-0.08,-0.02),life:1,maxLife:40+rand(0,30),type:"glow",size:1.5+rand(0,1)});
      for(let i=0;i<5;i++)particles.push({x:cx+rand(-3,3),y:cy,vx:rand(-0.3,0.3),vy:rand(-0.2,-0.05),life:1,maxLife:60+rand(0,40),type:"petal",size:1.5+rand(0,1)});toast("✨ 星芒闪烁");break
  }
});

function loop(now){
  const dt=Math.min(now-lastTime,50);lastTime=now;t+=dt;
  if(W===0){anim=requestAnimationFrame(loop);return}
  const isDark=getIsDark(),S=getScaleY();
  cont.style.height = (collapsed ? H * (48/H_BASE) : H) + 'px';
  cont.style.cursor = collapsed ? 'default' : 'pointer';

  // Sync HTML theme
  document.documentElement.setAttribute("data-theme",isDark?"dark":"light");

  updatePet(pet,dt,W,false);
  const agentBusy = false; // always false in preview

  // Spawn timers
  birdTimer+=dt;if(birdTimer>4000+Math.random()*3000){birdTimer=0;if(Math.random()<0.25){const side=Math.random()>0.5;particles.push({x:side?-12:W+12,y:rand(8,22)*S,vx:side?rand(0.4,0.9):rand(-0.9,-0.4),vy:rand(-0.04,0.04),life:1,maxLife:300+rand(0,200),type:"bird",size:1})}}
  leafTimer+=dt;if(leafTimer>700+Math.random()*500){leafTimer=0;particles.push({x:rand(0,W),y:rand(0.35,0.55)*H,vx:rand(-0.12,0.12),vy:rand(0.08,0.2),life:1,maxLife:400+rand(0,300),type:"leaf",size:1.2+rand(0,0.8)})}
  if(isDark){fireflyTimer+=dt;if(fireflyTimer>500+Math.random()*400){fireflyTimer=0;if(particles.filter(p=>p.type==="firefly").length<5)particles.push({x:rand(0,W),y:rand(0.45,0.75)*H,vx:rand(-0.08,0.08),vy:rand(-0.08,0.08),life:1,maxLife:500+rand(0,400),type:"firefly",size:1+rand(0,0.5)})}}
  // Butterflies (daytime only)
  if(!isDark){butterflyTimer+=dt;if(butterflyTimer>3000+Math.random()*2000){butterflyTimer=0;if(particles.filter(p=>p.type==="butterfly").length<3)particles.push({x:rand(20,W-20),y:rand(60,85)*S,vx:rand(-0.15,0.15),vy:rand(-0.08,0.08),life:1,maxLife:600+rand(0,400),type:"butterfly",size:2+rand(0,1.5)})}}

  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life+=dt*0.002;p.x+=p.vx;p.y+=p.vy;
    if(p.type==="bird")p.vy+=Math.sin(t*0.01+p.x)*0.005;
    if(p.type==="leaf"||p.type==="petal"||p.type==="butterfly")p.vx+=Math.sin(t*0.003+p.x)*0.003;
    if(p.type==="butterfly")p.vy+=Math.cos(t*0.005+p.y)*0.003;
    if(p.life>=p.maxLife||p.x<-30||p.x>W+30)particles.splice(i,1)}

  ctx.save();ctx.scale(devicePixelRatio,devicePixelRatio);
  drawScene(ctx,W,t,isDark,particles,S);
  drawPet(ctx,pet,t,isDark,mouseX,S);
  ctx.restore();

  // Info update
  document.getElementById("petState").textContent=pet.action;
  document.getElementById("petPos").textContent=Math.round(pet.x)+","+Math.round(pet.y+pet.jumpY);
  document.getElementById("particleCount").textContent=particles.length;
  fpsFrames++;if(now-fpsTime>1000){currentFps=fpsFrames;fpsFrames=0;fpsTime=now;document.getElementById("fps").textContent=currentFps}

  anim=requestAnimationFrame(loop)
}
anim=requestAnimationFrame(loop);

// ── Controls ──
function setThemeMode(mode){
  themeMode=mode;
  document.getElementById("thmDay").classList.toggle("on",mode==="day");
  document.getElementById("thmNight").classList.toggle("on",mode==="night");
  document.getElementById("thmAuto").classList.toggle("on",mode==="auto");
  toast(mode==="day"?"☀️ 白天模式":mode==="night"?"🌙 夜间模式":"🔄 跟随系统");
}
function toggleCollapse(){
  collapsed=!collapsed;
  document.getElementById("collapseBtn").classList.toggle("on",collapsed);
  document.getElementById("collapseBtn").textContent=collapsed?"📐 展开":"📐 折叠";
  toast(collapsed?"📐 已折叠":"📐 已展开");
}
function toggleScale(){
  SCALE_MODE = SCALE_MODE === 1 ? 2 : 1;
  document.getElementById("scaleLabel").textContent=SCALE_MODE+"x";
  toast("🔍 缩放: "+SCALE_MODE+"x");
  resize();
}
function triggerPet(){if(pet.jumpY<1){pet.jumpVy=5;pet.action="excited";pet.timer=0}const S=getScaleY();
  for(let i=0;i<10;i++)particles.push({x:pet.x+rand(-4,4),y:(pet.y-10)+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)});
  for(let i=0;i<6;i++)particles.push({x:pet.x+rand(-6,6),y:pet.y+rand(-6,6),vx:rand(-0.05,0.05),vy:rand(-0.08,-0.02),life:1,maxLife:40+rand(0,30),type:"glow",size:1.5+rand(0,1)});toast("🦊 *跳跃+星光*")}
function triggerSun(){nightToggle=!nightToggle;const S=getScaleY();const isDark=getIsDark();
  for(let i=0;i<15;i++)particles.push({x:W*0.8+rand(-6,6),y:(isDark?14:18)*S+rand(-6,6),vx:rand(-0.05,0.05),vy:rand(-0.08,-0.02),life:1,maxLife:40+rand(0,30),type:"glow",size:1.5+rand(0,1)});
  for(let i=0;i<8;i++)particles.push({x:W*0.8+rand(-4,4),y:(isDark?14:18)*S+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)})
  toast(isDark?"🌙 夜晚模式":"☀️ 白天模式")}
function triggerBirds(){const S=getScaleY();
  for(let i=0;i<3+Math.floor(Math.random()*2);i++){const side=Math.random()>0.5;particles.push({x:side?-15:W+15,y:rand(8,22)*S,vx:side?rand(0.4,0.9):rand(-0.9,-0.4),vy:rand(-0.04,0.04),life:1,maxLife:300+rand(0,200),type:"bird",size:1})}
  for(let i=0;i<5;i++)particles.push({x:W*0.5+rand(-3,3),y:70*S,vx:rand(-0.3,0.3),vy:rand(-0.2,-0.05),life:1,maxLife:60+rand(0,40),type:"petal",size:1.5+rand(0,1)});toast("🐦 群鸟惊飞")}
function triggerRiver(){const S=getScaleY();
  for(let i=0;i<4;i++)particles.push({x:W*0.5+rand(-10,10),y:73*S+rand(-2,2),vx:0,vy:0,life:1,maxLife:35+i*10,type:"ripple",size:2+i*1.5});
  for(let i=0;i<4;i++)particles.push({x:W*0.5+rand(-4,4),y:73*S+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)});toast("🌊 涟漪荡漾")}
function triggerGround(){const S=getScaleY();
  for(let i=0;i<8;i++)particles.push({x:W*0.5+rand(-4,4),y:GY*S+rand(-4,4),vx:rand(-0.15,0.15),vy:rand(-0.4,-0.08),life:1,maxLife:25+rand(0,25),type:"sparkle",size:1.5+rand(0,1)});
  for(let i=0;i<5;i++)particles.push({x:W*0.5+rand(-6,6),y:GY*S+rand(-6,6),vx:rand(-0.05,0.05),vy:rand(-0.08,-0.02),life:1,maxLife:40+rand(0,30),type:"glow",size:1.5+rand(0,1)});toast("✨ 星芒闪烁")}
function toggleTheme(){
  const isD = document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",isD?"light":"dark");
  document.getElementById("themeLabel").textContent=isD?"浅色":"深色";
}
</script>
