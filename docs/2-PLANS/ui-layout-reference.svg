<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" font-family="system-ui, sans-serif">
  <defs>
    <style>
      .bg { fill: #F5F2EC; }
      .tbar { fill: #ECE9E3; stroke: rgba(0,0,0,0.06); }
      .sbar { fill: #ECE9E3; stroke: rgba(0,0,0,0.06); }
      .sidebar { fill: #EAE7E1; stroke: rgba(0,0,0,0.06); }
      .main { fill: #F5F2EC; }
      .rb { fill: #EAE7E1; stroke: rgba(0,0,0,0.06); }
      .dot { fill: none; stroke: rgba(0,0,0,0.15); stroke-width: 0.5; }
      .dot-r { fill: #ff5f57; }
      .dot-y { fill: #febc2e; }
      .dot-g { fill: #28c840; }
      .text-title { fill: #3A3A42; font-size: 11px; font-weight: 600; }
      .text-label { fill: #707078; font-size: 9px; font-weight: 500; }
      .text-body { fill: #5A5A62; font-size: 10px; }
      .text-dim { fill: #909098; font-size: 8px; }
      .tab-on { fill: rgba(232,84,84,0.12); stroke: rgba(232,84,84,0.2); rx: 6; }
      .tab-text { fill: #E85454; font-size: 10px; font-weight: 600; }
      .tab-off-text { fill: #909098; font-size: 10px; font-weight: 500; }
      .card { fill: #EFECE6; stroke: rgba(0,0,0,0.06); rx: 8; }
      .card-header { fill: #F2EFE9; stroke: rgba(0,0,0,0.04); rx: 6; }
      .vh { fill: #F2EFE9; stroke: rgba(0,0,0,0.06); }
      .accent { fill: #E85454; }
      .accent-light { fill: rgba(232,84,84,0.08); }
      .green { fill: #4CAF50; }
      .yellow { fill: #FFC107; }
      .bar { fill: rgba(0,0,0,0.04); rx: 3; }
      .bar-f { fill: #E85454; rx: 3; }
      .icon { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- Background -->
  <rect class="bg" width="1000" height="650" rx="16"/>

  <!-- ═══ Title Bar ═══ -->
  <rect class="tbar" x="0" y="0" width="1000" height="38" rx="0"/>
  <circle class="dot-r" cx="18" cy="19" r="5"/>
  <circle class="dot-y" cx="34" cy="19" r="5"/>
  <circle class="dot-g" cx="50" cy="19" r="5"/>
  <line x1="64" y1="6" x2="64" y2="32" stroke="rgba(0,0,0,0.1)" stroke-width="1"/>
  <text class="text-title" x="74" y="24">NeoTrix</text>

  <!-- Tabs -->
  <rect class="tab-on" x="145" y="7" width="64" height="24"/>
  <text class="tab-text" x="157" y="23">💬 对话</text>
  <text class="tab-off-text" x="230" y="23">👥 协同</text>
  <text class="tab-off-text" x="310" y="23">💻 代码</text>
  <text class="tab-off-text" x="390" y="23">⚙️ 设置</text>

  <!-- Titlebar right actions -->
  <rect x="940" y="10" width="18" height="18" rx="5" fill="rgba(0,0,0,0.03)"/>
  <circle cx="949" cy="19" r="7" fill="rgba(0,0,0,0.04)"/>
  <text x="951" y="23" font-size="9" fill="rgba(0,0,0,0.4)" font-weight="700">N</text>

  <!-- ═══ Status Bar ═══ -->
  <rect class="sbar" x="0" y="612" width="1000" height="38"/>

  <!-- ═══ Sidebar ═══ -->
  <rect class="sidebar" x="0" y="38" width="220" height="574"/>
  <text class="text-label" x="12" y="56">导航</text>

  <!-- Nav items -->
  <rect class="accent-light" x="8" y="62" width="204" height="28" rx="6"/>
  <text x="38" y="81" font-size="11" fill="#E85454" font-weight="600">+ 新对话</text>

  <rect x="8" y="94" width="204" height="28" rx="6" fill="transparent"/>
  <text x="38" y="113" font-size="11" fill="#707078">📁 项目</text>

  <rect x="8" y="126" width="204" height="28" rx="6" fill="transparent"/>
  <text x="38" y="145" font-size="11" fill="#707078">▶ 成果</text>

  <rect x="8" y="158" width="204" height="28" rx="6" fill="transparent"/>
  <text x="38" y="177" font-size="11" fill="#707078">⚙ 自定义</text>

  <!-- Recent -->
  <text class="text-label" x="12" y="210">最近</text>
  <circle cx="20" cy="227" r="3" class="accent"/>
  <text x="30" y="231" font-size="10" fill="#5A5A62">复刻桌面APP UI设计</text>
  <text x="185" y="231" font-size="8" fill="#909098">2h</text>

  <!-- ═══ Right Sidebar (collapsed) ═══ -->
  <rect class="rb" x="968" y="38" width="32" height="574"/>
  <text x="977" y="300" font-size="8" fill="#909098" transform="rotate(90, 977, 300)">预览</text>

  <!-- ═══ Main Area — Chat View ═══ -->
  <rect class="main" x="220" y="38" width="748" height="574"/>

  <!-- View Header -->
  <rect class="vh" x="220" y="38" width="748" height="36"/>
  <text class="text-title" x="236" y="62">对话</text>
  <text class="text-dim" x="280" y="62">新对话</text>
  <rect x="910" y="48" width="44" height="18" rx="6" fill="rgba(0,0,0,0.03)"/>
  <text x="920" y="61" font-size="9" fill="#707078">清空</text>

  <!-- Chat input area -->
  <rect class="card" x="240" y="540" width="708" height="56"/>
  <text x="260" y="565" font-size="11" fill="#B0B0B8">输入 / 查看技能...</text>
  <circle cx="910" cy="565" r="14" class="accent-light"/>
  <polygon points="907,562 915,568 907,574" fill="#E85454"/>

  <!-- Messages -->
  <!-- User message -->
  <rect x="550" y="90" width="180" height="36" rx="8" fill="url(#userGrad)"/>
  <text x="565" y="112" font-size="11" fill="white">分析E8状态空间</text>

  <!-- AI message - pending tool cards -->
  <rect x="260" y="140" width="320" height="62" rx="8" class="card"/>
  <rect x="262" y="142" width="28" height="28" rx="6" fill="rgba(0,0,0,0.03)"/>
  <circle cx="276" cy="156" r="8" fill="none" stroke="#E85454" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="298" y="153" font-size="10" fill="#5A5A62" font-weight="500">搜索知识库</text>
  <text x="298" y="166" font-size="9" fill="#909098">查询中...</text>
  <line x1="262" y1="178" x2="578" y2="178" stroke="rgba(0,0,0,0.03)" stroke-width="1"/>

  <!-- AI message - done -->
  <rect x="260" y="210" width="350" height="52" rx="8" class="card"/>
  <rect x="262" y="212" width="28" height="28" rx="6" fill="rgba(0,0,0,0.03)"/>
  <circle cx="276" cy="226" r="8" fill="#4CAF50" stroke="none"/>
  <text x="298" y="223" font-size="10" fill="#5A5A62" font-weight="500">搜索知识库</text>
  <text x="298" y="236" font-size="9" fill="#4CAF50">找到 3 条相关结果</text>

  <!-- AI response message -->
  <rect x="260" y="270" width="420" height="120" rx="8" class="card"/>
  <rect x="262" y="272" width="28" height="28" rx="6" fill="rgba(0,0,0,0.03)"/>
  <circle cx="276" cy="286" r="8" fill="rgba(232,84,84,0.15)" stroke="none"/>
  <text x="278" y="290" font-size="7" fill="#E85454" font-weight="700">E8</text>
  <text x="298" y="290" font-size="10" fill="#3A3A42" font-weight="500">E8状态空间</text>
  <text x="298" y="305" font-size="9" fill="#5A5A62">提供了八维推理框架：Ground、</text>
  <text x="298" y="318" font-size="9" fill="#5A5A62">Receptive、Arousal、Flow...</text>
  <!-- Code block -->
  <rect x="298" y="325" width="360" height="42" rx="6" fill="rgba(0,0,0,0.02)" stroke="rgba(0,0,0,0.06)"/>
  <text x="305" y="338" font-size="8" fill="#909098">rust</text>
  <text font-size="8" fill="#909098" x="305" y="340">fn transition(state: E8State) {</text>
  <text font-size="8" fill="#5A5A62" x="305" y="352">    match state { ... }</text>
  <text font-size="8" fill="#5A5A62" x="305" y="362">}</text>

  <!-- Message actions -->
  <text x="298" y="402" font-size="9" fill="#B0B0B8">👍 👎 ↩ 📋</text>

  <!-- Timestamp -->
  <text x="298" y="395" font-size="8" fill="#B0B0B8">14:32</text>

  <!-- ═══ Legend / Labels for sections ═══ -->
  <text x="250" y="620" font-size="8" fill="#909098">● = 交通灯 (macOS 窗口控制)</text>
  <text x="450" y="620" font-size="8" fill="#909098">| 状态栏 | Ready · 对话 1 · E8 Active</text>
  <text x="780" y="620" font-size="8" fill="#909098">NeoTrix v0.19.0</text>

  <!-- Section labels -->
  <text x="230" y="605" font-size="8" fill="#B0B0B8" font-style="italic">标题栏 (tbar)</text>
  <text x="488" y="605" font-size="8" fill="#B0B0B8" font-style="italic">内容区 (ma)</text>
  <text x="770" y="605" font-size="8" fill="#B0B0B8" font-style="italic">右侧栏 (rb)</text>
  <text x="12" y="605" font-size="8" fill="#B0B0B8" font-style="italic">侧边栏 (sb)</text>

  <!-- Arrows pointing to sections -->
  <line x1="100" y1="38" x2="100" y2="600" stroke="rgba(0,0,0,0.08)" stroke-width="1" stroke-dasharray="3 3"/>

  <defs>
    <linearGradient id="userGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E85454"/>
      <stop offset="100%" stop-color="#D04040"/>
    </linearGradient>
  </defs>
</svg>
