<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a1030"/>
      <stop offset="100%" stop-color="#06030f"/>
    </radialGradient>
    <linearGradient id="axis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="720" height="520" rx="24" fill="url(#bg)"/>

  <!-- E8 hexagram grid: 6 stacked reasoning axes (64 states) -->
  <g opacity="0.25" stroke="url(#axis)" stroke-width="1">
    <line x1="260" y1="120" x2="460" y2="120"/>
    <line x1="240" y1="160" x2="480" y2="160"/>
    <line x1="260" y1="200" x2="460" y2="200"/>
    <line x1="240" y1="240" x2="480" y2="240"/>
    <line x1="260" y1="280" x2="460" y2="280"/>
    <line x1="240" y1="320" x2="480" y2="320"/>
    <line x1="260" y1="360" x2="460" y2="360"/>
    <line x1="240" y1="400" x2="480" y2="400"/>
  </g>

  <!-- Active reasoning path (deterministic transitions) -->
  <g fill="none" stroke="url(#hg)" stroke-width="2.5" opacity="0.85">
    <circle cx="360" cy="120" r="10" fill="#c084fc"/>
    <path d="M360 130 L390 190" />
    <circle cx="390" cy="200" r="8" fill="#a78bfa"/>
    <path d="M390 208 L330 268" />
    <circle cx="330" cy="280" r="8" fill="#8b5cf6"/>
    <path d="M330 288 L420 348" />
    <circle cx="420" cy="360" r="10" fill="#3b82f6"/>
    <path d="M420 352 L360 392" stroke-dasharray="4 4" opacity="0.5"/>
  </g>

  <!-- HyperCube projection: outer + inner rotated squares -->
  <g stroke="url(#hg)" fill="none">
    <rect x="300" y="60" width="120" height="120" rx="10" opacity="0.35" stroke-width="1.2"/>
    <rect x="330" y="90" width="60" height="60" rx="6" opacity="0.6" stroke-width="1.2"
          transform="rotate(45 360 120)"/>
    <polygon points="360,64 380,120 360,176 340,120" fill="url(#hg)" opacity="0.9"/>
  </g>

  <!-- GWT resonance arcs -->
  <g fill="none" stroke="url(#hg)" stroke-width="1.5" opacity="0.35">
    <path d="M150 260 Q160 140 280 130"/>
    <path d="M440 130 Q560 140 570 260"/>
    <path d="M150 260 Q140 400 280 410"/>
    <path d="M440 410 Q580 400 570 260"/>
  </g>
  <g fill="#8b5cf6" opacity="0.8">
    <circle cx="150" cy="260" r="5"/>
    <circle cx="570" cy="260" r="5"/>
    <circle cx="280" cy="130" r="5"/>
    <circle cx="440" cy="130" r="5"/>
    <circle cx="280" cy="410" r="5"/>
    <circle cx="440" cy="410" r="5"/>
  </g>

  <!-- Connection ticks -->
  <g fill="#c084fc" opacity="0.5">
    <rect x="300" y="56" width="8" height="8" rx="2"/>
    <rect x="412" y="56" width="8" height="8" rx="2"/>
    <rect x="300" y="176" width="8" height="8" rx="2"/>
    <rect x="412" y="176" width="8" height="8" rx="2"/>
  </g>
</svg>
