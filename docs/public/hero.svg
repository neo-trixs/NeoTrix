<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520">
  <defs>
    <linearGradient id="hg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f1e8"/>
    </radialGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#faf8f2"/>
    </linearGradient>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#262419" flood-opacity="0.12"/>
    </filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="26"/>
    </filter>
  </defs>

  <!-- Inspora cream canvas -->
  <rect width="720" height="520" rx="24" fill="url(#bg)"/>

  <!-- Subtle hairline grid (inspora #e6e6e6) -->
  <g opacity="0.6" stroke="#e6e2d6" stroke-width="1">
    <line x1="40" y1="160" x2="680" y2="160"/>
    <line x1="40" y1="260" x2="680" y2="260"/>
    <line x1="40" y1="360" x2="680" y2="360"/>
    <line x1="200" y1="40" x2="200" y2="480"/>
    <line x1="360" y1="40" x2="360" y2="480"/>
    <line x1="520" y1="40" x2="520" y2="480"/>
  </g>

  <!-- E8 hexagram: 6 reasoning axes, neutral hairline -->
  <g opacity="0.45" stroke="#c9c4b4" stroke-width="1.2">
    <line x1="240" y1="120" x2="480" y2="120"/>
    <line x1="224" y1="160" x2="496" y2="160"/>
    <line x1="240" y1="200" x2="480" y2="200"/>
    <line x1="224" y1="240" x2="496" y2="240"/>
    <line x1="240" y1="280" x2="480" y2="280"/>
    <line x1="224" y1="320" x2="496" y2="320"/>
    <line x1="240" y1="360" x2="480" y2="360"/>
    <line x1="224" y1="400" x2="496" y2="400"/>
  </g>

  <!-- Active reasoning path: single amber accent -->
  <g fill="none" stroke="url(#hg)" stroke-width="2.6" opacity="0.95">
    <circle cx="360" cy="120" r="10" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <path d="M360 130 L390 189"/>
    <circle cx="390" cy="200" r="8" fill="#e8833a"/>
    <path d="M390 208 L330 271"/>
    <circle cx="330" cy="280" r="8" fill="#d97706"/>
    <path d="M330 288 L420 351"/>
    <circle cx="420" cy="360" r="10" fill="#b45309" stroke="#ffffff" stroke-width="2"/>
    <path d="M420 352 L360 392" stroke-dasharray="5 5" opacity="0.4"/>
  </g>

  <!-- Amber glow behind path (surgical, single element) -->
  <circle cx="360" cy="255" r="115" fill="#f59e0b" opacity="0.09" filter="url(#soft)"/>

  <!-- Inspora-style product tiles (right), hairline borders, white cards -->
  <g filter="url(#drop)">
    <rect x="546" y="88" width="118" height="86" rx="12" fill="url(#panel)" stroke="#e6e2d6"/>
    <rect x="562" y="102" width="86" height="6" rx="3" fill="#262419" opacity="0.85"/>
    <rect x="562" y="116" width="68" height="5" rx="2.5" fill="#c9c4b4"/>
    <rect x="562" y="128" width="78" height="5" rx="2.5" fill="#d8d3c5"/>
    <rect x="562" y="140" width="58" height="5" rx="2.5" fill="#e6e2d6"/>
    <rect x="562" y="152" width="40" height="5" rx="2.5" fill="#f59e0b" opacity="0.55"/>
  </g>

  <g filter="url(#drop)">
    <rect x="574" y="210" width="104" height="70" rx="12" fill="url(#panel)" stroke="#e6e2d6"/>
    <circle cx="596" cy="236" r="7" fill="#f59e0b" opacity="0.85"/>
    <circle cx="616" cy="236" r="7" fill="#d97706" opacity="0.7"/>
    <circle cx="636" cy="236" r="7" fill="#b45309" opacity="0.6"/>
    <rect x="590" y="254" width="70" height="5" rx="2.5" fill="#d8d3c5"/>
    <rect x="590" y="266" width="52" height="5" rx="2.5" fill="#e6e2d6"/>
  </g>

  <g filter="url(#drop)">
    <rect x="552" y="316" width="114" height="82" rx="12" fill="url(#panel)" stroke="#e6e2d6"/>
    <rect x="568" y="332" width="82" height="10" rx="4" fill="url(#hg)" opacity="0.8"/>
    <rect x="568" y="350" width="62" height="6" rx="3" fill="#c9c4b4"/>
    <rect x="568" y="364" width="74" height="6" rx="3" fill="#d8d3c5"/>
    <rect x="568" y="378" width="50" height="6" rx="3" fill="#e6e2d6"/>
  </g>

  <!-- Connective lines -->
  <g stroke="#c9c4b4" stroke-width="1.1" opacity="0.6" stroke-dasharray="3 4">
    <line x1="605" y1="174" x2="626" y2="210"/>
    <line x1="626" y1="280" x2="609" y2="316"/>
  </g>

  <!-- Bottom status chip: inspora dark pill -->
  <g filter="url(#drop)">
    <rect x="260" y="442" width="200" height="30" rx="15" fill="#262419"/>
    <circle cx="280" cy="457" r="4" fill="#f59e0b"/>
    <text x="296" y="461" font-family="monospace" font-size="12" fill="#fdfcf9" letter-spacing="1">SIGNAL · EVOLVING</text>
  </g>
</svg>
