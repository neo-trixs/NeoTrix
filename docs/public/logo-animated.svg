<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFAF3"/>
      <stop offset="50%" stop-color="#F7F0DE"/>
      <stop offset="100%" stop-color="#FCFAF3"/>
    </linearGradient>
    <linearGradient id="nucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD7AC"/>
      <stop offset="55%" stop-color="#D6AC58"/>
      <stop offset="100%" stop-color="#C2933F"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#EBE4D2" stroke-width="0.5"/>
    </pattern>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#262419" flood-opacity="0.1"/>
    </filter>
  </defs>
  <rect width="720" height="200" fill="url(#bg)"/>
  <rect width="720" height="200" fill="url(#grid)"/>

  <!-- Superbody mark: halo ring + E8 diamond nucleus + polar axis -->
  <circle cx="130" cy="100" r="44" fill="none" stroke="#E3CB94" stroke-width="1.1"/>
  <line x1="130" y1="48" x2="130" y2="152" stroke="#DCC58F" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.55"/>
  <polygon points="130,74 158,100 130,126 102,100" fill="url(#nucleus)" filter="url(#drop)"/>
  <polygon points="130,81.5 152,100 130,118.5 108,100" fill="#FCFAF3" opacity="0.85"/>

  <!-- Wordmark: warm ink -->
  <text x="200" y="95" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="4" fill="#262419">Neo—<tspan fill="#A0752E">TRIX</tspan></text>
  <text x="200" y="125" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#8F8666">The Agent That Learns to Think</text>

  <!-- Stats: muted -->
  <text x="200" y="155" font-family="monospace" font-size="9" fill="#A39A78" letter-spacing="1">474K+ LOC · 8,771 tests · 0 unsafe · 7 domains</text>

  <!-- Signal dots: light gold crescendo -->
  <circle cx="620" cy="60" r="2" fill="#E3CB94"/>
  <circle cx="635" cy="60" r="2.5" fill="#E7D2A0"/>
  <circle cx="652" cy="60" r="3" fill="#D6AC58"/>
  <circle cx="671" cy="60" r="2" fill="#F0E3C4"/>
</svg>
