<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f8f5ec"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="pg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e6e2d6" stroke-width="0.5"/>
    </pattern>
    <filter id="drop" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#262419" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="720" height="200" fill="url(#bg)"/>
  <rect width="720" height="200" fill="url(#grid)"/>

  <!-- Diamond logo (E8 core), single amber accent -->
  <polygon points="100,100 130,58 160,100 130,142" fill="url(#pg)" filter="url(#drop)"/>
  <polygon points="100,100 130,64 160,100 130,136" fill="#ffffff" opacity="0.28"/>
  <!-- Hexagram hint (6 lines), neutral -->
  <g stroke="#c9c4b4" stroke-width="1.4" opacity="0.6">
    <line x1="110" y1="154" x2="150" y2="154"/>
    <line x1="114" y1="160" x2="146" y2="160"/>
    <line x1="118" y1="166" x2="142" y2="166"/>
    <line x1="122" y1="172" x2="138" y2="172"/>
    <line x1="125" y1="178" x2="135" y2="178"/>
  </g>

  <!-- Wordmark: inspora ink -->
  <text x="200" y="95" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" letter-spacing="4" fill="#262419">Neo—<tspan fill="#b45309">TRIX</tspan></text>
  <text x="200" y="125" font-family="Georgia, serif" font-size="14" font-style="italic" fill="#8f8666">The Agent That Learns to Think</text>

  <!-- Stats: muted gray -->
  <text x="200" y="155" font-family="monospace" font-size="9" fill="#a39a78" letter-spacing="1">474K+ LOC · 8,771 tests · 0 unsafe · 7 domains</text>

  <!-- Signal dots: warm amber -->
  <circle cx="620" cy="60" r="2" fill="#c9c4b4"/>
  <circle cx="635" cy="60" r="2.5" fill="#d8d3c5"/>
  <circle cx="652" cy="60" r="3" fill="#f59e0b"/>
  <circle cx="671" cy="60" r="2" fill="#e6e2d6"/>
</svg>
