<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="nucleus" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD7AC"/>
      <stop offset="55%" stop-color="#D6AC58"/>
      <stop offset="100%" stop-color="#C2933F"/>
    </linearGradient>
    <linearGradient id="coreHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FCFAF3" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4"/>
    </filter>
  </defs>

  <!-- Halo orbit ring: the SEAL evolution loop -->
  <circle cx="60" cy="60" r="47" fill="none" stroke="#E3CB94" stroke-width="1.1"/>
  <!-- Inner echo: the mind's atmosphere -->
  <circle cx="60" cy="60" r="38" fill="none" stroke="#EBD7AC" stroke-width="0.8" opacity="0.7"/>

  <!-- Polar axis: the infinite thread (Creation of Adam) -->
  <line x1="60" y1="7" x2="60" y2="113" stroke="#DCC58F" stroke-width="0.8" stroke-dasharray="2 4" opacity="0.6"/>

  <!-- E8 diamond nucleus: the reasoning core -->
  <polygon points="60,34 86,60 60,86 34,60" fill="url(#nucleus)" filter="url(#glow)"/>
  <polygon points="60,42 78,60 60,78 42,60" fill="url(#coreHighlight)"/>

  <!-- Hexagram ticks: six binary axes of E8 -->
  <g stroke="#C9A85C" stroke-width="1" opacity="0.55" stroke-linecap="round">
    <line x1="53" y1="88.6" x2="67" y2="88.6"/>
    <line x1="54.8" y1="91.6" x2="65.2" y2="91.6"/>
    <line x1="56.6" y1="94.6" x2="63.4" y2="94.6"/>
    <line x1="58.2" y1="97.6" x2="61.8" y2="97.6"/>
  </g>
</svg>