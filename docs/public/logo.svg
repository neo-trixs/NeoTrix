<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBD9A8"/>
      <stop offset="0.5" stop-color="#C99B3F"/>
      <stop offset="1" stop-color="#96701F"/>
    </linearGradient>
    <radialGradient id="goldFill" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0%" stop-color="#F7EDCD"/>
      <stop offset="0.5" stop-color="#C99B3F"/>
      <stop offset="1" stop-color="#96701F"/>
    </radialGradient>
  </defs>

  <!-- Galaxy backdrop -->
  <rect width="120" height="120" rx="20" fill="#FCFAF3"/>
  <circle cx="60" cy="60" r="55" fill="none" stroke="#EBD9A8" stroke-width="0.9" opacity="0.6"/>

  <!-- Orbit rings -->
  <ellipse cx="60" cy="60" rx="46" ry="14" fill="none" stroke="#C99B3F" stroke-width="0.7" opacity="0.5"/>
  <ellipse cx="60" cy="60" rx="34" ry="10" fill="none" stroke="#EBD9A8" stroke-width="0.6" opacity="0.45"/>

  <!-- Qian-hexagram stellar core: three yang lines (☰) across the star -->
  <g stroke="url(#gold)" stroke-width="1" stroke-linecap="round">
    <line x1="30" y1="42" x2="90" y2="42"/>
    <line x1="30" y1="60" x2="90" y2="60"/>
    <line x1="30" y1="78" x2="90" y2="78"/>
  </g>
  <circle cx="60" cy="60" r="9" fill="url(#goldFill)" stroke="none"/>
  <circle cx="60" cy="60" r="4.5" fill="#F7E9C8" stroke="none"/>

  <!-- Constellation satellites -->
  <circle cx="20" cy="26" r="1.6" fill="#C99B3F"/>
  <circle cx="102" cy="30" r="1.6" fill="#96701F"/>
  <circle cx="18" cy="92" r="1.4" fill="#C99B3F"/>
  <circle cx="104" cy="90" r="1.4" fill="#96701F"/>
  <circle cx="40" cy="16" r="1.1" fill="#EBD9A8"/>
  <circle cx="86" cy="108" r="1.1" fill="#EBD9A8"/>
</svg>